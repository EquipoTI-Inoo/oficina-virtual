# Fase 1 — VPS Hostinger KVM 2 (uso interno). Ver docs/configuracion.md §4.
#   cp .env.example .env && docker compose up -d
name: inoo-fase1

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO_PORTAL: ${DOMINIO_PORTAL}
      DOMINIO_N8N: ${DOMINIO_N8N}
      DOMINIO_NOCODB: ${DOMINIO_NOCODB}
      CORREO_ACME: ${CORREO_ACME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Reglas extra que no van al repositorio (p. ej. la clave de acceso mientras el portal es una demo).
      - ./caddy-extra:/etc/caddy/extra:ro
      - caddy-datos:/data
      - caddy-config:/config

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ../../database/migraciones/0001_esquema.sql:/docker-entrypoint-initdb.d/01_esquema.sql:ro
      - ../../database/migraciones/0002_rol_app.sql:/docker-entrypoint-initdb.d/01b_rol_app.sql:ro
      - ../../database/migraciones/0003_api_key_usuario.sql:/docker-entrypoint-initdb.d/01c_api_key_usuario.sql:ro
      - ../../database/migraciones/0004_requerimientos.sql:/docker-entrypoint-initdb.d/01d_requerimientos.sql:ro
      - ../../database/migraciones/0005_catalogo_servicios.sql:/docker-entrypoint-initdb.d/01e_catalogo_servicios.sql:ro
      - ../../database/migraciones/0006_pagos.sql:/docker-entrypoint-initdb.d/01f_pagos.sql:ro
      - ../../database/migraciones/0007_perfil_proyecto.sql:/docker-entrypoint-initdb.d/01g_perfil_proyecto.sql:ro
      - ../../database/migraciones/0008_requerimientos_agencia.sql:/docker-entrypoint-initdb.d/01h_requerimientos_agencia.sql:ro
      - ../../database/migraciones/0009_tickets_servicio.sql:/docker-entrypoint-initdb.d/01i_tickets_servicio.sql:ro
      - ../../database/migraciones/0010_cambio_responsable.sql:/docker-entrypoint-initdb.d/01j_cambio_responsable.sql:ro
      - ../../database/migraciones/0011_avisos.sql:/docker-entrypoint-initdb.d/01k_avisos.sql:ro
      - ../../database/migraciones/0012_blogs_internos.sql:/docker-entrypoint-initdb.d/01l_blogs_internos.sql:ro
      - ../../database/migraciones/0013_estado_pago.sql:/docker-entrypoint-initdb.d/01m_estado_pago.sql:ro
      - ../../database/migraciones/0014_tareas.sql:/docker-entrypoint-initdb.d/01n_tareas.sql:ro
      - ../../database/migraciones/0015_ia_solo_crm.sql:/docker-entrypoint-initdb.d/01o_ia_solo_crm.sql:ro
      - ../../database/migraciones/0016_entregables.sql:/docker-entrypoint-initdb.d/01p_entregables.sql:ro
      - ../../database/migraciones/0017_estructura_servicios.sql:/docker-entrypoint-initdb.d/01q_estructura_servicios.sql:ro
      - ../../database/migraciones/0018_kpis_atrasos.sql:/docker-entrypoint-initdb.d/01r_kpis_atrasos.sql:ro
      - ../../database/migraciones/0019_soporte_consumo.sql:/docker-entrypoint-initdb.d/01s_soporte_consumo.sql:ro
      - ../../database/migraciones/0020_ia_cliente.sql:/docker-entrypoint-initdb.d/01t_ia_cliente.sql:ro
      - ../../database/migraciones/0021_taller_web.sql:/docker-entrypoint-initdb.d/01u_taller_web.sql:ro
      - ../../database/migraciones/0022_invitaciones.sql:/docker-entrypoint-initdb.d/01v_invitaciones.sql:ro
      - ../../database/migraciones/0023_paid_media_por_tipo.sql:/docker-entrypoint-initdb.d/01w_paid_media_por_tipo.sql:ro
      - ../../database/migraciones/0024_correos.sql:/docker-entrypoint-initdb.d/01x_correos.sql:ro
      - ../../database/migraciones/0025_standby.sql:/docker-entrypoint-initdb.d/01y_standby.sql:ro
      - ../../database/migraciones/0026_correos_entregables.sql:/docker-entrypoint-initdb.d/01z_correos_entregables.sql:ro
      - ../../database/migraciones/0027_taller_en_s3.sql:/docker-entrypoint-initdb.d/01za_taller_en_s3.sql:ro
      - ../../database/migraciones/0028_correos_directos.sql:/docker-entrypoint-initdb.d/01zb_correos_directos.sql:ro
      - ../../database/migraciones/0029_horario_correos.sql:/docker-entrypoint-initdb.d/01zc_horario_correos.sql:ro
      - ../../database/migraciones/0030_formularios_de_monday.sql:/docker-entrypoint-initdb.d/01zd_formularios_de_monday.sql:ro
      - ../../database/migraciones/0031_formularios_con_enlace.sql:/docker-entrypoint-initdb.d/01ze_formularios_con_enlace.sql:ro
      - ../../database/migraciones/0032_sin_ia_cliente.sql:/docker-entrypoint-initdb.d/01zf_sin_ia_cliente.sql:ro
      - ../../database/migraciones/0033_jarvis_por_area.sql:/docker-entrypoint-initdb.d/01zg_jarvis_por_area.sql:ro
      - ../../database/migraciones/0034_calendario_colaborador.sql:/docker-entrypoint-initdb.d/01zh_calendario_colaborador.sql:ro
      - ../../database/migraciones/0035_accesos_por_nivel.sql:/docker-entrypoint-initdb.d/01zi_accesos_por_nivel.sql:ro
      - ../../database/migraciones/0036_personas_inoowork.sql:/docker-entrypoint-initdb.d/01zj_personas_inoowork.sql:ro
      - ../../database/migraciones/0037_jarvis_sin_llaves.sql:/docker-entrypoint-initdb.d/01zk_jarvis_sin_llaves.sql:ro
      - ../../database/migraciones/0038_recordatorios.sql:/docker-entrypoint-initdb.d/01zl_recordatorios.sql:ro
      - ../../database/migraciones/0039_super_usuario.sql:/docker-entrypoint-initdb.d/01zm_super_usuario.sql:ro
      - ../../database/migraciones/0040_ingreso_portal.sql:/docker-entrypoint-initdb.d/01zn_ingreso_portal.sql:ro
      - ../../database/migraciones/0041_clientes_de_prueba.sql:/docker-entrypoint-initdb.d/01zo_clientes_de_prueba.sql:ro
      - ../../database/migraciones/0042_notificaciones_y_sesiones.sql:/docker-entrypoint-initdb.d/01zp_notificaciones_y_sesiones.sql:ro
      - ../../database/migraciones/0043_acciones_jarvis.sql:/docker-entrypoint-initdb.d/01zq_acciones_jarvis.sql:ro
      - ../../database/migraciones/0044_proyectos_culminados.sql:/docker-entrypoint-initdb.d/01zr_proyectos_culminados.sql:ro
      # Base de NocoDB y esquema de n8n, en el mismo Postgres.
      - ./iniciar-otros.sql:/docker-entrypoint-initdb.d/09_otros.sql:ro
      - postgres-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 10

  # Portal de clientes y panel del equipo, con la API real (src/servidor) sobre este Postgres.
  portal:
    build: { context: ../../apps/portal }
    restart: unless-stopped
    # Hermes corre en el mismo VPS (fuera de Docker): entra a la pasarela por 127.0.0.1:3000, sin pasar por
    # Caddy, y el portal le habla por host.docker.internal (JARVIS_HERMES).
    ports: ["127.0.0.1:3000:3000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment: &entorno-portal
      API_MODO: db
      AUTH_MODO: ${AUTH_MODO:-cognito}
      # Sin Cognito todavía: ingreso de prueba con CLAVE_DEMO, solo detrás de la clave de Caddy (caddy-extra).
      PERMITIR_AUTH_DEMO: ${PERMITIR_AUTH_DEMO:-false}
      CLAVE_DEMO: ${CLAVE_DEMO:-}
      AUTH_EQUIPO: ${AUTH_EQUIPO:-}
      INOOWORK_URL: ${INOOWORK_URL:-}
      INOOWORK_API_KEY: ${INOOWORK_API_KEY:-}
      SESION_SECRETO: ${SESION_SECRETO}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORTAL_URL: https://${DOMINIO_PORTAL}
      COGNITO_REGION: ${COGNITO_REGION}
      COGNITO_POOL_CLIENTES: ${COGNITO_POOL_CLIENTES}
      COGNITO_POOL_EQUIPO: ${COGNITO_POOL_EQUIPO}
      COGNITO_APP_CLIENTES: ${COGNITO_APP_CLIENTES}
      COGNITO_APP_EQUIPO: ${COGNITO_APP_EQUIPO}
      # Archivos en Google Drive (integrations/google/conectar.mjs drive). Si hay S3_BUCKET, manda S3.
      DRIVE_CLIENT_ID: ${DRIVE_CLIENT_ID:-}
      DRIVE_CLIENT_SECRET: ${DRIVE_CLIENT_SECRET:-}
      DRIVE_REFRESH_TOKEN: ${DRIVE_REFRESH_TOKEN:-}
      DRIVE_CARPETA_ID: ${DRIVE_CARPETA_ID:-}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      CORREOS_POR: ${CORREOS_POR:-portal}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SEGURO: ${SMTP_SEGURO:-false}
      SMTP_USUARIO: ${SMTP_USUARIO}
      SMTP_CLAVE: ${SMTP_CLAVE}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-Inoo <no-responder@inoo.pe>}
      # Vacío hasta que un workflow de n8n escuche los eventos (p. ej. http://n8n:5678/webhook/inoo-eventos).
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_WEBHOOK_SECRETO: ${N8N_WEBHOOK_SECRETO}
      IA_MODO: ${IA_MODO:-real}
      IA_TOPE_DIARIO_USD: ${IA_TOPE_DIARIO_USD:-2}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODELO: ${GEMINI_MODELO:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODELO: ${CLAUDE_MODELO:-}
      STITCH_API_KEY: ${STITCH_API_KEY}
      # IA del equipo (Jarvis y transcripciones) y llaves de los Hermes por área.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      JARVIS_HERMES: ${JARVIS_HERMES:-}
      NAVEGADOR_MODO: real
    depends_on:
      postgres: { condition: service_healthy }

  # Despachador del outbox: manda los correos por SMTP, da de alta a los invitados en Cognito y entrega los
  # eventos a n8n. Usa la etapa «build» de la imagen (trae tsx y los scripts).
  outbox:
    build: { context: ../../apps/portal, target: build }
    restart: unless-stopped
    command: ["npx", "tsx", "scripts/despachar-outbox.ts"]
    environment: *entorno-portal
    depends_on:
      postgres: { condition: service_healthy }

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${DOMINIO_N8N}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${DOMINIO_N8N}/
      GENERIC_TIMEZONE: America/Lima
      N8N_SECURE_COOKIE: "true"
      # Conexión con el portal (n8n/README.md), por la red interna del compose.
      PORTAL_API_URL: http://portal:3000
      INOO_WEBHOOK_SECRETO: ${N8N_WEBHOOK_SECRETO}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-Inoo <no-responder@inoo.pe>}
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes: [n8n-datos:/home/node/.n8n]
    depends_on:
      postgres: { condition: service_healthy }

  nocodb:
    image: nocodb/nocodb:${NOCODB_VERSION:-latest}
    restart: unless-stopped
    environment:
      NC_DB: pg://postgres:5432?u=${POSTGRES_USER}&p=${POSTGRES_PASSWORD}&d=nocodb
      NC_AUTH_JWT_SECRET: ${NOCODB_JWT_SECRET}
      NC_PUBLIC_URL: https://${DOMINIO_NOCODB}
    depends_on:
      postgres: { condition: service_healthy }

  # Respaldo diario (6 nov): en el servidor (14 días) y en el Drive de Inoo (los últimos 30). Ver respaldo/respaldar.mjs.
  respaldo:
    image: node:22-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DRIVE_CLIENT_ID: ${DRIVE_CLIENT_ID:-}
      DRIVE_CLIENT_SECRET: ${DRIVE_CLIENT_SECRET:-}
      DRIVE_REFRESH_TOKEN: ${DRIVE_REFRESH_TOKEN:-}
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache postgresql16-client >/dev/null && exec node /app/respaldar.mjs"]
    volumes: [./respaldos:/respaldos, ./respaldo/respaldar.mjs:/app/respaldar.mjs:ro]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  caddy-datos:
  caddy-config:
  postgres-datos:
  n8n-datos:
