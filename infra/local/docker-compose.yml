# Entorno de pruebas local — Portal de clientes Inoo
#
#   cd infra/local && cp .env.example .env && docker compose up --build
#
#   Portal (API simulada, datos de Figma) http://localhost:3000   → valeria@casaoliva.pe / demo1234
#   Mock del contrato completo (Prism)    http://localhost:4010
#   Postgres con esquema + semillas       localhost:5432  (inoo / inoo / oficina_virtual)
#   Correos (Mailpit, sustituye a SES)    http://localhost:8025
#   Archivos (MinIO, sustituye a S3)      http://localhost:9001  (inoo / inoo-minio-123)
#   Perfil "fase1": n8n + NocoDB          docker compose --profile fase1 up
name: inoo-pruebas

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inoo}
      POSTGRES_DB: ${POSTGRES_DB:-oficina_virtual}
    ports: ["${PUERTO_POSTGRES:-5432}:5432"]
    volumes:
      - ../../database/migraciones/0001_esquema.sql:/docker-entrypoint-initdb.d/01_esquema.sql:ro
      - ../../database/migraciones/0002_rol_app.sql:/docker-entrypoint-initdb.d/01b_rol_app.sql:ro
      - ../../database/migraciones/0003_api_key_usuario.sql:/docker-entrypoint-initdb.d/01c_api_key_usuario.sql:ro
      - ../../database/migraciones/0004_requerimientos.sql:/docker-entrypoint-initdb.d/01d_requerimientos.sql:ro
      - ../../database/migraciones/0005_catalogo_servicios.sql:/docker-entrypoint-initdb.d/01e_catalogo_servicios.sql:ro
      - ../../database/migraciones/0006_pagos.sql:/docker-entrypoint-initdb.d/01f_pagos.sql:ro
      - ../../database/migraciones/0007_perfil_proyecto.sql:/docker-entrypoint-initdb.d/01g_perfil_proyecto.sql:ro
      - ../../database/migraciones/0008_requerimientos_agencia.sql:/docker-entrypoint-initdb.d/01h_requerimientos_agencia.sql:ro
      - ../../database/migraciones/0009_tickets_servicio.sql:/docker-entrypoint-initdb.d/01i_tickets_servicio.sql:ro
      - ../../database/migraciones/0010_cambio_responsable.sql:/docker-entrypoint-initdb.d/01j_cambio_responsable.sql:ro
      - ../../database/migraciones/0011_avisos.sql:/docker-entrypoint-initdb.d/01k_avisos.sql:ro
      - ../../database/migraciones/0012_blogs_internos.sql:/docker-entrypoint-initdb.d/01l_blogs_internos.sql:ro
      - ../../database/migraciones/0013_estado_pago.sql:/docker-entrypoint-initdb.d/01m_estado_pago.sql:ro
      - ../../database/migraciones/0014_tareas.sql:/docker-entrypoint-initdb.d/01n_tareas.sql:ro
      - ../../database/migraciones/0015_ia_solo_crm.sql:/docker-entrypoint-initdb.d/01o_ia_solo_crm.sql:ro
      - ../../database/migraciones/0016_entregables.sql:/docker-entrypoint-initdb.d/01p_entregables.sql:ro
      - ../../database/migraciones/0017_estructura_servicios.sql:/docker-entrypoint-initdb.d/01q_estructura_servicios.sql:ro
      - ../../database/migraciones/0018_kpis_atrasos.sql:/docker-entrypoint-initdb.d/01r_kpis_atrasos.sql:ro
      - ../../database/migraciones/0019_soporte_consumo.sql:/docker-entrypoint-initdb.d/01s_soporte_consumo.sql:ro
      - ../../database/migraciones/0020_ia_cliente.sql:/docker-entrypoint-initdb.d/01t_ia_cliente.sql:ro
      - ../../database/migraciones/0021_taller_web.sql:/docker-entrypoint-initdb.d/01u_taller_web.sql:ro
      - ../../database/migraciones/0022_invitaciones.sql:/docker-entrypoint-initdb.d/01v_invitaciones.sql:ro
      - ../../database/migraciones/0023_paid_media_por_tipo.sql:/docker-entrypoint-initdb.d/01w_paid_media_por_tipo.sql:ro
      - ../../database/migraciones/0024_correos.sql:/docker-entrypoint-initdb.d/01x_correos.sql:ro
      - ../../database/migraciones/0025_standby.sql:/docker-entrypoint-initdb.d/01y_standby.sql:ro
      - ../../database/migraciones/0026_correos_entregables.sql:/docker-entrypoint-initdb.d/01z_correos_entregables.sql:ro
      - ../../database/migraciones/0027_taller_en_s3.sql:/docker-entrypoint-initdb.d/01za_taller_en_s3.sql:ro
      - ../../database/migraciones/0028_correos_directos.sql:/docker-entrypoint-initdb.d/01zb_correos_directos.sql:ro
      - ../../database/migraciones/0029_horario_correos.sql:/docker-entrypoint-initdb.d/01zc_horario_correos.sql:ro
      - ../../database/semillas/0001_casa_oliva.sql:/docker-entrypoint-initdb.d/02_semillas.sql:ro
      - ../../database/semillas/0002_integraciones_demo.sql:/docker-entrypoint-initdb.d/02b_integraciones_demo.sql:ro
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inoo} -d ${POSTGRES_DB:-oficina_virtual}"]
      interval: 5s
      retries: 20

  portal:
    build: ../../apps/portal
    environment:
      API_MODO: ${API_MODO:-mock}
      DATABASE_URL: postgres://${POSTGRES_USER:-inoo}:${POSTGRES_PASSWORD:-inoo}@postgres:5432/${POSTGRES_DB:-oficina_virtual}
      API_URL_BACKEND: http://prism:4010
      PERMITIR_MOCK: "true"
      MOCK_LATENCIA_MS: ${MOCK_LATENCIA_MS:-0}
      # Backend real (API_MODO=db): ingreso de prueba y archivos en MinIO.
      AUTH_MODO: demo
      PERMITIR_AUTH_DEMO: "true"
      PORTAL_URL: http://localhost:${PUERTO_PORTAL:-3000}
      S3_BUCKET: inoo-contenido-clientes
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_ENDPOINT_PUBLICO: http://localhost:9000
      AWS_ACCESS_KEY_ID: ${MINIO_USUARIO:-inoo}
      AWS_SECRET_ACCESS_KEY: ${MINIO_CLAVE:-inoo-minio-123}
    ports: ["${PUERTO_PORTAL:-3000}:3000"]
    depends_on:
      prism: { condition: service_started }
      postgres: { condition: service_healthy }

  # Despachador del outbox: manda los correos por SMTP y entrega los eventos a n8n (perfil fase1, con API_MODO=db).
  outbox:
    profiles: ["fase1"]
    build: { context: ../../apps/portal, target: build }
    command: ["npx", "tsx", "scripts/despachar-outbox.ts"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-inoo}:${POSTGRES_PASSWORD:-inoo}@postgres:5432/${POSTGRES_DB:-oficina_virtual}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/inoo-eventos
      N8N_WEBHOOK_SECRETO: ${N8N_WEBHOOK_SECRETO:-secreto-local}
      # Los correos los manda el portal por SMTP (Mailpit en local).
      CORREOS_POR: ${CORREOS_POR:-portal}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      CORREO_REMITENTE: ${CORREO_REMITENTE:-Inoo <no-responder@inoo.pe>}
      PORTAL_URL: ${PORTAL_URL:-http://localhost:3000}
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_started }
      n8n: { condition: service_started }

  prism:
    image: stoplight/prism:5
    command: mock -h 0.0.0.0 -d /contrato/openapi.yaml
    volumes:
      - ../../docs/arquitectura/openapi.yaml:/contrato/openapi.yaml:ro
    ports: ["${PUERTO_PRISM:-4010}:4010"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USUARIO:-inoo}
      MINIO_ROOT_PASSWORD: ${MINIO_CLAVE:-inoo-minio-123}
    ports: ["9000:9000", "9001:9001"]
    volumes: [datos-minio:/data]

  minio-bucket:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 $${MINIO_USUARIO:-inoo} $${MINIO_CLAVE:-inoo-minio-123}; do sleep 2; done;
      mc mb -p local/inoo-contenido-clientes && mc anonymous set none local/inoo-contenido-clientes"
    environment:
      MINIO_USUARIO: ${MINIO_USUARIO:-inoo}
      MINIO_CLAVE: ${MINIO_CLAVE:-inoo-minio-123}

  n8n:
    profiles: ["fase1"]
    image: n8nio/n8n:latest
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-oficina_virtual}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-inoo}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-inoo}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-cambia-esta-clave-solo-local}
      GENERIC_TIMEZONE: America/Lima
      N8N_SMTP_HOST: mailpit
      N8N_SMTP_PORT: 1025
      N8N_SMTP_SSL: "false"
      # Conexión con el portal (n8n/README.md): correos por evento y atrasos diarios.
      PORTAL_API_URL: ${PORTAL_API_URL:-http://portal:3000}   # http://host.docker.internal:3000 si el portal corre con npm run dev
      INOO_WEBHOOK_SECRETO: ${N8N_WEBHOOK_SECRETO:-secreto-local}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-Inoo <no-responder@inoo.pe>}
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    ports: ["5678:5678"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ../../n8n/workflows:/workflows:ro
      - datos-n8n:/home/node/.n8n
    depends_on:
      postgres: { condition: service_healthy }

  nocodb:
    profiles: ["fase1"]
    image: nocodb/nocodb:latest
    environment:
      NC_DB: pg://postgres:5432?u=${POSTGRES_USER:-inoo}&p=${POSTGRES_PASSWORD:-inoo}&d=nocodb
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  datos-postgres:
  datos-minio:
  datos-n8n:
