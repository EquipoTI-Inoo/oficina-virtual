  /jarvis/bots/{botId}/chat:
    post:
      tags: [Jarvis del equipo]
      operationId: chatConBot
      summary: Le escribe a un bot de mi área y devuelve su respuesta en streaming (SSE en formato OpenAI)
      description: 'El portal reenvía el mensaje, desde el servidor, al Hermes del área (JARVIS_HERMES), con el trabajo del bot como sistema, X-Hermes-Session-Id (la conversación) y X-Hermes-Session-Key (la memoria del bot). El navegador nunca ve la clave de Hermes. Antes revisa el tope del área; el gasto lo cobra la pasarela /ia-equipo. Mientras trabaja, el stream trae eventos «event: hermes.tool.progress» (tool, label, toolCallId y status running o completed), que la pantalla muestra como pasos. Si quien llama corta la conexión («Detener»), el portal corta la de Hermes, que interrumpe al bot.'
      x-roles: [EQUIPO]
      parameters: [ { name: botId, in: path, required: true, schema: { type: string, format: uuid } }, { name: area, in: query, required: false, schema: { $ref: '#/components/schemas/EspacioJarvis' }, description: 'Desde qué área lo uso, si me lo prestaron (por defecto, la primera que veo)' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sesionId]
              properties:
                mensaje: { type: string, maxLength: 8000, description: 'Puede ir vacío si hay archivos' }
                sesionId: { type: string, pattern: '^[A-Za-z0-9_-]{8,64}$', description: 'La genera el navegador por conversación' }
                archivos:
                  type: array
                  maxItems: 5
                  description: 'Archivos adjuntos (2 nov): el navegador saca el texto (texto plano, CSV, PDF, Word) y el bot lo recibe debajo del mensaje. Hasta 100 000 caracteres por archivo y 200 000 en total. El archivo no se guarda.'
                  items:
                    type: object
                    required: [nombre, texto]
                    properties:
                      nombre: { type: string, maxLength: 200 }
                      texto: { type: string, maxLength: 100000 }
      responses:
        '200':
          description: 'Respuesta del bot en streaming'
          content:
            text/event-stream:
              schema: { type: string }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: 'JARVIS_NO_CONECTADO: el área todavía no tiene su Hermes'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/Validacion' }
        '429':
          description: 'TOPE_AREA: el área llegó a su tope diario o mensual'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '502':
          description: 'JARVIS_APAGADO o JARVIS_ERROR'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorOpenAi' }

  /ia-equipo/models:
    get:
      tags: [Jarvis del equipo]
      operationId: modelosJarvis
      summary: Modelos que acepta la pasarela (formato OpenAI)
      security: [ { llaveJarvis: [] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: { type: string, enum: [list] }
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, object, owned_by]
                      properties:
                        id: { type: string, examples: [deepseek-flash] }
                        object: { type: string, enum: [model] }
                        owned_by: { type: string }
        '401': { description: 'LLAVE_INVALIDA', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorOpenAi' } } } }
        '403': { description: 'SIN_AREA', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorOpenAi' } } } }

  /ia-equipo/chat/completions:
    post:
      tags: [Jarvis del equipo]
      operationId: chatJarvis
      summary: Pasarela a DeepSeek en formato OpenAI Chat Completions, con o sin streaming
      description: 'Revisa el tope del área de quien llama antes de llamar a DeepSeek (con la clave de Inoo, que solo vive en el portal) y anota tokens y costo contra el área y la persona, también en streaming (agrega stream_options.include_usage). Modelos: deepseek-flash y deepseek-v4-pro. Los errores siguen el formato de OpenAI; los de DeepSeek pasan tal cual y no cuestan.'
      security: [ { llaveJarvis: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              additionalProperties: true
              properties:
                model: { type: string, enum: [deepseek-flash, deepseek-v4-pro, deepseek-v4-flash] }
                messages: { type: array, items: { type: object, additionalProperties: true } }
                stream: { type: boolean }
      responses:
        '200':
          description: 'Respuesta de DeepSeek tal cual: JSON, o text/event-stream si stream=true'
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
            text/event-stream:
              schema: { type: string }
        '400': { description: 'VALIDACION o MODELO_NO_PERMITIDO', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorOpenAi' } } } }
        '401': { description: 'LLAVE_INVALIDA', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorOpenAi' } } } }
        '403': { description: 'SIN_AREA', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorOpenAi' } } } }
        '429': { description: 'TOPE_AREA: el área llegó a su tope diario o mensual', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorOpenAi' } } } }
        '502': { description: 'IA_NO_DISPONIBLE', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorOpenAi' } } } }
        '503': { description: 'SIN_CLAVE: falta DEEPSEEK_API_KEY en el portal', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorOpenAi' } } } }

