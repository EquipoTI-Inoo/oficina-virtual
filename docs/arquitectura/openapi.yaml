                cliente: { type: string, maxLength: 120 }
                descripcion: { type: string, maxLength: 2000 }
                color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
                miembros: { type: array, maxItems: 50, items: { type: string, format: uuid } }
