    TallerWebEdicion:
      type: object
      required: [version]
      properties:
        estrategia: { type: object, description: '9 nov: especificaciones, copy, funcionalidades y pendientes (lo que viene reemplaza; lo que no, sigue igual)' }
        version: { type: integer }
        ajustes:
          description: 'Lo que el equipo corrige de lo que se sacó del brief y la marca (8 nov). Cada campo presente reemplaza al del brief; null vuelve todo al brief'
          oneOf:
            - type: object
              properties:
                objetivo: { type: [string, 'null'], maxLength: 600 }
                publico: { type: [string, 'null'], maxLength: 600 }
                alcance: { type: [string, 'null'], maxLength: 600 }
                cms: { type: [string, 'null'], maxLength: 600 }
                mensajeCentral: { type: [string, 'null'], maxLength: 600 }
                tono: { type: [string, 'null'], maxLength: 600 }
                resumenReunion: { type: [string, 'null'], maxLength: 600 }
                secciones: { type: array, maxItems: 20, items: { type: string, maxLength: 60 } }
                tipografias: { type: array, maxItems: 4, items: { type: string, maxLength: 60 } }
                paleta: { type: array, maxItems: 8, items: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' } }
