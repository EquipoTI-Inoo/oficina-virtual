                estado: LISTO_REVISION
                versionCliente: 2
                acciones: [APROBAR, SOLICITAR_CAMBIOS, COMENTAR, DESCARGAR]
                version:
                  numero: 2
                  autorTipo: AGENTE
                  agente: contenido-blog
                  creadoEn: '2026-10-28T16:20:00Z'
                  contenido:
                    tipo: BLOG
                    tituloSeo: 5 errores al elegir un CRM (y cómo evitarlos)
                    metaDescripcion: Guía práctica para pymes...
