        url: { type: [string, 'null'] }
        prompt: { type: string, maxLength: 12000 }
    BocetoWeb:
      type: object
      required: [id, paginaId, nombre, dispositivo, imagenUrl, htmlUrl, aprobado, simulada, creadaEn]
