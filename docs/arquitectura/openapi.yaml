                actividad:
                  - { fecha: '2026-10-06T15:00:00Z', texto: 'Terminamos la etapa «Sesión de contenido» de Social Media Pro', tipo: ETAPA }
                ticketsAbiertos: []

  /clientes/{clienteId}/estado-pago:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Clientes]
      operationId: obtenerEstadoPago
      summary: '«Al día» o «Atrasado X días» (reunión 15 oct). Sin cuotas ni montos: eso vivirá en Cosmic'
      description: |
        Cada rol ve lo suyo:
        - ADMIN y FINANZAS: todo, con la nota y quién lo actualizó.
        - El resto del equipo: situación, días y si hay alerta (para coordinar antes de seguir con el proyecto).
        - ADMIN_CLIENTE: solo situación y días. Otros roles del cliente reciben 403.
      x-roles: [EQUIPO, ADMIN_CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoPago' }
              example: { situacion: ATRASADO, atrasadoDesde: '2026-09-28', diasAtraso: 8, alertaOperaciones: true, umbralDias: 7, nota: 'Cuota 2 de 3 de la implementación de CRM', actualizadoEn: '2026-10-01T15:00:00Z', actualizadoPor: { id: 8e9f0a1b-2c3d-4e5f-8a6b-7c8d9e0f1a2b, nombre: Rosa Paredes } }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    put:
      tags: [Clientes]
      operationId: actualizarEstadoPago
      summary: 'Administración o Finanzas marca al cliente al día o atrasado desde una fecha'
      description: Emite `pago.situacion_cambiada`. Si el atraso alcanza el umbral, operaciones ve la alerta en el panel y en la ficha.
      x-roles: [ADMIN, FINANZAS]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EstadoPagoEntrada' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoPago' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }

  /avisos:
    get:
      tags: [Clientes]
      operationId: listarAvisos
      summary: 'Equipo: avisos vigentes y próximos (globales y por cliente). El cliente los recibe en su Inicio.'
      x-roles: [EQUIPO]
      parameters:
        - { name: clienteId, in: query, description: Solo los de ese cliente y los globales, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/Aviso' } }
    post:
      tags: [Clientes]
      operationId: crearAviso
      summary: 'Publicar un aviso. FERIADO y NO_LABORABLE son para todos y dejan de contar como días hábiles.'
      x-roles: [ACCOUNT_MANAGER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, titulo, fechaInicio]
              properties:
                tipo: { type: string, enum: [FERIADO, NO_LABORABLE, GENERAL] }
                titulo: { type: string, minLength: 3 }
                mensaje: { type: string }
                clienteId: { type: [string, 'null'], format: uuid, description: 'Solo GENERAL; null = todos los clientes' }
                fechaInicio: { type: string, format: date }
                fechaFin: { type: string, format: date, description: 'Por defecto, la misma que fechaInicio' }
                visibleDesde: { type: string, format: date, description: 'Por defecto, 7 días antes de fechaInicio' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Aviso' }
        '422': { $ref: '#/components/responses/Validacion' }

  /avisos/{avisoId}:
    parameters:
      - { name: avisoId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Clientes]
      operationId: eliminarAviso
      summary: Quitar un aviso (vuelve a contar el día como hábil si era feriado o no laborable)
      x-roles: [ACCOUNT_MANAGER, ADMIN]
      responses:
        '204': { description: Eliminado }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /clientes/{clienteId}/actividad:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Clientes]
      operationId: listarActividadCliente
      summary: '"Historial de la cuenta" de la ficha: versiones creadas, aprobaciones, cambios de marca'
      x-roles: [EQUIPO]
      parameters:
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - properties:
                      datos: { type: array, items: { $ref: '#/components/schemas/ActividadCuenta' } }
  /clientes/{clienteId}/miembros:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Clientes]
      operationId: listarMiembros
      summary: Usuarios del cliente con acceso al portal (POR-01)
      x-roles: [EQUIPO, ADMIN_CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/Miembro' } }
    post:
      tags: [Clientes]
      operationId: invitarMiembro
      summary: Invitar a un usuario (crea la cuenta en el pool de clientes y envía el correo)
      description: Solo el equipo. El cliente no crea usuarios; pide el alta a su equipo Inoo o usa el cambio de responsable.
      x-roles: [ACCOUNT_MANAGER, ADMIN]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, nombre, rol]
              properties:
                email: { type: string, format: email }
                nombre: { type: string }
                rol: { $ref: '#/components/schemas/RolCliente' }
      responses:
        '201':
          description: Invitado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Miembro' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /clientes/{clienteId}/cambio-responsable:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Clientes]
      operationId: listarSolicitudesResponsable
      summary: 'Responsable actual de la cuenta y las solicitudes de cambio (la más reciente primero)'
      x-roles: [EQUIPO, ADMIN_CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [responsable, solicitudes]
                properties:
                  responsable: { oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ] }
                  solicitudes: { type: array, items: { $ref: '#/components/schemas/SolicitudResponsable' } }
    post:
      tags: [Clientes]
      operationId: solicitarCambioResponsable
      summary: 'Quien administra la cuenta propone a su sucesor; el equipo lo aprueba. Emite `responsable.cambio_solicitado`.'
      description: Una sola solicitud PENDIENTE por cliente (409 SOLICITUD_PENDIENTE). No crea ningún acceso hasta que el equipo la aprueba.
      x-roles: [ADMIN_CLIENTE]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, email, telefono]
              properties:
                nombre: { type: string, minLength: 3 }
                email: { type: string, format: email }
                telefono: { type: string, minLength: 6 }
                cargo: { type: string }
                motivo: { type: string }
                quitarAccesoAnterior: { type: boolean, default: true, description: 'Al aprobarse, quien la pidió deja de tener acceso' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitudResponsable' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }

  /solicitudes-responsable/{solicitudId}/decision:
    parameters:
      - { name: solicitudId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Clientes]
      operationId: decidirCambioResponsable
      summary: 'El equipo aprueba (crea el acceso del sucesor como ADMIN_CLIENTE y lo hace contacto principal) o rechaza con una nota'
      description: Al aprobar se emite `responsable.cambiado` (n8n envía la invitación al sucesor y avisa al AM para contactarlo).
      x-roles: [ACCOUNT_MANAGER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APROBADA, RECHAZADA] }
                nota: { type: string, description: Obligatoria al rechazar; la ve el cliente }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitudResponsable' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }

  /clientes/{clienteId}/miembros/{usuarioId}/enlace-acceso:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - { name: usuarioId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Clientes]
      operationId: crearEnlaceAcceso
      summary: 'Enlace de un solo uso para que un usuario del cliente cree su contraseña. Vence en 7 días. Solo el token completo vuelve aquí; en la base queda su hash'
      x-roles: [ACCOUNT_MANAGER, ADMIN]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ruta, expiraEn]
                properties:
                  ruta: { type: string, description: 'Ruta de la página pública: /crear-clave/{token}' }
                  expiraEn: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /clientes/{clienteId}/miembros/{usuarioId}:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - { name: usuarioId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Clientes]
      operationId: cambiarRolMiembro
      summary: Cambiar el rol de un usuario del cliente
      x-roles: [ACCOUNT_MANAGER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rol]
              properties: { rol: { $ref: '#/components/schemas/RolCliente' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Miembro' }
    delete:
      tags: [Clientes]
      operationId: quitarMiembro
      summary: Quitar acceso a un usuario del cliente
      x-roles: [ACCOUNT_MANAGER, ADMIN]
      responses:
        '204': { description: Quitado }

  # ------------------------------------------------------------------ Referencias y briefs
  /clientes/{clienteId}/referencias:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Referencias y briefs]
      operationId: listarReferencias
      summary: Referencias permanentes de la marca (logo, manual, paleta, marcas que admira). Las del mes van en el brief.
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: tipo, in: query, schema: { $ref: '#/components/schemas/TipoReferencia' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/Referencia' } }
    post:
      tags: [Referencias y briefs]
      operationId: crearReferencia
      summary: Agregar una referencia permanente a la ficha. Si lleva archivo, primero se sube con /archivos.
      x-roles: [EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferenciaEntrada' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Referencia' }
        '422': { $ref: '#/components/responses/Validacion' }

  /clientes/{clienteId}/referencias/{referenciaId}:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - { name: referenciaId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Referencias y briefs]
      operationId: eliminarReferencia
      summary: Eliminar referencia. El cliente solo quita las de un brief que sigue en BORRADOR.
      x-roles: [EQUIPO, ADMIN_CLIENTE, APROBADOR]
      responses:
        '204': { description: Eliminada }

  /clientes/{clienteId}/briefs:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Referencias y briefs]
      operationId: listarBriefs
      summary: Briefs mensuales del cliente
      x-roles: [EQUIPO]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/Brief' } }

  /clientes/{clienteId}/briefs/{periodo}:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - { name: periodo, in: path, required: true, schema: { $ref: '#/components/schemas/Periodo' } }
    get:
      tags: [Referencias y briefs]
      operationId: obtenerBrief
      summary: Brief del mes con sus archivos. Si no existe, devuelve uno vacío en BORRADOR (no 404).
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Brief' }
    put:
      tags: [Referencias y briefs]
      operationId: guardarBrief
      summary: Guardar el borrador ("El enfoque de este mes"). Solo mientras está en BORRADOR para el cliente.
      x-roles: [EQUIPO, ADMIN_CLIENTE, APROBADOR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                objetivoComunicacion: { type: string, maxLength: 500 }
                consideraciones: { type: string, maxLength: 5000 }
                contenidoMd: { type: string, description: Solo equipo }
                driveFileId: { type: string, description: Solo equipo }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Brief' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /clientes/{clienteId}/briefs/{periodo}/enviar:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - { name: periodo, in: path, required: true, schema: { $ref: '#/components/schemas/Periodo' } }
    post:
      tags: [Referencias y briefs]
      operationId: enviarBrief
      summary: 'Enviar el brief del mes. Firma la declaración de derechos y publica los archivos subidos (CU-05).'
      description: |
        Pasa el brief a ENVIADO y todos sus archivos en estado SUBIDO a DISPONIBLE, guardando quién declaró
        los derechos y cuándo. Avisa al account manager (evento `brief.enviado`).
      x-roles: [ADMIN_CLIENTE, APROBADOR]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [declaraDerechos]
              properties:
                declaraDerechos: { type: boolean, const: true }
      responses:
        '200':
          description: Enviado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Brief' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }

  /clientes/{clienteId}/briefs/{periodo}/confirmar:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - { name: periodo, in: path, required: true, schema: { $ref: '#/components/schemas/Periodo' } }
    post:
      tags: [Referencias y briefs]
      operationId: confirmarBrief
      summary: El AM revisa y confirma el brief y se dispara al Jefe de Marketing (CU-02)
      x-roles: [ACCOUNT_MANAGER, ADMIN]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200':
          description: Confirmado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Brief' }

  /clientes/{clienteId}/briefs/{periodo}/referencias:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - { name: periodo, in: path, required: true, schema: { $ref: '#/components/schemas/Periodo' } }
    post:
      tags: [Referencias y briefs]
      operationId: crearReferenciaBrief
      summary: Agregar una referencia de inspiración al brief del mes (solo mientras está en BORRADOR)
      x-roles: [EQUIPO, ADMIN_CLIENTE, APROBADOR]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferenciaEntrada' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Referencia' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }

  /formularios/ingreso-cliente:
    get:
      tags: [Clientes]
      operationId: formularioIngresoCliente
      summary: Preguntas del ingreso de cliente (Comercial, en el alta), con sus caminos
      x-roles: [EQUIPO]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [campos]
                properties:
                  campos: { type: array, items: { $ref: '#/components/schemas/CampoFormulario' } }

  /requerimientos/{requerimientoId}/enlace:
    parameters: [ { name: requerimientoId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [Requerimientos]
      operationId: crearEnlaceRequerimiento
      summary: Crea (o reemplaza) el enlace para responder sin cuenta del portal
      x-roles: [EQUIPO]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                diasVigencia: { type: integer, minimum: 1, maximum: 60, description: 'Por defecto 14' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Requerimiento' } } } }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }
    delete:
      tags: [Requerimientos]
      operationId: revocarEnlaceRequerimiento
      summary: Revoca el enlace (deja de funcionar al instante)
      x-roles: [EQUIPO]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Requerimiento' } } } }

  /publico/formularios/{token}:
    parameters: [ { name: token, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } } ]
    get:
      tags: [Requerimientos]
      operationId: leerFormularioPublico
      summary: El formulario de un requerimiento por su enlace, sin sesión
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FormularioPublico' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '410': { description: El enlace venció }
  /publico/formularios/{token}/respuesta:
    parameters: [ { name: token, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } } ]
    put:
      tags: [Requerimientos]
      operationId: responderFormularioPublico
      summary: Guarda el borrador o envía el formulario por su enlace (al enviar, con el nombre de quien responde)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [respuestas]
              properties:
                respuestas: { type: object, additionalProperties: true }
                enviar: { type: boolean }
                nombre: { type: string, description: Obligatorio al enviar }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FormularioPublico' } } } }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }
  /publico/formularios/{token}/archivos:
    parameters: [ { name: token, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } } ]
    post:
      tags: [Requerimientos]
      operationId: subirArchivoFormularioPublico
      summary: Inicia la subida de un archivo del formulario (URL prefirmada), sin sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, mime, bytes]
              properties:
                nombre: { type: string }
                mime: { type: string }
                bytes: { type: integer }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  archivo: { type: object, properties: { id: { type: string }, nombre: { type: string }, estado: { type: string } } }
                  subida: { type: object, properties: { metodo: { type: string }, url: { type: string }, headers: { type: object, additionalProperties: { type: string } }, expiraEn: { type: string, format: date-time } } }
  /publico/formularios/{token}/archivos/{archivoId}/confirmar:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
      - { name: archivoId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Requerimientos]
      operationId: confirmarArchivoFormularioPublico
      summary: Confirma que el archivo se subió
      security: []
      responses:
        '200': { description: OK }

  /plantillas-requerimiento:
    get:
      tags: [Requerimientos]
      operationId: listarPlantillasRequerimiento
      summary: Plantillas de requerimiento con su formulario (brief web, kickoff de CRM, accesos, catálogo…)
      x-roles: [EQUIPO]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/PlantillaRequerimiento' } }

  /clientes/{clienteId}/requerimientos:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Requerimientos]
      operationId: listarRequerimientos
      summary: 'Requerimientos del cliente: pendientes (incluye observados) primero, por fecha límite; luego los enviados y aprobados'
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: servicioContratadoId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos, pendientes, atrasados]
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/Requerimiento' } }
                  pendientes: { type: integer }
                  atrasados: { type: integer }
    post:
      tags: [Requerimientos]
      operationId: crearRequerimiento
      summary: 'El equipo le pide algo al cliente desde una plantilla. Emite `requerimiento.creado` (correo con la fecha límite).'
      x-roles: [EQUIPO]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequerimientoEntrada' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requerimiento' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }

  /requerimientos/{requerimientoId}:
    parameters:
      - { name: requerimientoId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Requerimientos]
      operationId: obtenerRequerimiento
      summary: Requerimiento con su formulario y lo que el cliente respondió
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requerimiento' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /requerimientos/{requerimientoId}/respuesta:
    parameters:
      - { name: requerimientoId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Requerimientos]
      operationId: responderRequerimiento
      summary: 'El cliente guarda su respuesta (borrador) o la envía (`enviar: true`)'
      description: |
        Solo con el requerimiento PENDIENTE u OBSERVADO. Al enviar se exigen los campos obligatorios, pasa a
        ENVIADO y se emite `requerimiento.enviado`. Si se envía tarde, el cronograma del servicio se corre los
        días hábiles de atraso que aún no se habían aplicado.
      x-roles: [ADMIN_CLIENTE, APROBADOR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [respuestas]
              properties:
                respuestas: { type: object, additionalProperties: true, description: 'Clave del campo → valor (texto, booleano o [{archivoId, nombre}])' }
                enviar: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requerimiento' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }

  /requerimientos/{requerimientoId}/revision:
    parameters:
      - { name: requerimientoId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Requerimientos]
      operationId: revisarRequerimiento
      summary: 'El equipo aprueba lo enviado u observa (pide corregir algo con una nota). Emite `requerimiento.revisado`.'
      x-roles: [EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APROBADO, OBSERVADO] }
                nota: { type: string, description: Obligatoria al observar; la ve el cliente }
                nuevaFechaLimite: { type: string, format: date, description: 'Al observar: nuevo plazo (por defecto, el mismo)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requerimiento' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }

  /integraciones/requerimientos/atrasos:
    post:
      tags: [Integraciones]
      operationId: aplicarAtrasosRequerimientos
      summary: 'n8n, una vez al día: corre el cronograma de los servicios con requerimientos vencidos y avisa al cliente'
      description: |
        Para cada requerimiento PENDIENTE u OBSERVADO con la fecha límite vencida, corre las etapas sin completar
        de su servicio los días hábiles de atraso que faltan aplicar y emite `requerimiento.atrasado` (n8n manda
        el correo). Idempotente: correrlo dos veces el mismo día no vuelve a correr nada.
      security: [ { apiKey: [] } ]
      x-roles: [SERVICIO]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [revisados, corridos]
                properties:
                  revisados: { type: integer, description: Requerimientos vencidos revisados }
                  corridos: { type: integer, description: Requerimientos cuyo atraso corrió el cronograma hoy }

  /integraciones/tableros/archivar:
    post:
      tags: [Integraciones]
      operationId: archivarTablerosCulminados
      summary: 'Proceso diario: fecha a los proyectos «Completado» de InooWork y archiva los culminados hace 14 días'
      x-roles: [SERVICIO]
      x-scopes: [tableros:write]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fecha: { type: string, format: date, description: Simula otro día }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [fechados, archivados]
                properties:
                  fechados: { type: integer }
                  archivados: { type: integer }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '502': { description: InooWork no respondió }

  /integraciones/recordatorios:
    post:
      tags: [Integraciones]
      operationId: enviarRecordatorios
      summary: 'n8n, una vez al día y temprano: avisa lo que vence o pasa el próximo día hábil (fase 18)'
      description: |
        Emite `tarea.por_vencer` (tareas internas abiertas con responsable), `requerimiento.por_vencer` (lo que el
        cliente nos tiene que entregar) y `reunion.proxima` (reuniones programadas) para lo que cae después de hoy y
        hasta el próximo día hábil, inclusive; n8n manda los correos. Idempotente: cada aviso sale una sola vez.
      security: [ { apiKey: [] } ]
      x-roles: [SERVICIO]
      x-scopes: [recordatorios:write]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fecha: { type: string, format: date, description: 'Pruebas: simula otro día (por defecto, hoy en Lima)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [tareas, requerimientos, reuniones]
                properties:
                  tareas: { type: integer }
                  requerimientos: { type: integer }
                  reuniones: { type: integer }

  /integraciones/servicios/etapas-del-mes:
    post:
      tags: [Integraciones]
      operationId: generarEtapasDelMes
      summary: 'n8n, el día 1 (o unos días antes, con el mes siguiente): arma las etapas del mes de los servicios mensuales'
      description: |
        A cada servicio mensual ACTIVO y vigente ese mes (Social Media Pro, Paid Media…) que todavía no tenga
        etapas en el periodo se le crean las de su plantilla, con fechas en días hábiles desde el día 1. El soporte
        continuo no tiene etapas (se mide por consumo). Emite `etapa.actualizada` con `motivo: MES_NUEVO` por
        servicio. Idempotente: repetirla no duplica etapas. Scope `servicios:write`.
      security: [ { apiKey: [] } ]
      x-roles: [SERVICIO]
      x-scopes: [servicios:write]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                periodo: { type: string, pattern: '^\d{4}-\d{2}$', description: 'El mes en curso (por defecto) o el siguiente' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [periodo, revisados, creados, servicioIds]
                properties:
                  periodo: { type: string, examples: ['2026-11'] }
                  revisados: { type: integer, description: 'Servicios mensuales vigentes ese mes' }
                  creados: { type: integer, description: 'Servicios a los que se les crearon las etapas' }
                  servicioIds: { type: array, items: { type: string, format: uuid } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }

  /integraciones/servicios/inactividad:
    post:
      tags: [Integraciones]
      operationId: aplicarInactividadClientes
      summary: 'n8n, una vez al día: avisa y pone en standby los servicios de clientes que no usan el portal'
      description: |
        Si nadie del cliente usa el portal en 30 días, sus servicios ACTIVO pasan a STANDBY y se emite
        `servicio.standby`. 7 días antes se emite una sola vez `servicio.standby_proximo` (correo al cliente y a
        los responsables). Cuando alguien del cliente vuelve a usar el portal, los servicios se reactivan solos
        (`servicio.reactivado`). Idempotente en el día. Scope `servicios:write`.
      security: [ { apiKey: [] } ]
      x-roles: [SERVICIO]
      x-scopes: [servicios:write]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fecha: { type: string, format: date, description: 'Simula otro día (pruebas); por defecto hoy' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [revisados, avisados, enStandby]
                properties:
                  revisados: { type: integer, description: Clientes con servicios activos revisados }
                  avisados: { type: integer, description: Clientes avisados hoy de que pasarán a standby }
                  enStandby: { type: integer, description: Clientes cuyos servicios pasaron hoy a standby }
        '422': { $ref: '#/components/responses/Validacion' }

  /integraciones/correos/preparar:
    post:
      tags: [Integraciones]
      operationId: prepararCorreos
      summary: 'n8n, por cada evento del outbox: qué correos mandar, a quién y con qué contenido (INO-04)'
      description: |
        n8n recibe el evento firmado del outbox y lo reenvía tal cual. La API aplica las reglas de
        `regla_correo` (la del cliente si existe, si no la global), resuelve los destinatarios, arma el asunto
        y el HTML y deja cada correo en PENDIENTE. Idempotente por evento y destinatario: si n8n reintenta,
        vuelven solo los que aún no se enviaron. Un evento sin regla activa devuelve una lista vacía.
      security: [ { apiKey: [] } ]
      x-roles: [SERVICIO]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventoSaliente' }
      responses:
        '200':
          description: Correos por enviar
          content:
            application/json:
              schema:
                type: object
                required: [correos]
                properties:
                  correos: { type: array, items: { $ref: '#/components/schemas/CorreoPreparado' } }
        '422': { $ref: '#/components/responses/Validacion' }

  /integraciones/correos/{correoId}/resultado:
    post:
      tags: [Integraciones]
      operationId: registrarResultadoCorreo
      summary: n8n informa si el correo salió por SMTP o falló
      security: [ { apiKey: [] } ]
      x-roles: [SERVICIO]
      parameters:
        - { name: correoId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [ENVIADO, FALLIDO] }
                messageId: { type: string, description: Message-ID que devolvió el servidor SMTP }
                error: { type: string, maxLength: 2000 }
      responses:
        '204': { description: Registrado }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /clientes/{clienteId}/servicios:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Servicios]
      operationId: listarServiciosCliente
      summary: '"Mis servicios": plan, resumen del mes y solo los servicios contratados, cada uno con su avance (POR-02)'
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: periodo, in: query, description: Por defecto el mes actual (America/Lima), schema: { $ref: '#/components/schemas/Periodo' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiciosCliente' }
              example:
                periodo: '2026-10'
                plan: { id: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e, nombre: Plan Crecimiento, fechaInicio: '2026-01-01', fechaFin: '2026-12-31', tieneContrato: true }
                resumenMes: { totales: 20, entregadas: 16, aprobadas: 12, publicadas: 3, porRevisar: 4, enProduccion: 4, porcentaje: 60 }
                servicios:
                  - codigo: CRM_IMPLEMENTACION
                    nombre: Implementación de CRM
                    titulo: Implementación de CRM - Casa Oliva
                    modalidad: PROYECTO
                    variante: null
                    detalle: { crm: HubSpot, licencias: 3, usuarios: 5 }
                    servicioContratadoId: 3c9d8e7f-6a5b-4c3d-9e2f-1a0b9c8d7e6f
                    estado: ACTIVO
                    fechaInicio: '2026-09-01'
                    cantidadMensual: 0
                    unidad: entregas
                    progreso: null
                    avance: { porcentaje: 20, etapaActual: { orden: 2, nombre: Procesos e implementación, estado: EN_PROGRESO, atrasada: false }, totalEtapas: 4, etapasCompletadas: 1 }
    post:
      tags: [Servicios]
      operationId: contratarServicio
      summary: Registrar un servicio contratado con sus entregables incluidos
      x-roles: [ACCOUNT_MANAGER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicioContratadoEntrada' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServicioCliente' }

  /plantillas:
    get:
      tags: [Servicios]
      operationId: listarPlantillas
      summary: Plantillas de proyecto activas (etapas y % de avance acumulado por servicio y variante)
      x-roles: [EQUIPO]
      parameters:
        - { name: servicio, in: query, schema: { $ref: '#/components/schemas/CodigoServicio' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/PlantillaProyecto' } }

  /clientes/propuesta-desde-transcripcion:
    post:
      tags: [Clientes]
      operationId: proponerAltaCliente
      summary: 'Alta de cliente desde la transcripción de la reunión de venta (fase 17): propone marca, responsable, ingreso y alcance. No guarda nada'
      description: 'Para Comercial y CRM (nivel por cuenta) y ADMIN. Lo propuesto llena el formulario de «Nuevo cliente», que se revisa y se envía con POST /clientes. `conIa: false` = borrador por reglas.'
      x-roles: [ACCOUNT_MANAGER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TranscripcionEntrada' }
      responses:
        '200':
          description: Propuesta
          content:
            application/json:
              schema:
                type: object
                required: [propuesta, conIa]
                properties:
                  propuesta: { $ref: '#/components/schemas/PropuestaAltaCliente' }
                  conIa: { type: boolean }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }

  /servicios-contratados/{servicioContratadoId}:
    parameters:
      - { name: servicioContratadoId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Servicios]
      operationId: obtenerPerfilProyecto
      summary: 'Perfil del proyecto: métricas de su plantilla, etapas, reuniones y entregables por revisar del servicio'
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: periodo, in: query, description: 'Servicios mensuales: el mes (por defecto el actual)', schema: { $ref: '#/components/schemas/Periodo' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerfilProyecto' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Servicios]
      operationId: actualizarServicioContratado
      summary: 'El equipo actualiza el proyecto: siguiente paso, estado, marca, detalle, responsable o alcance'
      description: 'Cambiar `responsableId` es solo para ACCOUNT_MANAGER y ADMIN (403 para el resto del equipo).'
      x-roles: [EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                siguientePaso: { type: [string, 'null'], description: 'Lo que ve el cliente como «Siguiente paso»' }
                estado: { $ref: '#/components/schemas/EstadoServicio' }
                marca: { type: [string, 'null'] }
                detalle: { $ref: '#/components/schemas/DetalleServicio' }
                fechaFin: { type: [string, 'null'], format: date }
                responsableId: { type: [string, 'null'], format: uuid, description: 'Responsable del proyecto en Inoo' }
                alcance: { type: [string, 'null'], description: 'Alcance prometido por Comercial (lo ve el cliente)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerfilProyecto' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }

  /servicios-contratados/{servicioContratadoId}/reuniones:
    parameters:
      - { name: servicioContratadoId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Servicios]
      operationId: listarReuniones
      summary: Todas las reuniones del proyecto (las más recientes primero)
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/Reunion' } }
    post:
      tags: [Servicios]
      operationId: registrarReunion
      summary: 'El equipo programa una reunión o registra una ya realizada (alimenta las métricas del perfil)'
      x-roles: [EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReunionEntrada' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reunion' }
        '422': { $ref: '#/components/responses/Validacion' }

  /reuniones/{reunionId}:
    parameters:
      - { name: reunionId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Servicios]
      operationId: actualizarReunion
      summary: 'Marcar realizada (con o sin acuerdos y su resumen), reprogramar o cancelar'
      x-roles: [EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReunionEntrada' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reunion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }

  /servicios-contratados/{servicioContratadoId}/reuniones/propuesta:
    parameters:
      - { name: servicioContratadoId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Servicios]
      operationId: proponerResumenReunion
      summary: 'Resumen de reunión desde la transcripción (fase 18): propone resumen, si hubo acuerdos y pendientes. No guarda nada'
      description: 'Solo equipo. El equipo revisa la propuesta y la manda con PATCH /reuniones/{id} (estado REALIZADA). `conIa: false` = borrador por reglas (IA simulada o sin respuesta útil).'
      x-roles: [EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TranscripcionEntrada' }
      responses:
        '200':
          description: Propuesta
          content:
            application/json:
              schema:
                type: object
                required: [propuesta, conIa]
                properties:
                  propuesta: { $ref: '#/components/schemas/PropuestaResumenReunion' }
                  conIa: { type: boolean }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }

  /servicios-contratados/{servicioContratadoId}/cierre:
    parameters:
      - { name: servicioContratadoId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Servicios]
      operationId: verCierreProyecto
      summary: 'Lo que falta antes de cerrar el proyecto (fase 17): etapas, tareas, entregables y requerimientos abiertos'
      x-roles: [EQUIPO]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CierreProyecto' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    post:
      tags: [Servicios]
      operationId: cerrarProyecto
      summary: 'Cierra el proyecto: FINALIZADO, el mensaje queda como «Qué sigue» para el cliente y se emite servicio.cerrado'
      description: 'Con pendientes responde 409 CIERRE_CON_PENDIENTES, salvo `forzar: true`. n8n manda el agradecimiento y la encuesta.'
      x-roles: [EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mensaje]
              properties:
                mensaje: { type: string, minLength: 10, maxLength: 2000, description: 'Lo que ve el cliente al cerrar' }
                forzar: { type: boolean, description: 'Cerrar aunque queden pendientes' }
      responses:
        '200':
          description: Cerrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CierreProyecto' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }

  /servicios-contratados/{servicioContratadoId}/comentarios:
    parameters:
      - { name: servicioContratadoId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Servicios]
      operationId: listarComentariosProyecto
      summary: Comentarios y consultas del proyecto (el cliente no ve las notas internas del equipo)
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { type: array, description: Del más antiguo al más reciente, items: { $ref: '#/components/schemas/ComentarioProyecto' } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    post:
      tags: [Servicios]
      operationId: comentarProyecto
      summary: Dejar un comentario o consulta sobre el proyecto. Emite `comentario_proyecto.creado` (aviso al responsable).
      x-roles: [EQUIPO, ADMIN_CLIENTE, APROBADOR]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto: { type: string, minLength: 2, maxLength: 2000 }
                interno: { type: boolean, description: 'Solo equipo: nota que el cliente no ve' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComentarioProyecto' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }

  /servicios-contratados/{servicioContratadoId}/etapas/{etapaId}:
    parameters:
      - { name: servicioContratadoId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: etapaId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Servicios]
      operationId: actualizarEtapa
      summary: El equipo mueve una etapa del proyecto (estado y fechas). Devuelve el avance recalculado.
      description: |
        Al pasar a COMPLETADO se registra `fechaFin` (hoy si no se envía). El % del proyecto es el `avancePct`
        de la última etapa completada en orden; no se puede completar una etapa si la anterior no lo está
        (409 ETAPA_ANTERIOR_PENDIENTE). Emite `etapa.actualizada`.
      x-roles: [EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                estado: { $ref: '#/components/schemas/EstadoHito' }
                fechaInicio: { type: [string, 'null'], format: date }
                fechaEstimada: { type: [string, 'null'], format: date }
                fechaFin: { type: [string, 'null'], format: date }
                causaAtraso: { oneOf: [ { $ref: '#/components/schemas/CausaAtraso' }, { type: 'null' } ] }
                justificacionAtraso: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvanceServicio' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }

  /clientes/{clienteId}/plan/contrato:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Servicios]
      operationId: descargarContrato
      summary: URL firmada del contrato del plan vigente ("Ver contrato")
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UrlFirmada' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /clientes/{clienteId}/avance:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Servicios]
      operationId: obtenerAvanceCliente
      summary: Avance de cada servicio contratado (etapas, hitos y siguiente paso) (INO-07)
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: periodo, in: query, schema: { $ref: '#/components/schemas/Periodo' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvanceCliente' }

  /servicios-contratados/{servicioContratadoId}/avance:
    parameters:
      - { name: servicioContratadoId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Servicios]
      operationId: obtenerAvanceServicio
      summary: Etapas del proyecto (o del mes, en servicios mensuales) e hitos de InooWork sin notas internas (INO-07)
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvanceServicio' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  # ------------------------------------------------------------------ Piezas
  /clientes/{clienteId}/piezas:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Piezas]
      operationId: listarPiezas
      summary: Entregables del cliente. Para un CLIENTE, BORRADOR y EN_REVISION_INTERNA llegan como EN_PRODUCCION.
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - name: estado
          in: query
          description: Uno o varios, separados por coma
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/EstadoPieza' } }
        - name: tipo
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/TipoPieza' } }
        - { name: canal, in: query, schema: { type: string, examples: [INSTAGRAM] } }
        - { name: q, in: query, description: Busca en el título, schema: { type: string } }
        - { name: periodo, in: query, schema: { $ref: '#/components/schemas/Periodo' } }
        - { name: servicioContratadoId, in: query, schema: { type: string, format: uuid } }
        - { name: orden, in: query, schema: { type: string, enum: [fechaProgramada, -actualizadoEn], default: fechaProgramada } }
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - properties:
                      datos: { type: array, items: { $ref: '#/components/schemas/PiezaResumen' } }
                      conteos:
                        type: object
                        description: Piezas por estado con los mismos filtros salvo `estado` (para las pestañas y chips)
                        additionalProperties: { type: integer }
    post:
      tags: [Piezas]
      operationId: crearPieza
      summary: '"Nueva pieza" desde la bandeja de producción (hecha por una persona del equipo)'
      x-roles: [EQUIPO]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PiezaEntrada' }
      responses:
        '201':
          description: Creada en BORRADOR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pieza' }

  /piezas/{piezaId}:
    parameters: [ { $ref: '#/components/parameters/PiezaId' } ]
    get:
      tags: [Piezas]
      operationId: obtenerPieza
      summary: Detalle con la versión vigente. El cliente recibe la versión enviada a revisión (`versionCliente`).
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pieza' }
              example:
                id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                clienteId: 7f3a9c10-2b4d-4e8f-a1c3-5d7e9f0a2b4c
                tipo: BLOG
                titulo: 5 errores al elegir un CRM
                canal: BLOG
                periodo: '2026-11'
                fechaProgramada: '2026-11-04T14:00:00Z'
                estado: LISTO_REVISION
                versionCliente: 2
                acciones: [APROBAR, SOLICITAR_CAMBIOS, COMENTAR, DESCARGAR]
                version:
                  numero: 2
                  autorTipo: AGENTE
                  agente: contenido-blog
                  creadoEn: '2026-10-28T16:20:00Z'
                  contenido:
                    tipo: BLOG
                    tituloSeo: 5 errores al elegir un CRM (y cómo evitarlos)
                    metaDescripcion: Guía práctica para pymes...
                    cuerpoMd: "# 5 errores...\n\n## 1. ..."
                    palabras: 1450
                  fuentes: [ { titulo: Informe Gartner 2026, url: 'https://example.com/informe' } ]
                  archivo: { id: 9e8d7c6b-5a4f-4e3d-8c2b-1a0f9e8d7c6b, nombre: APROBADO_Blog_errores-crm_20261028.docx, mime: application/vnd.openxmlformats-officedocument.wordprocessingml.document }
                  portada: { id: 4f5e6d7c-8b9a-4f0e-9d1c-2b3a4f5e6d7c, nombre: portada.png, mime: image/png, miniaturaUrl: 'https://archivos.inoo.pe/firmado/portada.png' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Piezas]
      operationId: actualizarPieza
      summary: Editar metadatos (título, fecha, etiquetas, aptitud para paid media, responsable)
      x-roles: [EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                titulo: { type: string }
                fechaProgramada: { type: [string, 'null'], format: date-time }
                etiquetas: { type: array, items: { type: string } }
                aptaPaidMedia: { type: boolean }
                responsableId: { type: [string, 'null'], format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pieza' }

  /piezas/{piezaId}/aprobar:
    parameters: [ { $ref: '#/components/parameters/PiezaId' } ]
    post:
      tags: [Piezas]
      operationId: aprobarPieza
      summary: Aprobar la versión que el cliente está viendo (CU-06). LISTO_REVISION → APROBADO_CLIENTE.
      x-roles: [APROBADOR, ADMIN_CLIENTE, ACCOUNT_MANAGER]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Decision' }
            example: { version: 2, comentario: 'Perfecto, publíquenlo' }
      responses:
        '200':
          description: Aprobada. Se registra auditoría y sale el correo de confirmación.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pieza' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /piezas/{piezaId}/solicitar-cambios:
    parameters: [ { $ref: '#/components/parameters/PiezaId' } ]
    post:
      tags: [Piezas]
      operationId: solicitarCambiosPieza
      summary: Pedir cambios (comentario obligatorio). LISTO_REVISION → CAMBIOS_SOLICITADOS; crea tarea prioritaria en InooWork.
      x-roles: [APROBADOR, ADMIN_CLIENTE, ACCOUNT_MANAGER]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Decision'
                - required: [comentario]
            example: { version: 2, comentario: Cambiar el CTA final por "Agenda una demo" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pieza' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }

  /piezas/{piezaId}/transiciones:
    parameters: [ { $ref: '#/components/parameters/PiezaId' } ]
    post:
      tags: [Piezas]
      operationId: transicionarPieza
      summary: Cambio de estado genérico del equipo (enviar a revisión interna, liberar al cliente, marcar publicado...)
      description: |
        Valida contra la tabla de transiciones. Transiciones del equipo:
        BORRADOR→EN_REVISION_INTERNA, EN_REVISION_INTERNA→BORRADOR|LISTO_REVISION,
        LISTO_REVISION→EN_REVISION_INTERNA|APROBADO_CLIENTE|CAMBIOS_SOLICITADOS,
        CAMBIOS_SOLICITADOS→EN_REVISION_INTERNA, APROBADO_CLIENTE→EN_REVISION_INTERNA (nueva versión; la aprobación
        anterior no se hereda) y APROBADO_CLIENTE→PUBLICADO.
      x-roles: [EQUIPO]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { $ref: '#/components/schemas/EstadoPieza' }
                comentario: { type: string }
                publicadoUrl: { type: string, format: uri, description: Solo al pasar a PUBLICADO }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pieza' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /piezas/{piezaId}/versiones:
    parameters: [ { $ref: '#/components/parameters/PiezaId' } ]
    get:
      tags: [Piezas]
      operationId: listarVersiones
      summary: Historial de versiones con la decisión de cada una. El cliente ve solo las versiones que se le enviaron.
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/VersionPieza' } }
              example:
                datos:
                  - { numero: 2, actual: true, autorTipo: PERSONA, contenido: { tipo: CARRUSEL, imagenes: [] }, enviadaEn: '2026-10-05T15:30:00Z', enviadaPor: { id: 5c6d7e8f-9a0b-4c1d-8e2f-3a4b5c6d7e8f, nombre: Diego Castro }, decision: null, creadoEn: '2026-10-05T15:00:00Z' }
                  - { numero: 1, actual: false, autorTipo: AGENTE, contenido: { tipo: CARRUSEL, imagenes: [] }, enviadaEn: '2026-09-29T17:00:00Z', enviadaPor: { id: 5c6d7e8f-9a0b-4c1d-8e2f-3a4b5c6d7e8f, nombre: Diego Castro }, decision: { estado: APROBADO_CLIENTE, usuarioNombre: Valeria Mendoza, fecha: '2026-09-30T21:42:00Z' }, creadoEn: '2026-09-29T16:00:00Z' }
    post:
      tags: [Piezas]
      operationId: crearVersionManual
      summary: Subir una versión hecha por una persona (p. ej. retoque de diseño)
      x-roles: [EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionEntrada' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionPieza' }

  /piezas/{piezaId}/historial:
    parameters: [ { $ref: '#/components/parameters/PiezaId' } ]
    get:
      tags: [Piezas]
      operationId: obtenerHistorialPieza
      summary: Auditoría de estados (quién aprobó qué y cuándo). El cliente ve solo los eventos desde LISTO_REVISION.
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/EventoPieza' } }

  /piezas/{piezaId}/comentarios:
    parameters: [ { $ref: '#/components/parameters/PiezaId' } ]
    get:
      tags: [Piezas]
      operationId: listarComentarios
      summary: Comentarios. Los internos solo los recibe el equipo.
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/Comentario' } }
    post:
      tags: [Piezas]
      operationId: comentarPieza
      summary: Comentar una pieza
      x-roles: [EQUIPO, CLIENTE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto: { type: string, minLength: 1, maxLength: 5000 }
                interno: { type: boolean, default: false, description: Ignorado si quien comenta es CLIENTE }
                ancla: { $ref: '#/components/schemas/AnclaComentario' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comentario' }

  /piezas/{piezaId}/descarga:
    parameters: [ { $ref: '#/components/parameters/PiezaId' } ]
    get:
      tags: [Piezas]
      operationId: descargarPieza
      summary: URL firmada temporal del archivo de la versión visible (POR-03)
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: version, in: query, description: Solo equipo puede pedir otra versión, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UrlFirmada' }

  # ------------------------------------------------------------------ Planificación
  /clientes/{clienteId}/tablero:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Planificación]
      operationId: obtenerTablero
      summary: '"Plan del mes" del cliente: las piezas del mes en columnas por estado (kanban)'
      description: |
        Columnas fijas: PLANIFICADO (sin contenido todavía), EN_PRODUCCION (incluye las que se están
        ajustando tras un pedido de cambios, con `ajustando: true`), POR_REVISAR, APROBADO y PUBLICADO.
        El cliente ve el mes solo cuando el plan está APROBADO_PLAN (mismo criterio que el calendario).
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: periodo, in: query, required: true, schema: { $ref: '#/components/schemas/Periodo' } }
        - { name: servicioContratadoId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tablero' }

  /clientes/{clienteId}/calendario/{periodo}:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - { name: periodo, in: path, required: true, schema: { $ref: '#/components/schemas/Periodo' } }
    get:
      tags: [Planificación]
      operationId: obtenerCalendario
      summary: Calendario del mes con estado por pieza. El cliente lo ve solo si está APROBADO_PLAN.
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: servicioContratadoId, in: query, description: Filtro "Todos los servicios", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calendario' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /clientes/{clienteId}/calendario/{periodo}/aprobar:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - { name: periodo, in: path, required: true, schema: { $ref: '#/components/schemas/Periodo' } }
    post:
      tags: [Planificación]
      operationId: aprobarCalendario
      summary: El AM aprueba el plan; el Jefe de Marketing reparte tareas a subagentes (MKT-02)
      x-roles: [ACCOUNT_MANAGER, ADMIN]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, description: Versión del calendario que se revisó }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calendario' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /clientes/{clienteId}/calendario/{periodo}/solicitar-cambios:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - { name: periodo, in: path, required: true, schema: { $ref: '#/components/schemas/Periodo' } }
    post:
      tags: [Planificación]
      operationId: solicitarCambiosCalendario
      summary: El agente regenera las secciones comentadas y sube la versión
      x-roles: [ACCOUNT_MANAGER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, comentario]
              properties:
                version: { type: integer }
                comentario: { type: string, minLength: 1 }
                piezaIds: { type: array, items: { type: string, format: uuid }, description: 'Opcional: entradas concretas a rehacer' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calendario' }

  /clientes/{clienteId}/ideas-blog:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Planificación]
      operationId: listarIdeasBlog
      summary: Ideas propuestas del mes y cuántas puede elegir el cliente (POR-04)
      description: El blog interno es de gestión; el equipo operativo (diseño, audiovisual, paid media, web) recibe 403.
      x-roles: [ACCOUNT_MANAGER, ADMIN, CLIENTE]
      parameters:
