  # ------------------------------------------------------------------ Panel interno
  /panel/proyectos:
    get:
      tags: [Panel interno]
      operationId: pipelineProyectos
      summary: 'Pipeline (reunión 15 oct): una tarjeta por proyecto (servicio contratado activo o en pausa), agrupadas por su situación'
      description: |
        Columnas calculadas, en este orden de prioridad: EN_PAUSA (servicio pausado) · ESPERA_CLIENTE (requerimientos
        atrasados, o la etapa actual depende del cliente y está atrasada) · CON_RETRASO (etapa actual atrasada) ·
        POR_INICIAR (nada avanzado) · POR_CERRAR (avance de 90 % o más) · EN_CURSO.
      x-roles: [EQUIPO]
      parameters:
        - { name: responsableId, in: query, description: 'Solo proyectos cuya cuenta lleva esa persona o donde tiene tareas abiertas', schema: { type: string, format: uuid } }
        - { name: q, in: query, description: Cliente o servicio, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [columnas, datos]
                properties:
                  columnas: { type: array, items: { type: object, required: [clave, titulo], properties: { clave: { $ref: '#/components/schemas/ColumnaProyecto' }, titulo: { type: string } } } }
                  datos: { type: array, items: { $ref: '#/components/schemas/ProyectoPipeline' } }
        '403': { $ref: '#/components/responses/SinPermiso' }

