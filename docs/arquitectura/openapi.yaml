      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: grupo, in: query, description: 'ABIERTOS = ABIERTO, EN_PROCESO, ESPERANDO_CLIENTE; RESUELTOS = RESUELTO, CERRADO', schema: { type: string, enum: [TODOS, ABIERTOS, RESUELTOS], default: TODOS } }
        - { name: q, in: query, description: 'Asunto o número (#1042 o 1042)', schema: { type: string } }
        - { name: servicioContratadoId, in: query, description: Solo los tickets de ese servicio, schema: { type: string, format: uuid } }
        - name: estado
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/EstadoTicket' } }
