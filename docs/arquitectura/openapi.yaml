                  datos: { type: array, items: { $ref: '#/components/schemas/PersonaEquipo' } }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /panel/equipo/{usuarioId}:
    patch:
      tags: [Jarvis del equipo]
      operationId: cambiarAreaPersona
      summary: 'Cambia los datos, el área, el nivel de acceso, el rol, si es lead, si está activa, si es super usuario y los permisos de una persona del equipo (permiso GESTIONAR_EQUIPO). Se refleja en InooWork'
      description: |
        `activo: false` desactiva a la persona en el portal y en InooWork (pierde el acceso; se conservan sus
        registros). `activo: true` la reactiva.

        Solo un super usuario puede cambiar lo que altera el acceso de alguien: `nivel`, `esSuperUsuario`, `permisos`
        y cualquier cambio de `area` o `rolEquipo` que le cambie el nivel o los permisos efectivos. También es el único
        que puede cambiar a otro super usuario. Debe quedar al menos un super usuario activo (422). Cada cambio de
        acceso queda en el historial.
      x-roles: [ADMIN]
      parameters: [ { name: usuarioId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                area: { oneOf: [ { $ref: '#/components/schemas/AreaEquipo' }, { type: 'null' } ] }
                nivel: { oneOf: [ { $ref: '#/components/schemas/NivelAcceso' }, { type: 'null' } ], description: 'null = el de su área' }
                esLead: { type: boolean }
                nombre: { type: string }
                correo: { type: string, format: email }
                cargo: { type: [string, 'null'] }
                rolEquipo: { $ref: '#/components/schemas/RolEquipo' }
                activo: { type: boolean }
                reportaAId: { type: [string, 'null'], format: uuid, description: 'Su jefe en el organigrama; null = nadie' }
                esSuperUsuario: { type: boolean, description: 'Solo super usuario' }
                areasLideradas: { type: array, items: { $ref: '#/components/schemas/AreaEquipo' }, description: 'Solo super usuario. Las áreas que lidera; queda en el historial de accesos' }
                permisos:
                  type: object
                  description: 'Solo super usuario. Permiso → true (concedido), false (quitado) o null (vuelve a lo que da su nivel). Los que no vienen no cambian'
                  properties:
                    GESTIONAR_EQUIPO: { type: [boolean, 'null'] }
                    ASIGNAR_ACCESOS: { type: [boolean, 'null'] }
                    COSTOS_IA: { type: [boolean, 'null'] }
                    ESTADO_PAGO: { type: [boolean, 'null'] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FichaPersona' }
