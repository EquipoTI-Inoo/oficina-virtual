      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TareaEntrada' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarea' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }

  /servicios-contratados/{servicioContratadoId}/entregables:
    parameters:
      - { name: servicioContratadoId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Servicios]
      operationId: listarEntregables
      summary: 'Entregables del proyecto (reunión 15 oct): flujograma, propuesta, prototipo, manual… El cliente solo ve los que ya se le enviaron'
