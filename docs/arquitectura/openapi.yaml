        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HerramientasBot' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    put:
      tags: [Jarvis del equipo]
      operationId: cambiarHerramientasDelBot
      summary: 'Activa skills y conectores de su espacio en un bot (quien puede editar el bot)'
      x-roles: [EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skillIds: { type: array, items: { type: string, format: uuid } }
                conectorIds: { type: array, items: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HerramientasBot' } } } }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }

  /jarvis/rutinas:
    get:
      tags: [Jarvis del equipo]
      operationId: listarRutinasJarvis
      summary: 'Rutinas de los bots del espacio: pedidos que hacen solos cada día, semana o mes (hora de Lima)'
      x-roles: [EQUIPO]
      parameters: [ { name: area, in: query, schema: { type: string } } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [datos], properties: { datos: { type: array, items: { $ref: '#/components/schemas/RutinaJarvis' } } } }
    post:
      tags: [Jarvis del equipo]
      operationId: crearRutinaJarvis
      summary: 'Programa una rutina en un bot que la persona usa. Cada ejecución la paga quien la creó'
      x-roles: [EQUIPO]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RutinaJarvisEntrada' } } } }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/RutinaJarvis' } } } }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }

  /jarvis/rutinas/{rutinaId}:
    parameters: [ { name: rutinaId, in: path, required: true, schema: { type: string, format: uuid } } ]
    patch:
      tags: [Jarvis del equipo]
      operationId: cambiarRutinaJarvis
      summary: 'Cambia, pausa (activa false) o reanuda una rutina (quien la creó, el lead del área o un ADMIN)'
      x-roles: [EQUIPO]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RutinaJarvisEntrada' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RutinaJarvis' } } } }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }
    delete:
      tags: [Jarvis del equipo]
      operationId: borrarRutinaJarvis
      summary: Borra una rutina (sus ejecuciones quedan en la actividad)
      x-roles: [EQUIPO]
      responses:
        '204': { description: Borrada }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /jarvis/rutinas/{rutinaId}/ejecutar:
    parameters: [ { name: rutinaId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [Jarvis del equipo]
      operationId: ejecutarRutinaJarvis
      summary: 'La deja en cola para que corra en la próxima pasada (unos minutos), sin esperar su horario'
      x-roles: [EQUIPO]
      responses:
        '201': { description: En cola, content: { application/json: { schema: { $ref: '#/components/schemas/EjecucionJarvis' } } } }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /jarvis/eventos:
    get:
      tags: [Jarvis del equipo]
      operationId: eventosJarvis
      summary: 'Lo que pasa en el portal y puede disparar una automatización'
      x-roles: [EQUIPO]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { type: array, items: { type: object, required: [clave, nombre], properties: { clave: { type: string }, nombre: { type: string } } } }

  /jarvis/automatizaciones:
    get:
      tags: [Jarvis del equipo]
      operationId: listarAutomatizacionesJarvis
      summary: 'Automatizaciones de los bots del espacio: cuando pasa algo en el portal, el bot hace un pedido'
      x-roles: [EQUIPO]
      parameters: [ { name: area, in: query, schema: { type: string } } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [datos], properties: { datos: { type: array, items: { $ref: '#/components/schemas/AutomatizacionJarvis' } } } }
    post:
      tags: [Jarvis del equipo]
      operationId: crearAutomatizacionJarvis
      summary: 'Crea una automatización en un bot que la persona usa. Al bot solo le llegan los ids del evento; cada ejecución la paga quien la creó'
      x-roles: [EQUIPO]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AutomatizacionJarvisEntrada' } } } }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/AutomatizacionJarvis' } } } }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }

  /jarvis/automatizaciones/{automatizacionId}:
    parameters: [ { name: automatizacionId, in: path, required: true, schema: { type: string, format: uuid } } ]
    patch:
      tags: [Jarvis del equipo]
      operationId: cambiarAutomatizacionJarvis
      summary: 'Cambia, pausa o reanuda una automatización'
      x-roles: [EQUIPO]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AutomatizacionJarvisEntrada' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AutomatizacionJarvis' } } } }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }
    delete:
      tags: [Jarvis del equipo]
      operationId: borrarAutomatizacionJarvis
      summary: Borra una automatización
      x-roles: [EQUIPO]
      responses:
        '204': { description: Borrada }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /jarvis/actividad:
    get:
      tags: [Jarvis del equipo]
      operationId: actividadJarvis
      summary: 'Trazabilidad del espacio: qué corrieron las rutinas y automatizaciones, y cuánto se usó cada skill y en qué bots'
      x-roles: [EQUIPO]
      parameters: [ { name: area, in: query, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ActividadJarvis' } } } }

  /jarvis/biblioteca:
    get:
      tags: [Jarvis del equipo]
      operationId: listarBibliotecaJarvis
      summary: 'Lo que guardó el espacio de lo que generó Jarvis'
      x-roles: [EQUIPO]
      parameters:
        - { name: area, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: 'Busca en el título y el contenido' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [datos, drive], properties: { datos: { type: array, items: { $ref: '#/components/schemas/ElementoBiblioteca' } }, drive: { type: boolean, description: 'Si las copias van a Drive' } } }
    post:
      tags: [Jarvis del equipo]
      operationId: guardarEnBibliotecaJarvis
      summary: 'Guarda una respuesta de un bot en la biblioteca de su espacio (y su copia .md en Drive, si está conectado)'
      x-roles: [EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [botId, titulo, contenido]
              properties:
                botId: { type: string, format: uuid }
                sesionId: { type: [string, 'null'] }
                titulo: { type: string, maxLength: 120 }
                contenido: { type: string }
                area: { type: string, description: 'Espacio desde el que se usa el bot (si está prestado)' }
      responses:
        '201': { description: Guardado, content: { application/json: { schema: { $ref: '#/components/schemas/ElementoBiblioteca' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }

  /jarvis/biblioteca/{elementoId}:
    parameters: [ { name: elementoId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [Jarvis del equipo]
      operationId: verElementoBibliotecaJarvis
      summary: 'Un elemento con su contenido y, si está en Drive, la descarga'
      x-roles: [EQUIPO]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ElementoBiblioteca'
                  - type: object
                    required: [contenido, descarga]
                    properties:
                      contenido: { type: string }
                      descarga: { oneOf: [ { $ref: '#/components/schemas/UrlFirmada' }, { type: 'null' } ] }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    delete:
      tags: [Jarvis del equipo]
      operationId: borrarElementoBibliotecaJarvis
      summary: 'Lo saca de la biblioteca (quien lo guardó, el lead del área o un ADMIN). La copia en Drive se queda'
      x-roles: [EQUIPO]
      responses:
        '204': { description: Borrado }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /integraciones/jarvis/ejecutar:
    post:
      tags: [Integraciones]
      operationId: ejecutarJarvisProgramado
      summary: 'Lo corre el proceso de Jarvis cada 10 minutos (scope jarvis:write): pone en cola las rutinas que tocan y hace hasta 5 ejecuciones pendientes'
      x-roles: [SERVICIO]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [programadas, hechas, fallidas, pendientes]
                properties:
                  programadas: { type: integer }
                  hechas: { type: integer }
                  fallidas: { type: integer }
                  pendientes: { type: integer }
        '403': { $ref: '#/components/responses/SinPermiso' }

  # ───────────── Conexiones personales de Jarvis (9 nov): cada persona conecta su cuenta con OAuth, sin llaves.
  /me/conexiones:
    get:
      tags: [Jarvis del equipo]
      operationId: misConexiones
      summary: 'Las cuentas que la persona puede conectar para sus bots y cuáles conectó'
      x-roles: [EQUIPO]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [datos], properties: { datos: { type: array, items: { $ref: '#/components/schemas/ConexionPersonal' } } } }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /me/conexiones/{proveedor}:
    parameters: [ { name: proveedor, in: path, required: true, schema: { type: string, examples: [google-drive] } } ]
    post:
      tags: [Jarvis del equipo]
      operationId: conectarCuenta
      summary: 'Empieza a conectar la cuenta: devuelve la URL del servicio (OAuth con PKCE). El navegador va allí y vuelve por /conexiones/{proveedor}/vuelta'
      x-roles: [EQUIPO]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string } } } } } }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
    delete:
      tags: [Jarvis del equipo]
      operationId: desconectarCuenta
      summary: 'Desconecta la cuenta: revoca el permiso en el servicio y lo borra del portal'
      x-roles: [EQUIPO]
      responses:
        '204': { description: Desconectada }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /conexiones/{proveedor}/vuelta:
    parameters:
      - { name: proveedor, in: path, required: true, schema: { type: string } }
      - { name: code, in: query, schema: { type: string } }
      - { name: state, in: query, schema: { type: string } }
      - { name: error, in: query, schema: { type: string } }
    get:
      tags: [Jarvis del equipo]
      operationId: vueltaDeConexion
      summary: 'Adonde vuelve el navegador después de autorizar, sin sesión: el «state» (un solo uso, 10 minutos) dice de quién es. Redirige a Mi cuenta con ?conexion=ok o ?conexion=error'
      security: []
      responses:
        '302': { description: A Mi cuenta }

  /me/conexiones/google-drive/buscar:
    get:
      tags: [Jarvis del equipo]
      operationId: buscarEnMiDrive
      summary: 'Busca en el Drive conectado de la persona (por nombre y contenido; sin texto, los más recientes). Lo usan sus bots desde el MCP del portal'
      x-roles: [EQUIPO]
      parameters: [ { name: q, in: query, schema: { type: string } } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [datos], properties: { datos: { type: array, items: { $ref: '#/components/schemas/ArchivoDrivePersonal' } } } }
        '409': { $ref: '#/components/responses/Conflicto' }

  /me/conexiones/google-drive/archivos/{archivoId}:
    parameters: [ { name: archivoId, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [Jarvis del equipo]
      operationId: leerDeMiDrive
      summary: 'Lee un archivo del Drive conectado como texto (Docs, Sheets como CSV, Slides y archivos de texto; hasta 50 000 caracteres)'
      x-roles: [EQUIPO]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ArchivoDrivePersonal'
                  - type: object
                    required: [texto, truncado, aviso]
                    properties:
                      texto: { type: [string, 'null'] }
                      truncado: { type: boolean }
                      aviso: { type: [string, 'null'] }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  # ───────────── Bóveda personal (9 nov): solo la dueña y su Jarvis. Las contraseñas llegan ya cifradas desde el navegador.
  /me/boveda:
    get:
      tags: [Jarvis del equipo]
      operationId: miBoveda
      summary: 'Si la persona tiene bóveda, lo necesario para abrirla en el navegador (sal, vueltas y llave envuelta) y si está abierta para Jarvis'
      x-roles: [EQUIPO]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BovedaPersonal' } } } }
        '403': { $ref: '#/components/responses/SinPermiso' }
    post:
      tags: [Jarvis del equipo]
      operationId: crearBoveda
      summary: 'Crea la bóveda con la llave envuelta por la clave personal (que nunca llega al servidor)'
      x-roles: [EQUIPO]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BovedaGuardada' } } } }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/BovedaPersonal' } } } }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }
    put:
      tags: [Jarvis del equipo]
      operationId: cambiarClaveBoveda
      summary: 'Cambia la clave personal: la misma llave de la bóveda, envuelta de nuevo. Los accesos no cambian'
      x-roles: [EQUIPO]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BovedaGuardada' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BovedaPersonal' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }

  /me/boveda/borrar:
    post:
      tags: [Jarvis del equipo]
      operationId: borrarBoveda
      summary: 'Olvidé mi clave: borra la bóveda y todos sus accesos para empezar de nuevo. No se puede deshacer'
      x-roles: [EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [confirmacion], properties: { confirmacion: { type: string, enum: [BORRAR] } } }
      responses:
        '204': { description: Borrada }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }

  /me/boveda/sesion:
    post:
      tags: [Jarvis del equipo]
      operationId: abrirBovedaParaJarvis
      summary: 'Al abrir la bóveda, el navegador deja la llave de la bóveda (no la clave personal) en la memoria del servidor por 30 minutos, para que Jarvis pueda leerla. Nunca se guarda en la base'
      x-roles: [EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [llave], properties: { llave: { type: string, description: 'Llave AES-256 cruda en base64url (43 caracteres)' } } }
      responses:
        '204': { description: Abierta para Jarvis }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }
    delete:
      tags: [Jarvis del equipo]
      operationId: cerrarBovedaParaJarvis
      summary: 'Cierra la bóveda: borra la llave de la memoria del servidor'
      x-roles: [EQUIPO]
      responses:
        '204': { description: Cerrada }

  /me/boveda/accesos:
    get:
      tags: [Jarvis del equipo]
      operationId: listarAccesosBoveda
      summary: 'Los accesos de la bóveda, sin la contraseña: nombre, usuario, web y cliente. También para Jarvis'
      x-roles: [EQUIPO]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: clienteId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [datos], properties: { datos: { type: array, items: { $ref: '#/components/schemas/AccesoBoveda' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    post:
      tags: [Jarvis del equipo]
      operationId: crearAccesoBoveda
      summary: 'Guarda un acceso. La contraseña y las notas llegan cifradas desde el navegador'
      x-roles: [EQUIPO]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AccesoBovedaEntrada' } } } }
      responses:
        '201': { description: Guardado, content: { application/json: { schema: { $ref: '#/components/schemas/AccesoBoveda' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }

  /me/boveda/accesos/{accesoId}:
    parameters: [ { name: accesoId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [Jarvis del equipo]
      operationId: verAccesoBoveda
      summary: 'Un acceso con su contraseña cifrada, para descifrarla en el navegador. Jarvis no usa esta ruta'
      x-roles: [EQUIPO]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AccesoBoveda'
                  - { type: object, required: [secretoCifrado], properties: { secretoCifrado: { type: string } } }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Jarvis del equipo]
      operationId: cambiarAccesoBoveda
      summary: Cambia un acceso
      x-roles: [EQUIPO]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AccesoBovedaEntrada' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AccesoBoveda' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }
    delete:
      tags: [Jarvis del equipo]
      operationId: borrarAccesoBoveda
      summary: Borra un acceso
      x-roles: [EQUIPO]
      responses:
        '204': { description: Borrado }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /me/boveda/accesos/{accesoId}/secreto:
    parameters: [ { name: accesoId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [Jarvis del equipo]
      operationId: leerSecretoBovedaJarvis
      summary: 'Solo Jarvis, con la bóveda abierta: la contraseña y las notas en claro (pasan por el modelo de IA). El chat donde se lee pasa a ser privado de su dueña'
      x-roles: [EQUIPO]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [clave, notas], properties: { clave: { type: string }, notas: { type: string } } }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /jarvis/bots:
    get:
      tags: [Jarvis del equipo]
      operationId: botsDeMiArea
      summary: 'Sección «Jarvis»: los bots de un espacio que veo (mi área, las que lidero o, si soy super usuario, cualquiera y Gerencia), cómo va el área contra sus topes y si su Hermes está conectado'
      x-roles: [EQUIPO]
      parameters: [ { name: area, in: query, required: false, schema: { $ref: '#/components/schemas/EspacioJarvis' }, description: 'Por defecto, mi área' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BotsDelArea' }
        '403': { $ref: '#/components/responses/SinPermiso' }
    post:
      tags: [Jarvis del equipo]
