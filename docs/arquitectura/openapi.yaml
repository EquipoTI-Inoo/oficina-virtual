    RutinaJarvis:
      type: object
      required: [id, bot, nombre, pedido, frecuencia, hora, diaSemana, diaMes, activa, horario, proximaEn, ultima, creadoPor, puedeEditar]
      properties:
        id: { type: string, format: uuid }
        bot: { $ref: '#/components/schemas/BotMini' }
        nombre: { type: string }
        pedido: { type: string }
        frecuencia: { $ref: '#/components/schemas/FrecuenciaRutina' }
        hora: { type: string, examples: ['08:30'], description: 'Hora de Lima' }
        diaSemana: { type: [integer, 'null'], description: '1 = lunes … 7 = domingo' }
        diaMes: { type: [integer, 'null'] }
        activa: { type: boolean }
        horario: { type: string, examples: ['De lunes a viernes a las 08:30'] }
        proximaEn: { type: [string, 'null'], format: date-time, description: 'null si está pausada' }
        ultima: { oneOf: [ { $ref: '#/components/schemas/EjecucionJarvis' }, { type: 'null' } ] }
        creadoPor: { $ref: '#/components/schemas/PersonaMini' }
        puedeEditar: { type: boolean }

    RutinaJarvisEntrada:
      type: object
      properties:
        botId: { type: string, format: uuid, description: 'Solo al crear' }
        area: { type: string, description: 'Solo al crear: espacio desde el que se usa el bot' }
        nombre: { type: string, maxLength: 80 }
        pedido: { type: string, maxLength: 4000 }
        frecuencia: { $ref: '#/components/schemas/FrecuenciaRutina' }
        hora: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        diaSemana: { type: [integer, 'null'], minimum: 1, maximum: 7 }
        diaMes: { type: [integer, 'null'], minimum: 1, maximum: 28 }
        activa: { type: boolean }

    AutomatizacionJarvis:
      type: object
      required: [id, bot, nombre, evento, eventoNombre, pedido, activa, ultima, creadoPor, puedeEditar]
      properties:
        id: { type: string, format: uuid }
        bot: { $ref: '#/components/schemas/BotMini' }
        nombre: { type: string }
        evento: { type: string, examples: [ticket.creado] }
        eventoNombre: { type: string }
        pedido: { type: string }
        activa: { type: boolean }
        ultima: { oneOf: [ { $ref: '#/components/schemas/EjecucionJarvis' }, { type: 'null' } ] }
        creadoPor: { $ref: '#/components/schemas/PersonaMini' }
        puedeEditar: { type: boolean }

    AutomatizacionJarvisEntrada:
      type: object
      properties:
        botId: { type: string, format: uuid, description: 'Solo al crear' }
        area: { type: string, description: 'Solo al crear' }
        nombre: { type: string, maxLength: 80 }
        evento: { type: string }
        pedido: { type: string, maxLength: 4000 }
        activa: { type: boolean }

    ActividadJarvis:
      type: object
      required: [ejecuciones, skills]
      properties:
        ejecuciones: { type: array, items: { $ref: '#/components/schemas/EjecucionJarvis' }, description: 'Las últimas 50' }
        skills:
          type: array
          items:
            type: object
            required: [skillId, nombre, usos, ultimoUso, porBot]
            properties:
              skillId: { type: string, format: uuid }
              nombre: { type: string }
              usos: { type: integer }
              ultimoUso: { type: [string, 'null'], format: date-time }
              porBot: { type: array, items: { type: object, required: [nombre, usos], properties: { nombre: { type: string }, usos: { type: integer } } } }

    ElementoBiblioteca:
      type: object
      required: [id, espacio, bot, titulo, resumen, sesionId, creadoPor, creadoEn, enDrive, puedeBorrar]
      properties:
        id: { type: string, format: uuid }
        espacio: { type: string }
        bot: { type: object, required: [id, nombre], properties: { id: { type: [string, 'null'], format: uuid }, nombre: { type: string } } }
        titulo: { type: string }
        resumen: { type: string, description: 'Los primeros 240 caracteres' }
        sesionId: { type: [string, 'null'] }
        creadoPor: { $ref: '#/components/schemas/PersonaMini' }
        creadoEn: { type: string, format: date-time }
        enDrive: { type: boolean }
        puedeBorrar: { type: boolean }

    ConexionPersonal:
      type: object
      required: [proveedor, nombre, descripcion, disponible, conectada, cuenta, conectadaEn, ultimoUso]
      properties:
        proveedor: { type: string, examples: [google-drive] }
        nombre: { type: string }
        descripcion: { type: string }
        disponible: { type: boolean, description: 'false si el portal todavía no tiene la app de ese servicio configurada' }
        conectada: { type: boolean }
        cuenta: { type: [string, 'null'], description: 'Con qué cuenta se conectó (p. ej. su correo)' }
        conectadaEn: { type: [string, 'null'], format: date-time }
        ultimoUso: { type: [string, 'null'], format: date-time }

    ArchivoDrivePersonal:
      type: object
      required: [id, nombre, tipo, modificado, enlace]
      properties:
        id: { type: string }
        nombre: { type: string }
        tipo: { type: string, description: 'Tipo MIME' }
        modificado: { type: [string, 'null'], format: date-time }
        enlace: { type: [string, 'null'] }

    BovedaGuardada:
      type: object
      required: [sal, iteraciones, llaveEnvuelta]
      properties:
        sal: { type: string }
        iteraciones: { type: integer, minimum: 300000, maximum: 5000000 }
        llaveEnvuelta: { type: string, description: 'v1.<iv>.<llave de la bóveda cifrada con la clave personal>' }

    BovedaPersonal:
      type: object
      required: [configurada, sal, iteraciones, llaveEnvuelta, accesos, abierta]
      properties:
        configurada: { type: boolean }
        sal: { type: [string, 'null'] }
        iteraciones: { type: [integer, 'null'] }
        llaveEnvuelta: { type: [string, 'null'], description: 'null para Jarvis' }
        accesos: { type: integer }
        abierta: { type: boolean, description: 'Si Jarvis la puede leer ahora (la llave está en la memoria del servidor)' }

    AccesoBoveda:
      type: object
      required: [id, nombre, usuario, url, cliente, actualizadoEn]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        usuario: { type: [string, 'null'] }
        url: { type: [string, 'null'] }
        cliente: { oneOf: [ { type: object, required: [id, nombre], properties: { id: { type: string, format: uuid }, nombre: { type: string } } }, { type: 'null' } ] }
        actualizadoEn: { type: string, format: date-time }

    AccesoBovedaEntrada:
      type: object
      properties:
        nombre: { type: string, maxLength: 120 }
        usuario: { type: [string, 'null'], maxLength: 200 }
        url: { type: [string, 'null'] }
        clienteId: { type: [string, 'null'], format: uuid }
        secretoCifrado: { type: string, description: 'v1.<iv>.<contraseña y notas cifradas en el navegador>' }

    EmpresaResumen:
      type: object
      required: [id, nombre, tipo, estado, personas, proyectosActivos, equipoConAcceso]
      properties:
        id: { type: string, description: '«inoo» o el id del cliente' }
        nombre: { type: string }
        tipo: { type: string, enum: [AGENCIA, CLIENTE] }
        estado: { oneOf: [ { $ref: '#/components/schemas/EstadoCliente' }, { type: 'null' } ], description: 'null en Inoo' }
        personas: { type: integer, description: 'Inoo: el equipo activo. Cliente: sus usuarios del portal' }
        proyectosActivos: { type: integer, description: 'Activos o en standby' }
        equipoConAcceso: { type: integer, description: 'Cliente: personas del equipo con acceso (AM, asignadas y de sus proyectos), sin contar a los ADMIN. Inoo: quienes ven todo' }

    PersonaEmpresa:
      type: object
      required: [id, nombre, email, cargo, rolCliente, area, nivel, esLead, invitacionPendiente]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        email: { type: [string, 'null'] }
        cargo: { type: [string, 'null'] }
        rolCliente: { oneOf: [ { $ref: '#/components/schemas/RolCliente' }, { type: 'null' } ], description: 'Solo en clientes' }
        area: { oneOf: [ { $ref: '#/components/schemas/AreaEquipo' }, { type: 'null' } ], description: 'Solo en Inoo' }
        nivel: { oneOf: [ { $ref: '#/components/schemas/NivelAcceso' }, { type: 'null' } ], description: 'Solo en Inoo' }
        esLead: { type: boolean }
        invitacionPendiente: { type: boolean }

    ProyectoEmpresa:
      type: object
      required: [servicioContratadoId, titulo, estado, porcentaje, responsable]
      properties:
        servicioContratadoId: { type: string, format: uuid }
        titulo: { type: string }
        estado: { $ref: '#/components/schemas/EstadoServicio' }
        porcentaje: { type: integer }
        responsable: { oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ] }

    AccesoEmpresa:
      type: object
      required: [persona, acceso, motivo, proyectos]
      properties:
        persona: { $ref: '#/components/schemas/PersonaEquipo' }
        acceso: { type: string, enum: [COMPLETO, PROYECTOS] }
        motivo: { type: string, enum: [AM, ASIGNADO, PROYECTO, ADMIN], description: 'ADMIN: ve todas las cuentas por su nivel' }
        proyectos: { type: array, items: { type: string }, description: 'Con PROYECTOS: los proyectos en los que está' }

    EmpresaDetalle:
      type: object
      required: [empresa, gente, proyectos, accesos]
      properties:
        empresa: { $ref: '#/components/schemas/EmpresaResumen' }
        gente: { type: array, items: { $ref: '#/components/schemas/PersonaEmpresa' } }
        proyectos: { type: array, items: { $ref: '#/components/schemas/ProyectoEmpresa' } }
        accesos: { type: array, items: { $ref: '#/components/schemas/AccesoEmpresa' } }

    MiCuentaEquipo:
      type: object
      required: [perfil, accesos, proyectosACargo, jarvis, cambiarClaveUrl, sesionesCerradasEn]
      properties:
        perfil:
          type: object
          required: [nombre, email, cargo, area, nivelAcceso, esSuperUsuario, areasLideradas, fotoUrl]
          properties:
            nombre: { type: string }
            email: { type: string }
            cargo: { type: [string, 'null'] }
            area: { type: [string, 'null'] }
            nivelAcceso: { type: [string, 'null'] }
            esSuperUsuario: { type: boolean }
            areasLideradas: { type: array, items: { type: string } }
            fotoUrl: { type: [string, 'null'], description: 'Foto de la ficha de InooWork' }
        accesos:
          type: array
          description: Clientes que veo y con qué alcance
          items:
            type: object
            required: [clienteId, nombre, acceso]
            properties:
              clienteId: { type: string, format: uuid }
              nombre: { type: string }
              acceso: { type: string, enum: [COMPLETO, PROYECTOS] }
        proyectosACargo: { type: integer, description: Proyectos activos donde soy responsable }
        jarvis:
          type: object
          required: [gastoMesUsd, mensajesMes, area]
          properties:
            gastoMesUsd: { type: number, description: Lo que gasté en Jarvis este mes (hora de Lima) }
            mensajesMes: { type: integer }
            area: { type: [string, 'null'], description: Área a la que se cobra }
        cambiarClaveUrl: { type: [string, 'null'] }
        sesionesCerradasEn: { type: [string, 'null'], format: date-time, description: 'Última vez que se cerraron todas las sesiones' }
    MiJarvis:
      type: object
      required: [area, consumo, llave, urlPasarela, modelos]
      properties:
        area: { oneOf: [ { $ref: '#/components/schemas/AreaEquipo' }, { type: 'null' } ] }
        consumo: { oneOf: [ { $ref: '#/components/schemas/ConsumoArea' }, { type: 'null' } ], description: 'El de mi área (sin el detalle por persona)' }
        llave:
          type: [object, 'null']
          required: [prefijo, creadoEn]
          properties:
            prefijo: { type: string, examples: [jv_3f9a1c2e] }
            creadoEn: { type: string, format: date-time }
            ultimoUso: { type: [string, 'null'], format: date-time }
        urlPasarela: { type: string, description: 'Ruta de la pasarela para el base_url de Hermes', examples: [/api/v1/ia-equipo] }
        modelos: { type: array, items: { type: string }, examples: [[deepseek-flash, deepseek-v4-pro]] }
    TipoAgenda:
      type: string
      enum: [REUNION, TAREA, REQUERIMIENTO, FERIADO, PENDIENTE, EVENTO]
      description: 'REUNION de un proyecto; TAREA que vence; REQUERIMIENTO que el cliente debe entregar; FERIADO o día no laborable; PENDIENTE y EVENTO los crea la persona'
    EventoAgenda:
      type: object
      required: [id, tipo, titulo, fecha, horaInicio, horaFin, detalle, enlace, hecho, vencido, origen, eventoId, editable, notas, invitados]
      properties:
        id: { type: string, description: 'Único en la agenda: el tipo y el id de lo que representa' }
        tipo: { $ref: '#/components/schemas/TipoAgenda' }
        titulo: { type: string }
        fecha: { type: string, format: date, description: 'Día en Lima' }
        horaInicio: { type: [string, 'null'], pattern: '^[0-2][0-9]:[0-5][0-9]$', description: 'null = todo el día' }
        horaFin: { type: [string, 'null'], pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        detalle: { type: [string, 'null'], description: 'El proyecto al que pertenece' }
        enlace: { type: [string, 'null'], description: 'Ruta del portal donde se ve' }
        hecho: { type: boolean, description: 'Pendiente marcado como hecho o reunión ya realizada' }
        vencido: { type: boolean, description: 'Tarea o requerimiento cuya fecha ya pasó sin cerrarse' }
        origen: { type: string, enum: [PORTAL, GOOGLE] }
        eventoId: { type: [string, 'null'], format: uuid, description: 'Solo PENDIENTE y EVENTO' }
        editable: { type: boolean, description: 'Lo creó la persona (los invitados no lo editan)' }
        notas: { type: [string, 'null'] }
        invitados: { type: array, items: { $ref: '#/components/schemas/PersonaMini' } }
    EventoAgendaEntrada:
      type: object
      description: 'Al crear: tipo, titulo y fecha obligatorios. Sin horaInicio es de todo el día; un evento con hora y sin horaFin dura una hora. hecho solo para pendientes; invitados solo para eventos'
      properties:
        tipo: { type: string, enum: [PENDIENTE, EVENTO] }
        titulo: { type: string, minLength: 2, maxLength: 120 }
        fecha: { type: string, format: date }
        horaInicio: { type: [string, 'null'], pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        horaFin: { type: [string, 'null'], pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        notas: { type: [string, 'null'], maxLength: 2000 }
        hecho: { type: boolean }
        invitadosIds: { type: array, maxItems: 30, items: { type: string, format: uuid }, description: 'Personas del equipo' }
    ConexionGoogle:
      type: object
      required: [conectado, correo, conectadoEn, simulada]
      properties:
        conectado: { type: boolean }
        correo: { type: [string, 'null'] }
        conectadoEn: { type: [string, 'null'], format: date-time }
        simulada: { type: boolean, description: 'true mientras la sincronización real con Google no esté activa' }
    Agenda:
      type: object
      required: [desde, hasta, eventos, google]
      properties:
        desde: { type: string, format: date }
        hasta: { type: string, format: date }
        eventos: { type: array, description: 'Por día; lo de todo el día primero', items: { $ref: '#/components/schemas/EventoAgenda' } }
        google: { $ref: '#/components/schemas/ConexionGoogle' }
    BotEntrada:
      type: object
      properties:
        nombre: { type: string, minLength: 2, maxLength: 60, examples: [Seguimiento de clientes] }
        color: { type: string, enum: ['#5554d9', '#1f9d74', '#d9822b', '#d64545', '#2b7bd9', '#9b51e0', '#475467'] }
        forma: { type: string, enum: [CIRCULO, CUADRADO, ROMBO] }
        personaje: { type: [string, 'null'], enum: [ROBOT, BUHO, ZORRO, PANDA, GATO, PERRO, LEON, PULPO, ABEJA, PINGUINO, TORTUGA, RANA, UNICORNIO, DELFIN, KOALA, COHETE, null], description: 'Mascota sobre el color; null = su inicial' }
        instrucciones: { type: string, maxLength: 4000, description: 'Su trabajo: qué hace, con qué fuentes y qué no debe hacer' }
        espacio: { $ref: '#/components/schemas/EspacioJarvis', description: 'Solo al crear: dónde va (por defecto, mi área)' }
    ConversacionJarvis:
      type: object
      required: [id, titulo, creadaEn, ultimoUso, mensajes]
      properties:
        id: { type: string, description: El código de la conversación (sesionId del chat) }
        titulo: { type: string }
        creadaEn: { type: string, format: date-time }
        ultimoUso: { type: string, format: date-time }
        mensajes: { type: integer }
        ultimaPersona: { type: [string, 'null'], description: 'Quién escribió el último mensaje (las conversaciones son del área)' }
    AccionJarvis:
      type: object
      required: [id, conversacion, tipo, resumen, estado, error, enlace, creadoEn, decididoEn]
      properties:
        id: { type: string, format: uuid }
        conversacion: { type: string }
        tipo: { type: string, enum: [CREAR_TAREA, COMENTAR_PROYECTO, CREAR_PENDIENTE] }
        resumen: { type: string, description: Lo que se va a hacer, en una frase }
        estado: { type: string, enum: [PENDIENTE, APROBADA, RECHAZADA, FALLIDA] }
        error: { type: [string, 'null'], description: Por qué falló al hacerla }
        enlace: { type: [string, 'null'], description: Dónde quedó (ruta del portal) }
        creadoEn: { type: string, format: date-time }
        decididoEn: { type: [string, 'null'], format: date-time }
    BotJarvis:
      type: object
      required: [id, nombre, color, forma, personaje, instrucciones, creadoPor, creadoEn, actualizadoEn, ultimoUso, puedeEditar, prestadoDe, prestamos]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        color: { type: string }
        forma: { type: string, enum: [CIRCULO, CUADRADO, ROMBO] }
        personaje: { type: [string, 'null'], enum: [ROBOT, BUHO, ZORRO, PANDA, GATO, PERRO, LEON, PULPO, ABEJA, PINGUINO, TORTUGA, RANA, UNICORNIO, DELFIN, KOALA, COHETE, null] }
        instrucciones: { type: string }
        creadoPor: { $ref: '#/components/schemas/PersonaMini' }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
        ultimoUso: { type: [string, 'null'], format: date-time }
        puedeEditar: { type: boolean, description: 'Quien lo creó, un ADMIN o quien lidera su área (nunca en un bot prestado)' }
        prestadoDe:
          description: 'Si se ve aquí porque otra área lo prestó: de quién y si se ven sus chats'
          oneOf:
            - { $ref: '#/components/schemas/PrestamoBot' }
            - { type: 'null' }
        prestamos: { type: array, description: 'A quién lo presta (solo en su área dueña)', items: { $ref: '#/components/schemas/PrestamoBot' } }
    PrestamoBot:
      type: object
      required: [clave, nombre, conChats]
      properties:
        clave: { $ref: '#/components/schemas/EspacioJarvis' }
        nombre: { type: string }
        conChats: { type: boolean }
    EspacioJarvis:
      type: string
      description: 'Un área o GERENCIA (los bots de los super usuarios; su gasto va a Administración)'
      enum: [ADMINISTRACION, CRM, COMERCIAL, AUDIOVISUAL, DISENO, MARKETING, GERENCIA]
    BotsDelArea:
      type: object
      required: [area, espacio, espacios, consumo, conectado, bots]
      properties:
        area: { oneOf: [ { $ref: '#/components/schemas/AreaEquipo' }, { type: 'null' } ], description: 'El área que paga (sin área no hay bots)' }
        espacio: { oneOf: [ { $ref: '#/components/schemas/EspacioJarvis' }, { type: 'null' } ], description: 'El espacio que se muestra' }
        espacios:
          type: array
          description: 'Los espacios que ve: su área, las que lidera y, si es super usuario, todas y Gerencia'
          items: { type: object, required: [clave, nombre], properties: { clave: { $ref: '#/components/schemas/EspacioJarvis' }, nombre: { type: string } } }
        consumo: { oneOf: [ { $ref: '#/components/schemas/ConsumoArea' }, { type: 'null' } ] }
        conectado: { type: boolean, description: 'El Hermes del área está registrado en el portal' }
        bots: { type: array, items: { $ref: '#/components/schemas/BotJarvis' } }
    LlaveJarvisNueva:
      type: object
      required: [llave, prefijo, creadoEn]
      properties:
        llave: { type: string, description: 'Solo se muestra esta vez', examples: [jv_0000000000000000000000000000000000000000] }
        prefijo: { type: string }
        creadoEn: { type: string, format: date-time }
    ErrorOpenAi:
      type: object
      description: 'Error de la pasarela /ia-equipo en el formato de OpenAI, para que Hermes lo muestre'
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, code]
          properties:
            message: { type: string }
            type: { type: string, examples: [insufficient_quota] }
            code: { type: string, examples: [TOPE_AREA] }
    Tarea:
      type: object
      required: [id, servicioContratadoId, titulo, estado, vencida, comentarios, creadoEn]
      properties:
        id: { type: string, format: uuid }
        servicioContratadoId: { type: string, format: uuid }
        etapaId: { type: [string, 'null'], format: uuid }
        etapaNombre: { type: [string, 'null'] }
        titulo: { type: string }
        descripcion: { type: [string, 'null'] }
        estado: { $ref: '#/components/schemas/EstadoTarea' }
        responsable: { oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ] }
        fechaLimite: { type: [string, 'null'], format: date }
        vencida: { type: boolean, description: 'No está HECHA y su fecha límite ya pasó' }
        comentarios: { type: integer }
        creadoPor: { oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ] }
        creadoEn: { type: string, format: date-time }
        completadaEn: { type: [string, 'null'], format: date-time }
    TareaEntrada:
      type: object
      description: 'Al crear, titulo es obligatorio. responsableId debe ser del equipo; etapaId, del mismo proyecto'
      properties:
        titulo: { type: string, minLength: 3, maxLength: 200 }
        descripcion: { type: [string, 'null'] }
        estado: { $ref: '#/components/schemas/EstadoTarea' }
        responsableId: { type: [string, 'null'], format: uuid }
        etapaId: { type: [string, 'null'], format: uuid }
        fechaLimite: { type: [string, 'null'], format: date }
    ComentarioTarea:
      type: object
      required: [id, autor, texto, menciones, creadoEn]
      properties:
        id: { type: string, format: uuid }
        autor: { $ref: '#/components/schemas/PersonaMini' }
        texto: { type: string }
        menciones: { type: array, items: { $ref: '#/components/schemas/PersonaMini' } }
        creadoEn: { type: string, format: date-time }
    ResultadoBusqueda:
      type: object
      required: [tipo, id, titulo, detalle, enlace]
      properties:
        tipo: { type: string, enum: [CLIENTE, PROYECTO, TABLERO, ENTREGABLE, REQUERIMIENTO, TICKET] }
        id: { type: string }
        titulo: { type: string }
        detalle: { type: [string, 'null'], description: Casi siempre el cliente }
        enlace: { type: string, description: Ruta del portal }
    TableroResumen:
      type: object
      required: [id, nombre, cliente, color, lider, miembros, items, puedeEditar, esMio]
      properties:
        id: { type: string, examples: [PROJ-MKT01] }
        nombre: { type: string }
        cliente: { type: [string, 'null'], description: 'El cliente que el proyecto tiene en InooWork; null = sin asignar' }
        esMio: { type: boolean, description: 'La persona es líder o miembro activo' }
        descripcion: { type: [string, 'null'] }
        color: { type: string }
        estado: { type: [string, 'null'] }
        area: { type: [string, 'null'] }
        lider: { oneOf: [ { $ref: '#/components/schemas/PersonaInooWork' }, { type: 'null' } ] }
        miembros: { type: integer }
        items:
          type: object
          required: [total, completados, vencidos]
          properties:
            total: { type: integer }
            completados: { type: integer }
            vencidos: { type: integer }
        puedeEditar: { type: boolean }
    PersonaInooWork:
      type: object
      required: [id, nombre]
      properties:
        id: { type: string, description: 'Id de empleado de InooWork (EMP-…)' }
        nombre: { type: string }
    SubitemTablero:
      type: object
      required: [id, nombre, estado, responsable, fecha, vencido]
      properties:
        id: { type: string }
        nombre: { type: string }
        estado: { type: string, enum: [Sin Iniciar, En Progreso, En Revisión, Completado, Soporte Continuo, Bloqueado] }
        responsable: { oneOf: [ { $ref: '#/components/schemas/PersonaInooWork' }, { type: 'null' } ] }
        fecha: { type: [string, 'null'], format: date }
        vencido: { type: boolean }
    ItemTablero:
      type: object
      required: [id, nombre, estado, responsable, fecha, prioridad, notas, grupoId, valores, datos, subitems, vencido, deMonday]
      properties:
        id: { type: string }
        deMonday: { type: boolean, description: 'Vino de Monday (9 nov): tiene historial (actualizaciones y archivos) en el portal.' }
        nombre: { type: string }
        estado: { type: string, enum: [Sin Iniciar, En Progreso, En Revisión, Completado, Soporte Continuo, Bloqueado] }
        responsable: { oneOf: [ { $ref: '#/components/schemas/PersonaInooWork' }, { type: 'null' } ] }
        fecha: { type: [string, 'null'], format: date }
        prioridad: { type: string, enum: [Baja, Media, Alta, Urgente] }
        notas: { type: string }
        grupoId: { type: string }
        creadoEn: { type: [string, 'null'] }
        vencido: { type: boolean }
        valores: { type: object, additionalProperties: { type: [string, number] }, description: 'Texto visible de cada columna personalizada (también las calculadas), por id de columna' }
        datos: { type: object, additionalProperties: true, description: 'Lo que el portal guarda además del texto: ids de personas, archivos, votos, cronómetro, documento…' }
        subitems: { type: array, items: { $ref: '#/components/schemas/SubitemTablero' } }
    ComentariosArchivo:
      type: object
      required: [archivo, datos]
      properties:
        archivo:
          type: object
          required: [id, nombre, mime, bytes, version, versiones]
          properties:
            id: { type: string }
            nombre: { type: string }
            mime: { type: string }
            bytes: { type: integer }
            version: { type: integer }
            versiones:
              type: array
              items:
                type: object
                required: [id, version, nombre, mime, bytes, en, por]
                properties:
                  id: { type: string }
                  version: { type: integer }
                  nombre: { type: string }
                  mime: { type: string }
                  bytes: { type: integer }
                  en: { type: string }
                  por: { type: [string, 'null'] }
        datos:
          type: array
          items:
            type: object
            required: [id, version, autor, texto, en]
            properties:
              id: { type: string }
              version: { type: integer }
              autor: { type: string }
              texto: { type: string }
              en: { type: string }
    ConfigColumna:
      type: object
      description: Configuración de una columna según su tipo.
      properties:
        etiquetas: { type: array, items: { type: object, required: [texto, color], properties: { texto: { type: string }, color: { type: string }, hecho: { type: boolean } } } }
        opciones: { type: array, items: { type: string } }
        unidad: { type: string }
        unidadAntes: { type: boolean }
        resumen: { type: string, enum: [SUMA, PROMEDIO, MINIMO, MAXIMO, NINGUNO] }
        decimales: { type: integer }
        maximo: { type: integer }
        texto: { type: string }
        accion: { type: object, required: [columnaId, valor], properties: { columnaId: { type: string }, valor: { type: string } } }
        tableroId: { type: string }
        conexionId: { type: string }
        columnaEspejo: { type: string }
        expresion: { type: string }
        columnas: { type: array, items: { type: string } }
    ImportacionMonday:
      type: [object, 'null']
      required: [proyectoId, en]
      properties:
        proyectoId: { type: string }
        en: { type: string, format: date-time }
    PreviaMonday:
      type: object
      required: [tablero, conteo, columnas, estados, personas, equipo, importado]
      properties:
        tablero:
          type: object
          required: [id, nombre, espacio, descripcion]
          properties:
            id: { type: string }
            nombre: { type: string }
            espacio: { type: [string, 'null'] }
            descripcion: { type: string }
        conteo:
          type: object
          required: [grupos, items, subitems, actualizaciones, archivos]
          properties:
            grupos: { type: integer }
            items: { type: integer }
            subitems: { type: integer }
            actualizaciones: { type: integer }
            archivos: { type: integer }
        columnas:
          type: array
          items:
            type: object
            required: [id, titulo, tipo, uso]
            properties:
              id: { type: string }
              titulo: { type: string }
              tipo: { type: string }
              uso: { type: string, enum: [ESTADO, PRIORIDAD, RESPONSABLE, FECHA, LINEA_TIEMPO, NOTAS, COLUMNA, NO_SE_PASA] }
        estados:
          type: array
          items:
            type: object
            required: [etiqueta, cantidad, sugerido]
            properties:
              etiqueta: { type: string }
              cantidad: { type: integer }
              sugerido: { type: string, enum: [Sin Iniciar, En Progreso, En Revisión, Completado, Soporte Continuo, Bloqueado] }
        personas:
          type: array
          items:
            type: object
            required: [id, nombre, email, cantidad, esDueno, sugeridoId]
            properties:
              id: { type: string }
              nombre: { type: string }
              email: { type: [string, 'null'] }
              cantidad: { type: integer }
              esDueno: { type: boolean }
              sugeridoId: { type: [string, 'null'] }
        equipo:
          type: array
          items:
            type: object
            required: [id, nombre, conFicha]
            properties:
              id: { type: string, format: uuid }
              nombre: { type: string }
              conFicha: { type: boolean, description: Tiene ficha en InooWork (puede ser responsable). }
        importado: { $ref: '#/components/schemas/ImportacionMonday' }
    EntradaHistorialMonday:
      type: object
      required: [id, tipo, autor, fecha, texto, respuestas, archivos]
      properties:
        id: { type: string }
        tipo: { type: string, enum: [ACTUALIZACION, ARCHIVOS] }
        autor: { type: [string, 'null'] }
        fecha: { type: [string, 'null'] }
        texto: { type: string }
        respuestas:
          type: array
          items:
            type: object
            required: [autor, fecha, texto]
            properties:
              autor: { type: string }
              fecha: { type: [string, 'null'] }
              texto: { type: string }
        archivos:
          type: array
          items:
            type: object
            required: [id, nombre, bytes, disponible]
            properties:
              id: { type: string }
              nombre: { type: string }
              bytes: { type: [integer, 'null'] }
              disponible: { type: boolean, description: Se copió al almacén del portal y se puede descargar. }
    TableroInooWork:
      type: object
      description: 'Un proyecto de InooWork tal como lo muestra el portal. InooWork es la fuente'
      required: [id, nombre, color, lider, personas, grupos, columnas, vistas, items, puedeEditar]
      properties:
        id: { type: string }
        nombre: { type: string }
        cliente: { type: [string, 'null'], description: 'null = sin asignar en InooWork' }
        descripcion: { type: [string, 'null'] }
        color: { type: string }
        estado: { type: [string, 'null'] }
        completadoEn: { type: [string, 'null'], format: date, description: 'Cuándo se culminó (estado Completado); a los 14 días se archiva' }
        area: { type: [string, 'null'] }
        lider: { oneOf: [ { $ref: '#/components/schemas/PersonaInooWork' }, { type: 'null' } ] }
        personas: { type: array, items: { $ref: '#/components/schemas/PersonaInooWork' }, description: 'A quiénes se puede asignar: el líder y los miembros activos' }
        grupos:
          type: array
          items:
            type: object
            required: [id, nombre, color]
            properties:
              id: { type: string }
              nombre: { type: string }
              color: { type: string }
        columnas:
          type: array
          description: 'Columnas personalizadas de las vistas de InooWork (11 nov: con los tipos de la biblioteca de Monday)'
          items:
            type: object
            required: [id, nombre, tipo, config]
            properties:
              id: { type: string }
              nombre: { type: string }
              tipo: { type: string, description: 'text, long_text, number, etiqueta, dropdown, date, people, checkbox, tags, timeline, week, hour, time_tracking, world_clock, email, phone, link, country, location, rating, vote, color_picker, file, doc, button, dependency, board_relation, mirror, formula, progress, creation_log, last_updated, item_id, auto_number' }
              config: { oneOf: [ { $ref: '#/components/schemas/ConfigColumna' }, { type: 'null' } ] }
        vistas:
          type: array
          items:
            type: object
            required: [tipo]
            properties:
              tipo: { type: string, enum: [TABLA, KANBAN, CALENDARIO, LINEA_TIEMPO, GRAFICO] }
        items: { type: array, items: { $ref: '#/components/schemas/ItemTablero' } }
        puedeEditar: { type: boolean }
    CambioItemTablero:
      type: object
      properties:
        nombre: { type: string }
        estado: { type: string, enum: [Sin Iniciar, En Progreso, En Revisión, Completado, Soporte Continuo, Bloqueado] }
        responsableId: { type: [string, 'null'], description: 'Id de empleado: el líder o un miembro activo' }
        fecha: { type: [string, 'null'], format: date }
        prioridad: { type: string, enum: [Baja, Media, Alta, Urgente] }
        notas: { type: [string, 'null'] }
        grupoId: { type: string, description: 'Obligatorio al crear' }
        valores: { type: object, additionalProperties: true }
    ComplejidadTicket:
      type: string
      enum: [BASICO, COMPLEJO]
      description: 'La clasifica el equipo; por defecto BASICO'
    BolsaSoporte:
      type: object
      description: 'Lo incluido cada mes en el soporte continuo (reunión 15 oct). Si el contrato no la define, se usa la del plan (valores de relleno hasta que Comercial los confirme).'
      required: [ticketsComplejos, ticketsBasicos, horasMeet, whatsappIlimitado]
      properties:
        ticketsComplejos: { type: integer, minimum: 0 }
        ticketsBasicos: { type: integer, minimum: 0 }
        horasMeet: { type: number, minimum: 0 }
        whatsappIlimitado: { type: boolean }
    ConsumoSoporte:
      type: object
      required: [servicioContratadoId, periodo, bolsa, recursos, whatsappIlimitado]
      properties:
        servicioContratadoId: { type: string, format: uuid }
        periodo: { type: string, examples: ['2026-10'] }
        bolsa: { $ref: '#/components/schemas/BolsaSoporte' }
        recursos:
          type: array
          items:
            type: object
            required: [clave, etiqueta, usado, incluido, nivel]
            properties:
              clave: { type: string, enum: [TICKETS_COMPLEJOS, TICKETS_BASICOS, HORAS_MEET] }
              etiqueta: { type: string, examples: [Tickets complejos] }
              usado: { type: number }
              incluido: { type: number }
              nivel: { type: string, enum: [OK, ALERTA, EXCEDIDO], description: 'ALERTA desde el 80 % de lo incluido' }
        whatsappIlimitado: { type: boolean }
    CausaAtraso:
      type: string
      enum: [CLIENTE, INOO, TERCERO]
    KpiProyecto:
      type: object
      description: 'KPI interno del proyecto (reunión 15 oct). El cliente no los ve.'
      required: [clave, etiqueta, valor, numero, detalle, nivel]
      properties:
        clave: { type: string, enum: [CUMPLIMIENTO_FECHAS, AVANCE_VS_PLAN, REBOTES, TIEMPO_IMPLEMENTACION, REUNIONES_VS_OPTIMAS, RONDAS_PROPUESTA] }
        etiqueta: { type: string, examples: [Cumplimiento de fechas] }
        valor: { type: string, examples: ['75 %'] }
        numero: { type: [number, 'null'] }
        detalle: { type: string, examples: [3 de 4 etapas a tiempo] }
        nivel: { type: string, enum: [OK, ALERTA, CRITICO] }
    PanelColaborador:
      type: object
      description: 'Lo de una persona del equipo (reunión 15 oct): sus tareas, sus proyectos y sus KPIs'
      required: [persona, tareas, proyectos, resumen]
      properties:
        persona: { $ref: '#/components/schemas/PersonaMini' }
        miArea:
          type: [array, 'null']
          description: 'Solo si quien mira su propio panel es lead (o ADMIN y tiene área): la carga de cada persona de su área'
          items:
            type: object
            required: [persona, tareasAbiertas, tareasVencidas, proyectos]
            properties:
              persona: { $ref: '#/components/schemas/PersonaEquipo' }
              tareasAbiertas: { type: integer }
              tareasVencidas: { type: integer }
              proyectos: { type: integer }
        tareas: { type: array, description: 'Abiertas, asignadas a la persona; vencidas primero', items: { $ref: '#/components/schemas/Tarea' } }
        tableros:
          type: array
          description: '6 nov: tableros de InooWork donde es líder o miembro (también cuentan en proyectosActivos, salvo los culminados)'
          items:
            type: object
            required: [id, nombre, cliente, columna, items]
            properties:
              id: { type: string }
              nombre: { type: string }
              cliente: { type: [string, 'null'] }
              columna: { $ref: '#/components/schemas/ColumnaProyecto' }
              items: { type: object, required: [total, completados, vencidos], properties: { total: { type: integer }, completados: { type: integer }, vencidos: { type: integer } } }
        proyectos:
          type: array
          description: 'Activos o en pausa donde es responsable'
          items:
            type: object
            required: [servicioContratadoId, titulo, clienteNombre, avance, columna, kpis]
            properties:
              servicioContratadoId: { type: string, format: uuid }
              titulo: { type: string }
              clienteNombre: { type: string }
              avance: { $ref: '#/components/schemas/AvanceProyecto' }
              columna: { $ref: '#/components/schemas/ColumnaProyecto' }
              kpis: { type: array, items: { $ref: '#/components/schemas/KpiProyecto' } }
        resumen:
          type: object
          required: [tareasAbiertas, tareasVencidas, proyectosActivos, proyectosCerrados, rebotes, conRetraso]
          properties:
            tareasAbiertas: { type: integer }
            tareasVencidas: { type: integer }
            proyectosActivos: { type: integer }
            proyectosCerrados: { type: integer, description: 'Finalizados donde fue responsable' }
            rebotes: { type: integer, description: 'Pedidos de cambio del cliente en los entregables de sus proyectos' }
            conRetraso: { type: integer, description: 'Proyectos suyos con una etapa atrasada' }
    ProyectoPipeline:
      type: object
      required: [servicioContratadoId, clienteId, clienteNombre, titulo, codigo, estado, columna, avance, tareas, requerimientosPendientes, requerimientosAtrasados]
      properties:
        servicioContratadoId: { type: string, format: uuid }
        clienteId: { type: string, format: uuid }
        clienteNombre: { type: string }
        titulo: { type: string, examples: [Diseño y desarrollo web - Casa Oliva] }
        codigo: { $ref: '#/components/schemas/CodigoServicio' }
        estado: { $ref: '#/components/schemas/EstadoServicio' }
        columna: { $ref: '#/components/schemas/ColumnaProyecto' }
        avance: { $ref: '#/components/schemas/AvanceProyecto' }
        responsable: { oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ], description: 'Responsable del proyecto (o, si no tiene, quien lleva la cuenta)' }
        tareas:
          type: object
          required: [abiertas, vencidas]
          properties:
            abiertas: { type: integer }
            vencidas: { type: integer }
        requerimientosPendientes: { type: integer }
        requerimientosAtrasados: { type: integer }
    EstadoPago:
      type: object
      required: [situacion, diasAtraso]
      properties:
        situacion: { $ref: '#/components/schemas/SituacionPago' }
        diasAtraso: { type: integer, minimum: 0, description: 'Días corridos desde atrasadoDesde; 0 si está al día' }
        atrasadoDesde: { type: [string, 'null'], format: date, description: 'Solo equipo' }
        alertaOperaciones: { type: boolean, description: 'Solo equipo. Atrasado con diasAtraso ≥ umbralDias: coordinar antes de seguir con el proyecto' }
        umbralDias: { type: integer, description: 'Solo equipo. Días desde los que se alerta (7, de relleno)' }
        nota: { type: [string, 'null'], description: 'Solo ADMIN y FINANZAS' }
        actualizadoEn: { type: [string, 'null'], format: date-time, description: 'Solo ADMIN y FINANZAS' }
        actualizadoPor: { oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ], description: 'Solo ADMIN y FINANZAS' }
    EstadoPagoEntrada:
      type: object
      required: [situacion]
      properties:
        situacion: { $ref: '#/components/schemas/SituacionPago' }
        atrasadoDesde: { type: string, format: date, description: 'Obligatoria si ATRASADO; no puede ser futura' }
        nota: { type: [string, 'null'], description: 'Interna: qué cuota o qué se conversó' }
    SolicitudResponsable:
      type: object
      required: [id, nombre, email, telefono, quitarAccesoAnterior, estado, solicitadoPor, creadoEn]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, examples: [Gabriel Villegas] }
        email: { type: string, format: email }
        telefono: { type: string }
        cargo: { type: [string, 'null'] }
        motivo: { type: [string, 'null'] }
        quitarAccesoAnterior: { type: boolean }
        estado: { type: string, enum: [PENDIENTE, APROBADA, RECHAZADA] }
        notaEquipo: { type: [string, 'null'] }
        solicitadoPor: { $ref: '#/components/schemas/PersonaMini' }
        decididoEn: { type: [string, 'null'], format: date-time }
        creadoEn: { type: string, format: date-time }
    Miembro:
      type: object
      required: [usuarioId, nombre, email, rol]
      properties:
        usuarioId: { type: string, format: uuid }
        nombre: { type: string }
        email: { type: string, format: email }
        rol: { $ref: '#/components/schemas/RolCliente' }
        invitacionPendiente: { type: boolean }

    # ---------- referencias y briefs
    ReferenciaEntrada:
      type: object
      required: [titulo]
      properties:
        tipo: { $ref: '#/components/schemas/TipoReferencia' }
        titulo: { type: string, description: '"Nombre o contexto"' }
        url: { type: string, format: uri }
        archivoId: { type: string, format: uuid }
        notas: { type: string, description: 'Qué tomar como inspiración ("Solo como inspiración. No replicar contenido.")' }
        paleta: { type: array, items: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' } }
    Referencia:
      allOf:
        - $ref: '#/components/schemas/ReferenciaEntrada'
        - type: object
          required: [id, creadoEn]
          properties:
            id: { type: string, format: uuid }
            archivo: { oneOf: [ { $ref: '#/components/schemas/ArchivoMini' }, { type: 'null' } ] }
            creadoEn: { type: string, format: date-time }
    Brief:
      type: object
      required: [periodo, estado, archivos, referencias]
      properties:
        id: { type: [string, 'null'], format: uuid, description: null si todavía no se guardó }
        periodo: { $ref: '#/components/schemas/Periodo' }
        estado: { type: string, enum: [BORRADOR, ENVIADO, CONFIRMADO] }
        objetivoComunicacion: { type: [string, 'null'] }
        consideraciones: { type: [string, 'null'], description: '"¿Qué debemos tener en cuenta?"' }
        contenidoMd: { type: [string, 'null'], description: Solo equipo }
        driveFileId: { type: [string, 'null'], description: Solo equipo }
        archivos: { type: array, description: Archivos subidos a este brief (SUBIDO o DISPONIBLE), items: { $ref: '#/components/schemas/Archivo' } }
        referencias: { type: array, description: Inspiración de este mes, items: { $ref: '#/components/schemas/Referencia' } }
        enviadoPor: { oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ] }
        enviadoEn: { type: [string, 'null'], format: date-time }
        confirmadoEn: { type: [string, 'null'], format: date-time }
        actualizadoEn: { type: [string, 'null'], format: date-time }
    CampoFormulario:
      type: object
      required: [clave, etiqueta, tipo, obligatorio]
      properties:
        clave: { type: string, examples: [objetivo] }
        etiqueta: { type: string, examples: ['¿Para qué quieres el sitio?'] }
        tipo: { $ref: '#/components/schemas/TipoCampo' }
        obligatorio: { type: boolean }
        ayuda: { type: [string, 'null'] }
        opciones: { type: array, description: Solo OPCION y OPCIONES, items: { type: string } }
        seccion: { type: string, description: 'Título de la sección que empieza en este campo' }
        mostrarSi:
          type: object
          description: 'Pregunta condicional: solo se muestra (y solo es obligatoria) si el campo `campo` está visible y su respuesta es una de `valores` (en OPCIONES, si eligió alguna)'
          required: [campo, valores]
          properties:
            campo: { type: string }
            valores: { type: array, minItems: 1, items: { type: string } }
    FormularioPublico:
      description: Lo que ve quien abre el enlace de un requerimiento (sin datos internos)
      type: object
      required: [titulo, clienteNombre, servicioTitulo, campos, respuestas, estado, fechaLimite, venceEn]
      properties:
        titulo: { type: string }
        descripcion: { type: [string, 'null'] }
        mensaje: { type: [string, 'null'] }
        clienteNombre: { type: string }
        servicioTitulo: { type: string }
        campos: { type: array, items: { $ref: '#/components/schemas/CampoFormulario' } }
        respuestas: { type: object, additionalProperties: true }
        estado: { $ref: '#/components/schemas/EstadoRequerimiento' }
        notaEquipo: { type: [string, 'null'] }
        fechaLimite: { type: string, format: date }
        venceEn: { type: string, format: date-time, description: Cuándo deja de funcionar el enlace }
    PlantillaRequerimiento:
      type: object
      required: [codigo, nombre, diasHabiles, servicios, campos]
      properties:
        codigo: { type: string, examples: [BRIEF_WEB] }
        nombre: { type: string, examples: [Brief de desarrollo web] }
        descripcion: { type: [string, 'null'] }
        servicios: { type: array, description: 'Servicios donde se suele pedir (vacío = cualquiera)', items: { $ref: '#/components/schemas/CodigoServicio' } }
        diasHabiles: { type: integer, description: Plazo por defecto }
        campos: { type: array, items: { $ref: '#/components/schemas/CampoFormulario' } }
    RequerimientoEntrada:
      type: object
      required: [plantillaCodigo, servicioContratadoId]
      properties:
        plantillaCodigo: { type: string, examples: [BRIEF_WEB] }
        servicioContratadoId: { type: string, format: uuid }
        titulo: { type: string, description: 'Por defecto, el nombre de la plantilla' }
        mensaje: { type: string, description: 'Nota para el cliente («Lo necesitamos para arrancar el diseño»)' }
        diasHabiles: { type: integer, minimum: 1, maximum: 30, description: 'Plazo; por defecto el de la plantilla' }
    Requerimiento:
      type: object
      required: [id, servicioContratadoId, servicioTitulo, titulo, estado, emitidoEn, fechaLimite, diasAtraso, diasParaVencer, campos, respuestas]
      properties:
        id: { type: string, format: uuid }
        servicioContratadoId: { type: string, format: uuid }
        servicioTitulo: { type: string, examples: [Diseño y desarrollo web - Casa Oliva] }
        plantillaCodigo: { type: [string, 'null'] }
        titulo: { type: string }
        descripcion: { type: [string, 'null'] }
        mensaje: { type: [string, 'null'] }
        estado: { $ref: '#/components/schemas/EstadoRequerimiento' }
        emitidoEn: { type: string, format: date-time }
        fechaLimite: { type: string, format: date, description: 'Vence a las 23:59 de Lima de ese día' }
        diasAtraso: { type: integer, description: 'Días hábiles de atraso (hasta hoy o hasta que se envió)' }
        diasParaVencer: { type: integer, minimum: 0, description: 'Días hábiles que quedan hasta la fecha límite (0 = vence hoy o ya venció). Con diasAtraso arma el semáforo: rojo si hay atraso, naranja si quedan 0 o 1, verde si hay más' }
        diasCorridos: { type: integer, description: 'Días hábiles que ya se corrió el cronograma por este atraso' }
        campos: { type: array, items: { $ref: '#/components/schemas/CampoFormulario' } }
        respuestas: { type: object, additionalProperties: true }
        notaEquipo: { type: [string, 'null'], description: 'Al observar: qué hay que corregir' }
        enviadoEn: { type: [string, 'null'], format: date-time }
        enviadoPor: { oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ] }
        revisadoEn: { type: [string, 'null'], format: date-time }
        creadoPor: { oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ] }
        enlace:
          description: 'Enlace para responder sin cuenta del portal (lo crea el equipo; vence o se revoca)'
          oneOf:
            - type: object
              required: [url, venceEn, vigente]
              properties:
                url: { type: string, description: 'Ruta de la página pública: /f/{token}' }
                venceEn: { type: string, format: date-time }
                vigente: { type: boolean }
            - type: 'null'
        enviadoPorEnlace: { type: [string, 'null'], description: 'Nombre de quien lo envió por el enlace, sin cuenta' }
    ServicioContratadoEntrada:
      type: object
      description: 'Crea el proyecto con las etapas de la plantilla del servicio (y variante), escaladas por el tamaño, o con etapas personalizadas. Las fechas previstas se calculan en días hábiles desde `fechaInicio`. Se le piden al cliente los requerimientos de la plantilla (reunión 15 oct: todo al inicio).'
      required: [servicioCodigo, fechaInicio]
      properties:
        servicioCodigo: { $ref: '#/components/schemas/CodigoServicio' }
        variante: { type: [string, 'null'], description: 'Obligatoria si el servicio tiene variantes (p. ej. WEB → LANDING)' }
        detalle: { $ref: '#/components/schemas/DetalleServicio' }
        marca: { type: [string, 'null'], description: 'Lo que va después del guion en el título; por defecto el nombre del cliente' }
        planId: { type: string, format: uuid }
        alcance: { type: string }
        fechaInicio: { type: string, format: date }
        fechaFin: { type: [string, 'null'], format: date }
        inooworkProyectoId: { type: string }
        responsableId: { type: [string, 'null'], format: uuid, description: 'Responsable del proyecto en Inoo (persona del equipo); por defecto el AM de la cuenta' }
        etapas:
          type: array
          description: 'Proyecto personalizado: estas etapas reemplazan las de la plantilla. El % acumulado crece y termina en 100'
          items:
            type: object
            required: [nombre, avancePct, diasHabiles]
            properties:
              nombre: { type: string, minLength: 3 }
              avancePct: { type: integer, minimum: 1, maximum: 100 }
              diasHabiles: { type: integer, minimum: 1, maximum: 120 }
              esperaCliente: { type: boolean }
              reunionClave: { type: [string, 'null'] }
        entregables:
          type: array
          items:
            type: object
            required: [tipoPieza, cantidadMensual]
            properties:
              tipoPieza: { $ref: '#/components/schemas/TipoPieza' }
              cantidadMensual: { type: integer, minimum: 1 }
    ServicioCatalogo:
      type: object
      required: [codigo, nombre, modalidad, variantes, unidad]
      properties:
        codigo: { $ref: '#/components/schemas/CodigoServicio' }
        nombre: { type: string, examples: [Brandformance] }
        descripcion: { type: [string, 'null'] }
        modalidad: { $ref: '#/components/schemas/ModalidadServicio' }
        variantes: { type: array, description: 'Vacío = el servicio no tiene variantes', items: { $ref: '#/components/schemas/VarianteServicio' } }
        unidad: { type: string, examples: [piezas, campañas, entregas] }
    VarianteServicio:
      type: object
      required: [codigo, nombre]
      properties:
        codigo: { type: string, examples: [LANDING, ECOMMERCE, FOTOGRAFIA, REBRANDING] }
        nombre: { type: string, examples: [Landing page] }
    DetalleServicio:
      type: object
      description: 'Datos propios del servicio (reunión 15 oct). Web: tamaño, páginas, productos, CMS y si incluye el panel de administración. CRM: qué CRM, licencias, usuarios, plataformas, si incluye agente de IA o WhatsApp API (ahí la IA es el producto) y el enlace a la cuenta del cliente en Cosmiq.'
      properties:
        tamano: { type: string, enum: [CHICO, MEDIANO, GRANDE], description: 'Escala los días de las etapas (factores de relleno)' }
        paginas: { type: integer, minimum: 0 }
        productos: { type: integer, minimum: 0, description: 'Productos que nos comprometimos a cargar' }
        cms: { type: string, enum: [WORDPRESS, SHOPIFY, CODIGO] }
        alcanceWeb: { type: string, enum: [SOLO_WEB, WEB_Y_CMS], description: '¿Solo el sitio, o también el panel de administración?' }
        agenteIa: { type: boolean, description: 'CRM: incluye un agente de IA' }
        whatsappApi: { type: boolean, description: 'CRM: incluye la configuración de WhatsApp API' }
        enlaceCosmiq: { type: string, format: uri, maxLength: 500, description: 'Solo proyectos de CRM (implementación, integración y soporte continuo de CRM): enlace https a la cuenta del cliente en Cosmiq, el CRM de Inoo. Lo pone el equipo y lo ve el cliente; en otro servicio, 422' }
        crm: { type: string, examples: [HubSpot] }
        tipoLicencia: { type: string, examples: [Sales Hub Professional] }
        licencias: { type: integer, minimum: 0 }
        usuarios: { type: integer, minimum: 0 }
        plataformas: { type: array, items: { type: string } }
        bolsa: { $ref: '#/components/schemas/BolsaSoporte' }
      additionalProperties: true
    EtapaPlantilla:
      type: object
      required: [orden, nombre, avancePct, diasHabiles, esperaCliente]
      properties:
        orden: { type: integer }
        nombre: { type: string, examples: [Levantamiento de información] }
        descripcion: { type: [string, 'null'] }
        avancePct: { type: integer, minimum: 1, maximum: 100, description: '% acumulado del proyecto al terminar la etapa' }
        diasHabiles: { type: integer }
        esperaCliente: { type: boolean }
        reunionClave: { type: [string, 'null'], description: 'La reunión que cierra la etapa (reunión 15 oct: cada reunión tiene un objetivo)', examples: [Aprobación del flujograma] }
    PlantillaProyecto:
      type: object
      required: [id, servicioCodigo, nombre, etapas, metricas]
      properties:
        id: { type: string, format: uuid }
        servicioCodigo: { $ref: '#/components/schemas/CodigoServicio' }
        variante: { type: [string, 'null'] }
        nombre: { type: string }
        metricas: { type: array, items: { $ref: '#/components/schemas/MetricaProyecto' } }
        etapas: { type: array, items: { $ref: '#/components/schemas/EtapaPlantilla' } }
        requerimientos: { type: array, description: 'Plantillas de requerimiento que se le piden al cliente al crear el proyecto', items: { type: string }, examples: [[BRIEF_WEB, ACCESOS_WEB, MANUAL_MARCA]] }
        reunionesOptimas: { type: integer, description: 'Etapas con reunión clave: la cantidad de reuniones que debería tener el proyecto' }
    EtapaProyecto:
      type: object
      required: [id, orden, nombre, avancePct, estado, esperaCliente, atrasada]
      properties:
        id: { type: string, format: uuid }
        orden: { type: integer }
        nombre: { type: string }
        descripcion: { type: [string, 'null'] }
        periodo: { oneOf: [ { $ref: '#/components/schemas/Periodo' }, { type: 'null' } ] }
        avancePct: { type: integer }
        estado: { $ref: '#/components/schemas/EstadoHito' }
        esperaCliente: { type: boolean }
        reunionClave: { type: [string, 'null'], description: 'La reunión que cierra la etapa' }
        causaAtraso: { oneOf: [ { $ref: '#/components/schemas/CausaAtraso' }, { type: 'null' } ], description: 'Solo equipo. CLIENTE se pone solo cuando un requerimiento atrasado corre el cronograma' }
        justificacionAtraso: { type: [string, 'null'], description: 'Solo equipo' }
        diasCorridosCliente: { type: integer, description: 'Solo equipo. Días hábiles que la etapa se corrió por atrasos del cliente' }
        fechaInicio: { type: [string, 'null'], format: date }
        fechaEstimada: { type: [string, 'null'], format: date }
        fechaFin: { type: [string, 'null'], format: date }
        atrasada: { type: boolean, description: 'Sin completar y con fechaEstimada anterior a hoy' }
    AvanceProyecto:
      type: object
      description: '% = avancePct de la última etapa completada en orden. En servicios mensuales, el del mes en curso.'
      required: [porcentaje, totalEtapas, etapasCompletadas]
      properties:
        porcentaje: { type: integer, minimum: 0, maximum: 100 }
        etapaActual:
          type: [object, 'null']
          description: La primera etapa sin completar (null si todas están completas)
          required: [orden, nombre, estado, atrasada]
          properties:
            orden: { type: integer }
            nombre: { type: string }
            estado: { $ref: '#/components/schemas/EstadoHito' }
            fechaEstimada: { type: [string, 'null'], format: date }
            atrasada: { type: boolean }
        totalEtapas: { type: integer }
        etapasCompletadas: { type: integer }
        periodo: { oneOf: [ { $ref: '#/components/schemas/Periodo' }, { type: 'null' } ] }
    PlanCliente:
      type: object
      required: [nombre]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, examples: [Plan Crecimiento] }
        fechaInicio: { type: string, format: date }
        fechaFin: { type: [string, 'null'], format: date }
        tieneContrato: { type: boolean, description: Si hay PDF para "Ver contrato" }
    ProgresoPiezas:
      type: object
      description: 'Entregada = disponible para revisión o aprobada. porcentaje = aprobadas / totales (las aprobadas incluyen las publicadas).'
      required: [totales, aprobadas, porRevisar, enProduccion, porcentaje]
      properties:
        totales: { type: integer, description: Cuota contratada del mes }
        entregadas: { type: integer }
        aprobadas: { type: integer }
        publicadas: { type: integer }
        porRevisar: { type: integer }
        enProduccion: { type: integer }
        porcentaje: { type: integer, minimum: 0, maximum: 100 }
    ServicioCliente:
      type: object
      description: Un servicio contratado visto desde el cliente.
      required: [codigo, nombre, titulo, modalidad, servicioContratadoId, estado, cantidadMensual, unidad, detalle, avance]
      properties:
        codigo: { $ref: '#/components/schemas/CodigoServicio' }
        nombre: { type: string }
        titulo: { type: string, description: '«Servicio - Marca»', examples: [Implementación de CRM - Casa Oliva] }
        descripcion: { type: [string, 'null'] }
        modalidad: { $ref: '#/components/schemas/ModalidadServicio' }
        variante: { oneOf: [ { $ref: '#/components/schemas/VarianteServicio' }, { type: 'null' } ] }
        detalle: { $ref: '#/components/schemas/DetalleServicio' }
        servicioContratadoId: { type: string, format: uuid }
        estado: { $ref: '#/components/schemas/EstadoServicio' }
        alcance: { type: [string, 'null'] }
        fechaInicio: { type: [string, 'null'], format: date }
        fechaFin: { type: [string, 'null'], format: date }
        unidad: { type: string }
        cantidadMensual: { type: integer, description: 'Suma de los entregables incluidos (0 si el servicio no entrega piezas mensuales)' }
        progreso: { oneOf: [ { $ref: '#/components/schemas/ProgresoPiezas' }, { type: 'null' } ], description: 'Piezas del mes; null si no entrega piezas' }
        avance: { $ref: '#/components/schemas/AvanceProyecto' }
        consumo: { $ref: '#/components/schemas/ConsumoSoporte', description: 'Solo el soporte continuo: no tiene etapas, se mide por consumo de su bolsa (fase 15)' }
        responsable: { oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ], description: 'Responsable del servicio en Inoo: cada servicio puede ser de un área distinta' }
        entregables:
          type: array
          description: Detalle por tipo de pieza
          items:
            type: object
            required: [tipoPieza, cantidadMensual]
            properties:
              tipoPieza: { $ref: '#/components/schemas/TipoPieza' }
              cantidadMensual: { type: integer }
    ServiciosCliente:
      type: object
      required: [periodo, servicios, resumenMes]
      properties:
        periodo: { $ref: '#/components/schemas/Periodo' }
        plan: { oneOf: [ { $ref: '#/components/schemas/PlanCliente' }, { type: 'null' } ] }
        resumenMes: { $ref: '#/components/schemas/ProgresoPiezas' }
        servicios: { type: array, description: 'Solo los contratados, en el orden del catálogo', items: { $ref: '#/components/schemas/ServicioCliente' } }
    Hito:
      type: object
      required: [id, titulo, estado]
      properties:
        id: { type: string, format: uuid }
        grupo: { type: [string, 'null'] }
        titulo: { type: string, examples: [Planificación, Producción, Revisión, Publicación] }
        estado: { $ref: '#/components/schemas/EstadoHito' }
        fechaInicio: { type: [string, 'null'], format: date }
        fechaFin: { type: [string, 'null'], format: date }
        esperaCliente: { type: boolean, description: 'true → "Tu siguiente paso"' }
        nota: { type: [string, 'null'], examples: [Por pieza aprobada] }
        responsableNombre: { type: [string, 'null'] }
    AvanceServicio:
      type: object
      required: [servicioContratadoId, codigo, nombre, titulo, avance, etapas, hitos, sincronizadoEn]
      properties:
        servicioContratadoId: { type: string, format: uuid }
        codigo: { $ref: '#/components/schemas/CodigoServicio' }
        nombre: { type: string }
        titulo: { type: string }
        variante: { oneOf: [ { $ref: '#/components/schemas/VarianteServicio' }, { type: 'null' } ] }
        detalle: { $ref: '#/components/schemas/DetalleServicio' }
        estado: { type: string, enum: [SIN_INICIAR, EN_CURSO, COMPLETADO, PAUSADO, STANDBY] }
        responsable: { oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ], description: Responsable del servicio en Inoo }
        progreso: { oneOf: [ { $ref: '#/components/schemas/ProgresoPiezas' }, { type: 'null' } ] }
        avance: { $ref: '#/components/schemas/AvanceProyecto' }
        etapas: { type: array, description: 'Etapas del proyecto, o del mes en curso en servicios mensuales', items: { $ref: '#/components/schemas/EtapaProyecto' } }
        hitos: { type: array, description: 'Ítems sincronizados de InooWork (opcional)', items: { $ref: '#/components/schemas/Hito' } }
        siguientePaso:
          type: [object, 'null']
          properties:
            texto: { type: string, examples: ['Revisar «5 hábitos para una piel saludable» y confirmar la idea pendiente.'] }
            responsable: { $ref: '#/components/schemas/PersonaMini' }
        sincronizadoEn: { type: string, format: date-time }
    MetricaValor:
      type: object
      required: [clave, etiqueta, valor]
      properties:
        clave: { $ref: '#/components/schemas/MetricaProyecto' }
        etiqueta: { type: string, examples: [Reuniones con acuerdos] }
        valor: { type: string, description: 'Ya formateado para mostrar', examples: ['2 de 3'] }
        detalle: { type: [string, 'null'], examples: ['1 programada'] }
        alerta: { type: boolean, description: 'true si el valor indica un problema (p. ej. entregas con retraso)' }
    Reunion:
      type: object
      required: [id, titulo, fecha, estado]
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string, examples: [Kickoff de implementación] }
        fecha: { type: string, format: date-time }
        estado: { type: string, enum: [PROGRAMADA, REALIZADA, CANCELADA] }
        conAcuerdos: { type: [boolean, 'null'], description: 'REALIZADA: si terminó con acuerdos (cuenta como exitosa)' }
        resumen: { type: [string, 'null'], description: 'Lo que se acordó; lo ve el cliente' }
        duracionMin: { type: integer, description: 'Duración en minutos (las realizadas suman horas de Meet en la bolsa del soporte)' }
        pendientesCreados:
          type: object
          description: 'Solo en la respuesta al marcarla REALIZADA con pendientes'
          properties:
            requerimientos: { type: integer }
            tareas: { type: integer }
    ReunionEntrada:
      type: object
      description: 'Al crear: titulo y fecha obligatorios. conAcuerdos solo con estado REALIZADA. Al marcarla REALIZADA el resumen es obligatorio (reunión 15 oct) y los pendientes se convierten en requerimientos (del cliente) o tareas (de Inoo).'
      properties:
        titulo: { type: string, minLength: 3 }
        fecha: { type: string, format: date-time }
        duracionMin: { type: integer, minimum: 15, maximum: 480, description: 'Por defecto 60' }
        estado: { type: string, enum: [PROGRAMADA, REALIZADA, CANCELADA] }
        conAcuerdos: { type: [boolean, 'null'] }
        resumen: { type: [string, 'null'], description: 'Obligatorio al marcarla REALIZADA (al menos 10 caracteres)' }
        pendientes:
          type: array
          description: 'Solo al marcarla REALIZADA'
          items:
            type: object
            required: [texto, de]
            properties:
              texto: { type: string, minLength: 3 }
              de: { type: string, enum: [CLIENTE, INOO], description: 'CLIENTE crea un requerimiento «Pendiente de la reunión»; INOO crea una tarea' }
              responsableId: { type: [string, 'null'], format: uuid, description: 'Solo INOO: a quién se le asigna la tarea' }
              diasHabiles: { type: integer, minimum: 1, maximum: 30, description: 'Plazo del pendiente (por defecto 2 días hábiles)' }
    CierreProyecto:
      type: object
      required: [cerrado, listo, pendientes]
      properties:
        cerrado: { type: boolean }
        listo: { type: boolean, description: 'No queda nada abierto' }
        pendientes:
          type: object
          required: [etapas, tareas, entregables, requerimientos]
          properties:
            etapas: { type: integer, description: 'Etapas sin completar (proyectos de una vez)' }
            tareas: { type: integer }
            entregables: { type: integer, description: 'Sin aprobar' }
            requerimientos: { type: integer, description: 'Lo que el cliente todavía no entrega' }
    TranscripcionEntrada:
      type: object
      required: [transcripcion]
      properties:
        transcripcion: { type: string, minLength: 120, maxLength: 60000, description: 'Lo que se dijo en la reunión (Meet, Zoom, Fireflies…), tal cual' }
    PropuestaAltaCliente:
      type: object
      required: [nombre, contacto, ingreso, alcance]
      properties:
        nombre: { type: [string, 'null'] }
        contacto:
          type: object
          required: [nombre, email, cargo]
          properties:
            nombre: { type: [string, 'null'] }
            email: { type: [string, 'null'] }
            cargo: { type: [string, 'null'] }
        ingreso:
          type: object
          required: [rubro, servicios, objetivos, resumen, tipoWeb, cantidadProductos]
          description: 'Campos del formulario de ingreso del cliente'
          properties:
            rubro: { type: [string, 'null'] }
            servicios: { type: array, items: { type: string, enum: [Branding, Social Media, Desarrollo web, SEO, CRM] } }
            objetivos: { type: [string, 'null'] }
            resumen: { type: [string, 'null'] }
            tipoWeb: { type: [string, 'null'], description: 'Una de las opciones de «Tipo de proyecto (Desarrollo web)»' }
            cantidadProductos: { type: [integer, 'null'] }
        alcance: { type: [string, 'null'], description: 'Lo que Inoo prometió; va al alcance del proyecto al contratarlo' }
    PropuestaResumenReunion:
      type: object
      required: [resumen, conAcuerdos, pendientes]
      properties:
        resumen: { type: string }
        conAcuerdos: { type: boolean }
        pendientes:
          type: array
          items:
            type: object
            required: [texto, de]
            properties:
              texto: { type: string }
              de: { type: string, enum: [CLIENTE, INOO] }
    PerfilProyecto:
      description: 'Perfil del proyecto (un servicio contratado): todo lo de AvanceServicio más métricas, reuniones y lo que espera revisión'
      allOf:
        - $ref: '#/components/schemas/AvanceServicio'
        - type: object
          required: [clienteId, modalidad, metricas, reuniones, porRevisar]
          properties:
            clienteId: { type: string, format: uuid }
            descripcion: { type: [string, 'null'] }
            modalidad: { $ref: '#/components/schemas/ModalidadServicio' }
            fechaInicio: { type: [string, 'null'], format: date }
            fechaFin: { type: [string, 'null'], format: date }
            responsable: { oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ], description: 'Responsable del proyecto en Inoo' }
            alcance: { type: [string, 'null'], description: 'Alcance prometido' }
            metricas: { type: array, description: 'Las de la plantilla del servicio, en su orden', items: { $ref: '#/components/schemas/MetricaValor' } }
            reuniones: { type: array, description: 'Próximas primero, luego las realizadas más recientes (máximo 6)', items: { $ref: '#/components/schemas/Reunion' } }
            porRevisar: { type: array, description: 'Piezas de contenido de este servicio en LISTO_REVISION', items: { $ref: '#/components/schemas/PiezaResumen' } }
            entregables: { type: array, description: 'Entregables del proyecto (flujograma, prototipo, manual…); el cliente ve solo los enviados', items: { $ref: '#/components/schemas/Entregable' } }
    ComentarioProyecto:
      type: object
      required: [id, texto, autor, deEquipo, creadoEn]
      properties:
        id: { type: string, format: uuid }
        texto: { type: string }
        autor: { $ref: '#/components/schemas/PersonaMini' }
        deEquipo: { type: boolean }
        interno: { type: boolean, description: Solo equipo }
        creadoEn: { type: string, format: date-time }
    AvanceCliente:
      type: object
      required: [periodo, resumenMes, servicios]
      properties:
        periodo: { $ref: '#/components/schemas/Periodo' }
        resumenMes: { $ref: '#/components/schemas/ProgresoPiezas' }
        piezasPorRevisar:
          type: array
          description: '"Tu revisión mantiene el ritmo"'
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              titulo: { type: string }
              fechaProgramada: { type: string, format: date-time }
        servicios: { type: array, items: { $ref: '#/components/schemas/AvanceServicio' } }
    PiezaResumen:
      type: object
      required: [id, tipo, titulo, periodo, estado]
      properties:
        id: { type: string, format: uuid }
        clienteId: { type: string, format: uuid }
        clienteNombre: { type: string, description: Solo en listados de varios clientes (bandeja) }
        tipo: { $ref: '#/components/schemas/TipoPieza' }
        titulo: { type: string }
        resumen: { type: [string, 'null'] }
        canal: { type: [string, 'null'] }
        periodo: { $ref: '#/components/schemas/Periodo' }
        fechaProgramada: { type: [string, 'null'], format: date-time }
        estado: { $ref: '#/components/schemas/EstadoPieza' }
        numeroVersion: { type: [integer, 'null'], description: 'Versión vigente; para el cliente, la enviada a revisión' }
        miniaturaUrl: { type: [string, 'null'], format: uri, description: URL firmada corta (15 min) }
        servicioContratadoId: { type: [string, 'null'], format: uuid }
        ideaSeleccionada: { type: boolean, description: La pieza nació de una idea elegida por el cliente }
        origen:
          type: object
          description: 'Solo equipo. "Hecha por agente de IA · Agente Editorial" o "Hecha por una persona · Diego Castro"'
          properties:
            tipo: { type: string, enum: [AGENTE, PERSONA] }
            nombre: { type: string }
        notaEstado: { type: [string, 'null'], description: 'Solo equipo. "Lista para programar", "Esperando al cliente"' }
        atrasada: { type: boolean, description: 'LISTO_REVISION y el cliente no la revisó en su plazo (3 días hábiles desde que se le envió). El cliente ve «Atrasado»' }
        diasAtrasoRevision: { type: integer, minimum: 0, description: 'Días hábiles de atraso en la revisión del cliente; 0 si está a tiempo o no espera revisión' }
        actualizadoEn: { type: string, format: date-time }
    PiezaEntrada:
      type: object
      required: [tipo, titulo, periodo]
      properties:
        tipo: { $ref: '#/components/schemas/TipoPieza' }
        titulo: { type: string }
        resumen: { type: string }
        canal: { type: string }
        periodo: { $ref: '#/components/schemas/Periodo' }
        fechaProgramada: { type: string, format: date-time }
        servicioContratadoId: { type: string, format: uuid }
        responsableId: { type: string, format: uuid }
        version: { $ref: '#/components/schemas/VersionEntrada' }
    Pieza:
      allOf:
        - $ref: '#/components/schemas/PiezaResumen'
        - type: object
          required: [clienteId, acciones]
          properties:
            clienteId: { type: string, format: uuid }
            calendarioId: { type: [string, 'null'], format: uuid }
            versionActual: { type: integer, description: Solo equipo }
            versionCliente: { type: [integer, 'null'], description: Versión enviada a revisión del cliente }
            version: { $ref: '#/components/schemas/VersionPieza' }
            etiquetas: { type: array, items: { type: string } }
            aptaPaidMedia: { type: boolean }
            responsable: { type: [object, 'null'], description: Solo equipo, properties: { id: { type: string }, nombre: { type: string } } }
            publicadoUrl: { type: [string, 'null'], format: uri }
            publicadoEn: { type: [string, 'null'], format: date-time }
            servicioCodigo: { type: [string, 'null'], description: 'Código del servicio del proyecto (p. ej. SOCIAL_MEDIA_PRO, PAID_MEDIA). El historial de la pieza se muestra solo en Paid Media y Social Media Pro.' }
            acciones:
              type: array
              description: Lo que ESTE usuario puede hacer ahora. El frontend pinta botones según esta lista, no según el estado.
              items: { $ref: '#/components/schemas/AccionPieza' }
    Decision:
      type: object
      required: [version]
      properties:
        version: { type: integer, description: '`versionCliente` que el usuario vio; si cambió → 409 VERSION_DESACTUALIZADA' }
        comentario: { type: string, maxLength: 5000 }
    ArchivoMini:
      type: object
      required: [id, nombre, mime]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        mime: { type: string }
        bytes: { type: [integer, 'null'] }
        miniaturaUrl: { type: [string, 'null'], format: uri }
    Fuente:
      type: object
      required: [url]
      properties:
        titulo: { type: string }
        url: { type: string, format: uri }
    VersionPieza:
      type: object
      required: [numero, contenido, creadoEn]
      properties:
        numero: { type: integer }
        actual: { type: boolean }
        autorTipo: { type: string, enum: [AGENTE, PERSONA], description: 'Solo equipo: el cliente no debe notar la IA (reunión 15 oct)' }
        agente: { type: [string, 'null'], description: Solo equipo }
        autor: { oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ], description: Solo equipo }
        contenido: { $ref: '#/components/schemas/ContenidoPieza' }
        fuentes: { type: array, items: { $ref: '#/components/schemas/Fuente' } }
        archivo: { oneOf: [ { $ref: '#/components/schemas/ArchivoMini' }, { type: 'null' } ] }
        portada: { oneOf: [ { $ref: '#/components/schemas/ArchivoMini' }, { type: 'null' } ] }
        vistaPreviaUrl: { type: [string, 'null'], format: uri }
        notaCambios: { type: [string, 'null'] }
        enviadaEn: { type: [string, 'null'], format: date-time, description: Cuándo se envió al cliente }
        enviadaPor: { oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ], description: 'Persona del equipo que la envió ("Diego Castro, Inoo")' }
        decision:
          description: 'Decisión del cliente sobre ESTA versión; una aprobación no se hereda a la siguiente'
          type: [object, 'null']
          properties:
            estado: { type: string, enum: [APROBADO_CLIENTE, CAMBIOS_SOLICITADOS] }
            usuarioNombre: { type: string }
            fecha: { type: string, format: date-time }
            comentario: { type: [string, 'null'] }
        creadoEn: { type: string, format: date-time }
    VersionEntrada:
      type: object
      required: [contenido]
      properties:
        contenido: { $ref: '#/components/schemas/ContenidoPieza' }
        fuentes: { type: array, items: { $ref: '#/components/schemas/Fuente' } }
        archivoId: { type: string, format: uuid }
        portadaArchivoId: { type: string, format: uuid }
        vistaPreviaUrl: { type: string, format: uri }
        notaCambios: { type: string }
        agente: { type: string, description: Obligatorio vía API key }
        ejecucionId: { type: string, format: uuid }
        enviarARevisionInterna: { type: boolean, default: true }
    ContenidoPieza:
      description: Estructura según el tipo de pieza (discriminador `tipo`).
      oneOf:
        - $ref: '#/components/schemas/ContenidoBlog'
        - $ref: '#/components/schemas/ContenidoCopy'
        - $ref: '#/components/schemas/ContenidoVisual'
        - $ref: '#/components/schemas/ContenidoGuion'
        - $ref: '#/components/schemas/ContenidoPrototipo'
        - $ref: '#/components/schemas/ContenidoGenerico'
      discriminator:
        propertyName: tipo
        mapping:
          BLOG: '#/components/schemas/ContenidoBlog'
          COPY: '#/components/schemas/ContenidoCopy'
          ANUNCIO: '#/components/schemas/ContenidoCopy'
          ESTATICO: '#/components/schemas/ContenidoVisual'
          CARRUSEL: '#/components/schemas/ContenidoVisual'
          PORTADA: '#/components/schemas/ContenidoVisual'
          GUION: '#/components/schemas/ContenidoGuion'
          SHOTLIST: '#/components/schemas/ContenidoGuion'
          STORYBOARD: '#/components/schemas/ContenidoGuion'
          PROTOTIPO_WEB: '#/components/schemas/ContenidoPrototipo'
          REPORTE: '#/components/schemas/ContenidoGenerico'
    ContenidoBlog:
      type: object
      required: [tipo, tituloSeo, cuerpoMd]
      properties:
        tipo: { type: string, enum: [BLOG] }
        tituloSeo: { type: string }
        metaDescripcion: { type: string, maxLength: 160 }
        slug: { type: string }
        cuerpoMd: { type: string, description: 'Markdown con H1/H2 (1200–1800 palabras, US-05)' }
        palabras: { type: integer }
    ContenidoCopy:
      type: object
      required: [tipo, red, copy]
      description: Salida JSON del subagente de copies (US-06)
      properties:
        tipo: { type: string, enum: [COPY, ANUNCIO] }
        red: { type: string, enum: [INSTAGRAM, FACEBOOK, LINKEDIN, TIKTOK] }
        copy: { type: string }
        hashtags: { type: array, items: { type: string } }
        cta: { type: string }
        sugerenciaVisual: { type: string }
        enfoque: { type: string, description: 'Solo variantes de anuncio: URGENCIA, BENEFICIO, PRUEBA_SOCIAL...' }
    ContenidoVisual:
      type: object
      required: [tipo, imagenes]
      properties:
        tipo: { type: string, enum: [ESTATICO, CARRUSEL, PORTADA] }
        formato: { type: string, examples: ['1080x1350', '1920x1080'] }
        imagenes:
          type: array
          items:
            type: object
            required: [archivoId, orden]
            properties:
              archivoId: { type: string, format: uuid }
              orden: { type: integer }
              etiqueta: { type: string, examples: [Portada], description: 'Se muestra como "Portada · 1 de 3"' }
              textoEnImagen: { type: string }
              url: { type: string, format: uri, description: 'Firmada; solo en respuestas' }
        copyAsociado: { type: string }
    ContenidoGuion:
      type: object
      required: [tipo, escenas]
      description: Paquete audiovisual (US-08), sin generación de video
      properties:
        tipo: { type: string, enum: [GUION, SHOTLIST, STORYBOARD] }
        objetivo: { type: string }
        gancho: { type: string, description: Primeros 3 segundos }
        cta: { type: string }
        duracionSeg: { type: integer }
        escenas:
          type: array
          items:
            type: object
            required: [orden]
            properties:
              orden: { type: integer }
              tiempo: { type: string, examples: ['00:00-00:03'] }
              tipoPlano: { type: string }
              angulo: { type: string }
              audio: { type: string, description: Audio / voz en off }
              indicacionVisual: { type: string }
              locacion: { type: string }
              duracionSeg: { type: integer }
    ContenidoPrototipo:
      type: object
      required: [tipo, vistaPreviaUrl]
      properties:
        tipo: { type: string, enum: [PROTOTIPO_WEB] }
        vistaPreviaUrl: { type: string, format: uri }
        repositorio: { type: string, description: Solo equipo }
        pullRequestUrl: { type: string, format: uri, description: Solo equipo }
        secciones: { type: array, items: { type: string } }
    ContenidoGenerico:
      type: object
      required: [tipo]
      properties:
        tipo: { type: string, enum: [REPORTE] }
        resumenMd: { type: string }
    EventoPieza:
      type: object
      required: [deEstado, aEstado, canal, creadoEn]
      properties:
        deEstado: { oneOf: [ { $ref: '#/components/schemas/EstadoPieza' }, { type: 'null' } ] }
        aEstado: { $ref: '#/components/schemas/EstadoPieza' }
        version: { type: [integer, 'null'] }
        usuario: { type: [object, 'null'], properties: { id: { type: string }, nombre: { type: string } } }
        canal: { $ref: '#/components/schemas/CanalDecision' }
        comentario: { type: [string, 'null'] }
        creadoEn: { type: string, format: date-time }
    AnclaComentario:
      type: [object, 'null']
      description: Para comentar un párrafo o un punto de una imagen
      properties:
        parrafo: { type: integer }
        imagenOrden: { type: integer }
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
    Comentario:
      type: object
      required: [id, autor, texto, interno, creadoEn]
      properties:
        id: { type: string, format: uuid }
        version: { type: [integer, 'null'] }
        autor:
          type: object
          required: [id, nombre, tipo]
          properties:
            id: { type: string }
            nombre: { type: string }
            tipo: { $ref: '#/components/schemas/TipoUsuario' }
        texto: { type: string }
        interno: { type: boolean }
        ancla: { $ref: '#/components/schemas/AnclaComentario' }
        creadoEn: { type: string, format: date-time }

    # ---------- planificación
    Calendario:
      type: object
      required: [id, periodo, estado, version, entradas]
      properties:
        id: { type: string, format: uuid }
        periodo: { $ref: '#/components/schemas/Periodo' }
        estado: { $ref: '#/components/schemas/EstadoCalendario' }
        version: { type: integer }
        resumen: { type: [string, 'null'] }
        aprobadoPor: { type: [object, 'null'], properties: { id: { type: string }, nombre: { type: string } } }
        aprobadoEn: { type: [string, 'null'], format: date-time }
        entradas: { type: array, items: { $ref: '#/components/schemas/PiezaResumen' } }
    Tablero:
      type: object
      required: [periodo, planAprobado, porRevisar, columnas]
      properties:
        periodo: { $ref: '#/components/schemas/Periodo' }
        planAprobado: { type: boolean, description: 'Si es false, el cliente recibe las columnas vacías' }
        porRevisar: { type: integer, description: Contador de la columna que pide acción al cliente }
        columnas:
          type: array
          items:
            type: object
            required: [clave, titulo, piezas]
            properties:
              clave: { type: string, enum: [PLANIFICADO, EN_PRODUCCION, POR_REVISAR, APROBADO, PUBLICADO] }
              titulo: { type: string }
              piezas:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/PiezaResumen'
                    - type: object
                      required: [ajustando]
                      properties:
                        ajustando: { type: boolean, description: 'En producción por un pedido de cambios ("Ajustando tus comentarios")' }
    CupoIdeas:
      type: object
      required: [total, elegidas]
      properties:
        total: { type: integer, description: Ideas que el cliente puede elegir este mes }
        elegidas: { type: integer }
        confirmada: { type: boolean }
    PropuestaCalendario:
      type: object
      required: [clienteId, periodo, entradas]
      properties:
        clienteId: { type: string, format: uuid }
        periodo: { $ref: '#/components/schemas/Periodo' }
        briefId: { type: string, format: uuid }
        resumen: { type: string }
        ejecucionId: { type: string, format: uuid }
        entradas:
          type: array
          minItems: 1
          items:
            type: object
            required: [tipo, titulo, fechaProgramada]
            properties:
              tipo: { $ref: '#/components/schemas/TipoPieza' }
              titulo: { type: string }
              canal: { type: string }
              fechaProgramada: { type: string, format: date-time }
              objetivo: { type: string }
              pilar: { type: string }
              servicioContratadoId: { type: string, format: uuid }
    IdeaBlog:
      type: object
      required: [id, periodo, titulo, estado]
      properties:
        id: { type: string, format: uuid }
        periodo: { $ref: '#/components/schemas/Periodo' }
        titulo: { type: string }
        palabraClave: { type: [string, 'null'] }
        angulo: { type: [string, 'null'] }
        resumen: { type: [string, 'null'] }
        fuentes: { type: array, items: { $ref: '#/components/schemas/Fuente' } }
        estado: { $ref: '#/components/schemas/EstadoIdea' }
        piezaId: { type: [string, 'null'], format: uuid }
        decididoEn: { type: [string, 'null'], format: date-time }

    # ---------- archivos
    SubidaEntrada:
      type: object
      required: [nombre, mime, bytes, uso]
      properties:
        nombre: { type: string, maxLength: 255 }
        mime: { type: string, enum: [image/jpeg, image/png, video/mp4, application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet] }
        bytes: { type: integer, minimum: 1, maximum: 104857600, description: 'Máximo 10 MB para ADJUNTO_TICKET (413 ARCHIVO_DEMASIADO_GRANDE)' }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        uso: { type: string, enum: [BRIEF, ADJUNTO_TICKET, BIBLIOTECA, REQUERIMIENTO] }
        briefPeriodo: { $ref: '#/components/schemas/Periodo' }
        categoria: { type: string, enum: [FOTO, VIDEO, DOCUMENTO, LOGO, OTRO] }
        etiquetas: { type: array, items: { type: string } }
        declaraDerechos: { type: boolean, description: 'Obligatorio en true para BIBLIOTECA (422 DERECHOS_REQUERIDOS)' }
    SubidaIniciada:
      type: object
      required: [archivo, subida]
      properties:
        archivo: { $ref: '#/components/schemas/Archivo' }
        subida:
          type: object
          required: [metodo, url, headers, expiraEn]
          properties:
            metodo: { type: string, enum: [PUT] }
            url: { type: string, format: uri }
            headers: { type: object, additionalProperties: { type: string }, examples: [ { Content-Type: image/jpeg } ] }
            expiraEn: { type: string, format: date-time }
    Archivo:
      allOf:
        - $ref: '#/components/schemas/ArchivoMini'
        - type: object
          required: [estado, origen, creadoEn]
          properties:
            origen: { type: string, enum: [CLIENTE, EQUIPO, AGENTE], description: 'El cliente nunca recibe AGENTE: le llega como EQUIPO' }
            categoria: { type: [string, 'null'] }
            etiquetas: { type: array, items: { type: string } }
            uso: { type: string, enum: [BRIEF, ADJUNTO_TICKET, BIBLIOTECA, ENTREGABLE, CONTRATO, INFORME, REQUERIMIENTO] }
            estado: { type: string, enum: [PENDIENTE_SUBIDA, SUBIDO, DISPONIBLE, ELIMINADO], description: SUBIDO = en S3 pero el brief aún no se envió }
            declaraDerechos: { type: boolean }
            subidoPor: { type: [object, 'null'], properties: { id: { type: string }, nombre: { type: string } } }
            creadoEn: { type: string, format: date-time }

    # ---------- paid media
    ItemBiblioteca:
      type: object
      required: [origen, id, titulo]
      properties:
        origen: { type: string, enum: [PIEZA, ARCHIVO_CLIENTE] }
        id: { type: string, format: uuid }
        titulo: { type: string }
        tipo: { oneOf: [ { $ref: '#/components/schemas/TipoPieza' }, { type: 'null' } ] }
        etiquetas: { type: array, items: { type: string } }
        miniaturaUrl: { type: [string, 'null'], format: uri }
        aprobadoEn: { type: [string, 'null'], format: date-time }

    # ---------- reportes
    PuntoMetrica:
      type: object
      required: [fecha, valor]
      properties:
        fecha: { type: string, format: date }
        valor: { type: number }
    RangoFechas:
      type: object
      required: [desde, hasta]
      properties:
        desde: { type: string, format: date }
        hasta: { type: string, format: date }
    ReporteResultados:
      type: object
      required: [periodo, indicadores, canales, recorrido, esMuestra]
      properties:
        periodo: { $ref: '#/components/schemas/RangoFechas' }
        comparativa: { oneOf: [ { $ref: '#/components/schemas/RangoFechas' }, { type: 'null' } ] }
        esMuestra: { type: boolean }
        notas: { type: array, items: { type: string } }
        indicadores:
          type: array
          items:
            type: object
            required: [clave, etiqueta, valor]
            properties:
              clave: { type: string, enum: [ALCANCE, VISITAS_SITIO, CONTACTOS, CONVERSION, COMPRAS] }
              etiqueta: { type: string }
              valor: { type: number }
              unidad: { type: [string, 'null'] }
              detalle: { type: [string, 'null'] }
              variacionPct: { type: [number, 'null'] }
        canales:
          type: array
          description: Rendimiento por canal. Todas las series comparten escala en la UI.
          items:
            type: object
            required: [canal, metrica, total, puntos]
            properties:
              canal: { type: string, examples: [INSTAGRAM, FACEBOOK, BLOG] }
              metrica: { type: string, enum: [VISITAS_SITIO, ALCANCE, INTERACCIONES] }
              total: { type: number }
              variacionPct: { type: [number, 'null'], description: Frente al periodo de comparativa }
              puntos: { type: array, items: { $ref: '#/components/schemas/PuntoMetrica' } }
        recorrido:
          type: array
          description: Embudo del customer journey para el mismo periodo
          items:
            type: object
            required: [orden, nombre, valor]
            properties:
              orden: { type: integer }
              nombre: { type: string }
              descripcion: { type: [string, 'null'] }
              valor: { type: [number, 'null'] }
              pctEtapaAnterior: { type: [number, 'null'] }
              fuente: { type: string, enum: [MANUAL, META, GA4, CRM] }
        lectura: { type: [string, 'null'], description: '"Lo que nos dicen los datos"; solo si el equipo la publicó' }
        informeDisponible: { type: boolean }

    TicketEntrada:
      type: object
      required: [asunto, categoria, descripcion]
      properties:
        asunto: { type: string, minLength: 3, maxLength: 200 }
        categoria: { $ref: '#/components/schemas/CategoriaTicket', description: 'Con servicioContratadoId se toma de la variante del soporte (CRM o WEB)' }
        descripcion: { type: string, minLength: 1, maxLength: 10000 }
        servicioContratadoId: { type: string, format: uuid, description: 'Solo servicios de Soporte continuo (si no, 422 SERVICIO_SIN_SOPORTE)' }
        piezaId: { type: string, format: uuid }
        archivoIds: { type: array, items: { type: string, format: uuid } }
    Ticket:
      type: object
      required: [id, numero, codigo, asunto, categoria, estado, slaPrimeraRespuestaEn, creadoEn]
      properties:
        id: { type: string, format: uuid }
        numero: { type: integer }
        codigo: { type: string, examples: ['#1042'] }
        asunto: { type: string }
        categoria: { $ref: '#/components/schemas/CategoriaTicket' }
        estado: { $ref: '#/components/schemas/EstadoTicket' }
        resumenEstado: { type: [string, 'null'], examples: [Diego Castro está revisando tu solicitud.] }
        urgencia: { oneOf: [ { $ref: '#/components/schemas/UrgenciaTicket' }, { type: 'null' } ] }
        areaAsignada: { type: [string, 'null'] }
        asignadoNombre: { type: [string, 'null'] }
        piezaId: { type: [string, 'null'], format: uuid }
        servicioContratadoId: { type: [string, 'null'], format: uuid }
        servicioTitulo: { type: [string, 'null'], examples: [Soporte continuo - Casa Oliva] }
        complejidad: { $ref: '#/components/schemas/ComplejidadTicket' }
        slaPrimeraRespuestaEn: { type: string, format: date-time }
        primeraRespuestaEn: { type: [string, 'null'], format: date-time }
        resueltoEn: { type: [string, 'null'], format: date-time }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
    TicketDetalle:
      allOf:
        - $ref: '#/components/schemas/Ticket'
        - type: object
          required: [descripcion, mensajes]
          properties:
            descripcion: { type: string }
            mensajes: { type: array, items: { $ref: '#/components/schemas/MensajeTicket' } }
    MensajeTicket:
      type: object
      required: [id, autorNombre, texto, creadoEn]
      properties:
        id: { type: string, format: uuid }
        autorNombre: { type: string }
        autorTipo: { $ref: '#/components/schemas/TipoUsuario' }
        texto: { type: string }
        interno: { type: boolean, description: Solo equipo; al cliente nunca le llegan mensajes internos }
        adjuntos: { type: array, items: { $ref: '#/components/schemas/ArchivoMini' } }
        creadoEn: { type: string, format: date-time }

    # ---------- correos
    ReglaCorreo:
      type: object
      required: [evento, descripcion, activa]
      properties:
        evento: { type: string, examples: [pieza.lista_revision, ticket.resuelto] }
        descripcion: { type: string, examples: ['Te avisamos cuando una pieza está lista para tu revisión'] }
        destinatarios: { type: string, enum: [MIEMBROS_CLIENTE, ACCOUNT_MANAGER, AMBOS] }
        activa: { type: boolean }
    CorreoPreparado:
      type: object
      required: [id, para, asunto, html, texto, evento]
      properties:
        id: { type: string, format: uuid }
        para: { type: string, format: email }
        nombre: { type: ['string', 'null'] }
        asunto: { type: string }
        html: { type: string }
        texto: { type: string, description: Versión en texto plano del mismo correo }
        evento: { type: string, examples: [pieza.lista_revision] }
    CorreoEnviado:
      type: object
      required: [id, para, asunto, estado, creadoEn]
      properties:
        id: { type: string, format: uuid }
        para: { type: string, format: email }
        asunto: { type: string }
        evento: { type: [string, 'null'] }
        estado: { type: string, enum: [PENDIENTE, ENVIADO, FALLIDO] }
        enviadoEn: { type: [string, 'null'], format: date-time }
        creadoEn: { type: string, format: date-time }

    # ---------- panel interno
    ResumenAgencia:
      type: object
      required: [clientesActivos, piezasAtrasadas, aprobacionesPendientes, gastoIaUsd, limiteIaUsd]
      properties:
        clientesActivos: { type: integer }
        proyectosConRetraso: { type: integer, description: 'Proyectos activos con una etapa atrasada (reunión 15 oct: el panel mira proyectos, no piezas)' }
        retrasoPorCliente: { type: array, items: { type: object, properties: { clienteNombre: { type: string }, proyectos: { type: integer } } } }
        requerimientosAtrasados: { type: integer, description: 'Requerimientos abiertos que pasaron su fecha límite' }
        piezasAtrasadas: { type: integer }
        atrasadasPorCliente: { type: array, items: { type: object, properties: { clienteNombre: { type: string }, atrasadas: { type: integer } } } }
        aprobacionesPendientes: { type: integer }
        gastoIaUsd: { type: number }
        limiteIaUsd: { type: number }
        pctLimite: { type: number }
        clientesSobreUmbral:
          type: array
          description: 'Banner "2 clientes llegaron al 80 % de su límite de IA"'
          items:
            type: object
            properties:
              clienteId: { type: string, format: uuid }
              clienteNombre: { type: string }
              gastoUsd: { type: number }
              limiteUsd: { type: number }
              pctLimite: { type: number }
    FilaPanelCliente:
      type: object
      required: [cliente, estadoOperativo, atrasadas, porAprobar, gastoIa]
      properties:
        cliente: { $ref: '#/components/schemas/ClienteResumen' }
        contactoPrincipalNombre: { type: [string, 'null'] }
        accountManagerNombre: { type: [string, 'null'] }
        proyectosActivos: { type: integer, description: 'Proyectos activos o en pausa de la cuenta' }
        estadoOperativo: { $ref: '#/components/schemas/EstadoOperativo' }
        atrasadas: { type: integer, description: Piezas con fechaProgramada vencida y no PUBLICADO }
        porAprobar: { type: integer }
        piezas:
          type: object
          description: Conteo por estado en el periodo
          additionalProperties: { type: integer }
        ticketsAbiertos: { type: integer }
        ticketsFueraSla: { type: integer }
        gastoIa:
          type: object
          required: [gastoUsd, limiteUsd, pctLimite, alerta]
          properties:
            gastoUsd: { type: number }
            limiteUsd: { type: number }
            pctLimite: { type: number }
            alerta: { type: boolean, description: 'pctLimite ≥ umbral ("Alerta · Umbral ≥ 80 %")' }
        pagoAtrasadoDias: { type: [integer, 'null'], description: 'Solo si el pago está atrasado desde el umbral (7 días): operaciones coordina antes de seguir con el proyecto. Sin montos' }
    BandejaProduccion:
      type: object
      required: [columnas, resumen]
      properties:
        resumen:
          type: object
          properties:
            total: { type: integer }
            atrasadas: { type: integer }
            aprobadas: { type: integer }
            publicadas: { type: integer }
            porRevisar: { type: integer }
            enProduccion: { type: integer }
        alertaGastoIa:
          type: [object, 'null']
          description: Solo cuando se filtra un cliente que superó el umbral
          properties:
            clienteNombre: { type: string }
            gastoUsd: { type: number }
            limiteUsd: { type: number }
            pctLimite: { type: number }
        columnas:
          type: array
          items:
            type: object
            required: [columna, total, piezas]
            properties:
              columna: { $ref: '#/components/schemas/ColumnaBandeja' }
              total: { type: integer }
              piezas: { type: array, items: { $ref: '#/components/schemas/PiezaResumen' } }
              siguienteCursor: { type: [string, 'null'] }
    ActividadCuenta:
      type: object
      required: [fecha, descripcion]
      properties:
        fecha: { type: string, format: date-time }
        usuarioNombre: { type: [string, 'null'] }
        descripcion: { type: string, examples: ['Aprobó la versión 1 de «Tu ritual, tu momento». No aplica a la versión actual.'] }
        piezaId: { type: [string, 'null'], format: uuid }
        etiqueta: { type: [string, 'null'], enum: [POR_REVISAR, APROBADA, CAMBIOS_SOLICITADOS, VERSION_ANTERIOR, null] }
    ReporteCostos:
      type: object
      required: [periodo, totalUsd, clientes]
      properties:
        periodo: { $ref: '#/components/schemas/Periodo' }
        totalUsd: { type: number }
        clientes:
          type: array
          items:
            type: object
            required: [clienteId, nombre, gastoUsd, limiteUsd, pctLimite, porModelo]
            properties:
              clienteId: { type: string, format: uuid }
              nombre: { type: string }
              gastoUsd: { type: number }
              limiteUsd: { type: number }
              pctLimite: { type: number }
              porModelo:
                type: array
                items:
                  type: object
                  properties:
                    modelo: { type: string }
                    tokensEntrada: { type: integer }
                    tokensSalida: { type: integer }
                    imagenes: { type: integer }
                    costoUsd: { type: number }
    Ejecucion:
      type: object
      required: [id, clienteId, agente, estado, iniciadoEn]
      properties:
        id: { type: string, format: uuid }
        clienteId: { type: string, format: uuid }
        clienteNombre: { type: string }
        agente: { type: string }
        estado: { $ref: '#/components/schemas/EstadoEjecucion' }
        piezaId: { type: [string, 'null'], format: uuid }
        costoUsd: { type: number }
        error: { type: [string, 'null'] }
        n8nExecutionUrl: { type: [string, 'null'], format: uri }
        iniciadoEn: { type: string, format: date-time }
        finalizadoEn: { type: [string, 'null'], format: date-time }

    # ---------- integraciones
    EjecucionEntrada:
      type: object
      required: [clienteId, agente, n8nExecutionId, estado]
      properties:
        clienteId: { type: string, format: uuid }
        agente: { type: string, enum: [marketing-jefe, contenido-blog, contenido-copies, estaticos, audiovisual-asistido, programacion, desarrollo-web, paid-media, soporte-triaje] }
        n8nWorkflowId: { type: string }
        n8nExecutionId: { type: string }
        piezaId: { type: string, format: uuid }
        estado: { $ref: '#/components/schemas/EstadoEjecucion' }
        error: { type: string }
        consumos:
          type: array
          description: El costo lo calcula la API con la tabla de tarifas vigente; n8n no envía montos.
          items:
            type: object
            required: [proveedor, modelo]
            properties:
              proveedor: { type: string, enum: [google, openai, anthropic, replicate] }
              modelo: { type: string }
              tokensEntrada: { type: integer, minimum: 0 }
              tokensSalida: { type: integer, minimum: 0 }
              imagenes: { type: integer, minimum: 0 }
    PiezaEntradaAgente:
      type: object
      required: [clienteId, tipo, titulo, periodo, version]
      properties:
        clienteId: { type: string, format: uuid }
        tipo: { $ref: '#/components/schemas/TipoPieza' }
        titulo: { type: string }
        periodo: { $ref: '#/components/schemas/Periodo' }
        canal: { type: string }
        fechaProgramada: { type: string, format: date-time }
        calendarioId: { type: string, format: uuid }
        servicioContratadoId: { type: string, format: uuid }
        piezaExistenteId: { type: string, format: uuid, description: 'Si el calendario ya creó la pieza, se completa en vez de duplicarla' }
        version: { $ref: '#/components/schemas/VersionEntrada' }
    SincronizacionInooWork:
      type: object
      properties:
        empleados:
          type: array
          description: |
            Personas nuevas o cambiadas en InooWork (tabla employees). Se enlazan por `id` (EMP-…) y, si el portal
            no lo tiene, por `email`. Las que no existen se crean en el portal (sin correo no se puede: van en
            `empleadosSinCorreo`). `status: inactive` desactiva a la persona. Nada de esto se reenvía a InooWork.
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, examples: [EMP-002] }
              name: { type: string }
              email: { type: [string, 'null'] }
              role: { type: [string, 'null'], description: 'Cargo' }
              department: { type: [string, 'null'], examples: [Diseño Grafico] }
              status: { type: [string, 'null'], examples: [active, inactive] }
              username: { type: [string, 'null'] }
              supervisorUsername: { type: [string, 'null'], description: 'Username de su jefe en InooWork (organigrama)' }
        empleadosEliminados:
          type: array
          description: 'Ids de empleados borrados en InooWork: en el portal se desactivan (se conserva su historial)'
          items: { type: string }
        proyectos:
          type: array
          items:
            type: object
            required: [inooworkProyectoId, items]
            properties:
              inooworkProyectoId: { type: string, examples: [PROJ-ABC123] }
              items:
                type: array
                items:
                  type: object
                  required: [id, name, status]
                  description: Ítem tal como lo devuelve InooWork (groups[].items[]); `notes` se descarta
                  properties:
                    id: { type: string }
                    grupo: { type: string }
                    name: { type: string }
                    status: { type: string, enum: [Sin Iniciar, En Progreso, En Revisión, Completado, Bloqueado] }
                    assigneeName: { type: string }
                    dueDate: { type: [string, 'null'], format: date }
        tickets:
          type: array
          items:
            type: object
            required: [ticketId, estado]
            properties:
              ticketId: { type: string, format: uuid }
              inooworkRef: { type: string }
              estado: { $ref: '#/components/schemas/EstadoTicket' }
              areaAsignada: { type: string }
              urgencia: { $ref: '#/components/schemas/UrgenciaTicket' }
              urgenciaJustificacion: { type: string, description: "Por qué el agente de triaje eligió esa urgencia (solo equipo)" }
              asignadoNombre: { type: string }
              mensajes:
                type: array
                items:
                  type: object
                  required: [autorNombre, texto, creadoEn]
                  properties:
                    externoId: { type: string, description: Para deduplicar }
                    autorNombre: { type: string }
                    texto: { type: string }
                    interno: { type: boolean }
                    creadoEn: { type: string, format: date-time }
    EventoSaliente:
      type: object
      required: [id, tipo, ocurridoEn, datos]
      properties:
        id: { type: integer }
        tipo:
          type: string
          enum:
            - cliente.creado             # n8n crea carpetas en Drive y devuelve IDs (PATCH cliente)
            - brief.enviado              # el cliente envió brief, archivos y derechos; aviso al AM
            - brief.confirmado           # dispara al Jefe de Marketing
            - calendario.aprobado        # reparte tareas a subagentes y crea ítems en InooWork
            - calendario.cambios_solicitados
            - idea_blog.elegida
            - requerimiento.creado       # la agencia le pidió algo al cliente; correo con la fecha límite
            - requerimiento.enviado      # el cliente lo completó; aviso al responsable
            - requerimiento.revisado     # el equipo lo aprobó u observó; aviso al cliente
            - requerimiento.atrasado     # pasó la fecha límite; se corrió el cronograma y correo «no podemos avanzar sin esto»
            - pieza.estado_cambiado      # incluye LISTO_REVISION (correo al cliente), CAMBIOS_SOLICITADOS (tarea InooWork), APROBADO_CLIENTE (programar)
            - comentario.creado
            - archivo.subido             # indexar en base de conocimiento del cliente
            - ticket.creado              # triaje con Gemini Flash-Lite y alta en InooWork
            - ticket.mensaje_cliente
            - ticket.estado_cambiado     # correo al cliente
            - presupuesto.alerta         # gasto IA ≥ umbral o ≥ límite
            - pago.situacion_cambiada    # Finanzas marcó al día o atrasado; desde el umbral, alerta a operaciones
            - tarea.asignada             # una tarea interna tiene responsable nuevo; aviso a esa persona
            - entregable.listo_revision  # el equipo envió un entregable (flujograma, prototipo…); correo al cliente
            - entregable.decidido        # el cliente aprobó o pidió cambios; aviso al responsable
            - tarea.mencion              # alguien mencionó a una persona en una tarea
            - servicio.contratado        # proyecto creado desde su plantilla (etapas y fechas)
            - servicio.standby_proximo   # faltan 7 días para el standby por inactividad (correo al cliente y responsables)
            - servicio.standby           # 30 días sin actividad del cliente: sus servicios activos pasan a STANDBY
            - servicio.reactivado        # el cliente volvió a usar el portal y sus servicios en standby vuelven a ACTIVO
            - etapa.actualizada          # el equipo movió una etapa; el avance del cliente cambia
            - comentario_proyecto.creado # comentario o consulta en el perfil del proyecto; aviso al responsable
            - responsable.cambio_solicitado # el cliente propuso un sucesor; el AM lo revisa
            - responsable.cambiado       # aprobado: invitación al sucesor y aviso al AM para contactarlo
            - miembro.invitado           # acceso nuevo al portal: alta en Cognito y correo de bienvenida
            - miembro.retirado           # el equipo quitó el acceso; deshabilitar en Cognito si no tiene otras cuentas
            - equipo.persona_creada      # alta de un colaborador (portal o InooWork): alta en Cognito (pool equipo) y correo de bienvenida
            - equipo.persona_desactivada # baja de un colaborador: deshabilitar en Cognito
            - tarea.por_vencer           # recordatorio: una tarea interna vence el próximo día hábil (a su responsable)
            - requerimiento.por_vencer   # recordatorio: el cliente tiene que entregar algo el próximo día hábil
            - reunion.proxima            # recordatorio: reunión programada para el próximo día hábil (responsable y cliente)
            - servicio.cerrado           # el equipo cerró el proyecto: agradecimiento y encuesta de satisfacción al cliente
        ocurridoEn: { type: string, format: date-time }
        clienteId: { type: [string, 'null'], format: uuid }
        datos: { type: object }
