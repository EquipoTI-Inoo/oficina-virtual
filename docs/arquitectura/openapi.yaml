    post:
      tags: [Panel interno]
      operationId: crearPersona
      summary: 'Da de alta a un colaborador en el portal y en InooWork (nivel ADMIN). El correo es su usuario en los dos'
      description: |
        Se crea en el portal aunque InooWork no responda: queda `inoowork.estado = PENDIENTE` y se reintenta.
        Emite `equipo.persona_creada` para el correo de bienvenida. En InooWork nace con una contraseña aleatoria:
        RRHH le da acceso con «Restablecer contraseña» hasta que las dos apps compartan el login.
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, correo]
              properties:
                nombre: { type: string }
                correo: { type: string, format: email }
                cargo: { type: [string, 'null'] }
                area: { oneOf: [ { $ref: '#/components/schemas/AreaEquipo' }, { type: 'null' } ] }
                rolEquipo: { $ref: '#/components/schemas/RolEquipo' }
                nivel: { oneOf: [ { $ref: '#/components/schemas/NivelAcceso' }, { type: 'null' } ], description: 'null = el de su área' }
                esLead: { type: boolean }
                reportaAId: { type: [string, 'null'], format: uuid, description: 'Su jefe en el organigrama' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FichaPersona' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }

