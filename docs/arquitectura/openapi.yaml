      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ConversacionJarvis' }
                  - type: object
                    required: [datos]
                    properties:
                      datos:
                        type: array
