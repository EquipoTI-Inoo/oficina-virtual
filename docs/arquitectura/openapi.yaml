        '422': { $ref: '#/components/responses/Validacion' }


  /clientes/{clienteId}/archivos:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Archivos]
      operationId: listarArchivos
      summary: Biblioteca de contenido del cliente (fotos, videos, documentos)
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: categoria, in: query, schema: { type: string } }
        - { name: etiqueta, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - properties:
                      datos: { type: array, items: { $ref: '#/components/schemas/Archivo' } }
    post:
      tags: [Archivos]
      operationId: iniciarSubida
      summary: Paso 1 de 3. Registra el archivo y devuelve una URL prefirmada de S3 (PUT, 15 min).
      description: |
        Flujo: 1) `POST /clientes/{id}/archivos` → `subida.url`; 2) el navegador hace `PUT` directo a S3 con
        los `subida.headers`; 3) `POST /archivos/{id}/confirmar`. Archivos sin confirmar se borran a las 24 h.

        | `uso` | Formatos | Máximo | Después de confirmar |
        |---|---|---|---|
        | `BRIEF` (requiere `briefPeriodo`) | JPG, PNG, MP4, PDF, DOCX | 100 MB | `SUBIDO`; pasa a `DISPONIBLE` al enviar el brief |
        | `ADJUNTO_TICKET` | PDF, JPG, PNG, DOCX | 10 MB | `DISPONIBLE` |
        | `BIBLIOTECA` (solo equipo) | cualquiera de los anteriores | 100 MB | `DISPONIBLE` |
      x-roles: [EQUIPO, ADMIN_CLIENTE, APROBADOR]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubidaEntrada' }
            example:
              nombre: foto-producto-1.jpg
              mime: image/jpeg
              bytes: 2483120
              sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
              categoria: FOTO
              etiquetas: [producto, verano]
              uso: BRIEF
              briefPeriodo: '2026-10'
      responses:
        '201':
          description: Registrado en PENDIENTE_SUBIDA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubidaIniciada' }
        '422': { $ref: '#/components/responses/Validacion' }

  /archivos/{archivoId}/confirmar:
    parameters: [ { $ref: '#/components/parameters/ArchivoId' } ]
    post:
      tags: [Archivos]
      operationId: confirmarSubida
      summary: Paso 3 de 3. Verifica el objeto en S3 (tamaño y checksum) y lo marca SUBIDO o DISPONIBLE según su uso.
      x-roles: [EQUIPO, ADMIN_CLIENTE, APROBADOR]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Archivo' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /archivos/{archivoId}:
    parameters: [ { $ref: '#/components/parameters/ArchivoId' } ]
    patch:
      tags: [Archivos]
      operationId: actualizarArchivo
      summary: Editar nombre, categoría o etiquetas
      x-roles: [EQUIPO, ADMIN_CLIENTE, APROBADOR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string }
                categoria: { type: string }
                etiquetas: { type: array, items: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Archivo' }
    delete:
      tags: [Archivos]
      operationId: eliminarArchivo
      summary: Eliminar archivo (borrado lógico)
      x-roles: [EQUIPO, ADMIN_CLIENTE]
      responses:
        '204': { description: Eliminado (borrado lógico) }

  /archivos/{archivoId}/descarga:
    parameters: [ { $ref: '#/components/parameters/ArchivoId' } ]
    get:
      tags: [Archivos]
      operationId: descargarArchivo
      summary: URL firmada temporal para descargar
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UrlFirmada' }

