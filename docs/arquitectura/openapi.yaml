        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/Brief' } }

  /clientes/{clienteId}/briefs/{periodo}:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - { name: periodo, in: path, required: true, schema: { $ref: '#/components/schemas/Periodo' } }
    get:
      tags: [Referencias y briefs]
      operationId: obtenerBrief
      summary: Brief del mes con sus archivos. Si no existe, devuelve uno vacío en BORRADOR (no 404).
