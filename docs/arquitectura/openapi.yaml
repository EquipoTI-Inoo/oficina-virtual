  /monday/tableros:
    get:
      tags: [Tableros]
      operationId: listarTablerosMonday
      summary: 'Importar de Monday (9 nov): los tableros de la cuenta de Monday y cuáles ya se importaron'
      description: |
        Una importación masiva que hace el nivel ADMIN para dejar de usar Monday. El portal lee Monday con la clave
        MONDAY_API_TOKEN del servidor (solo lectura). `conectado: false` = tableros de demo (falta la clave).
      x-roles: [EQUIPO]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos, conectado]
                properties:
                  conectado: { type: boolean }
                  datos:
                    type: array
                    items:
                      type: object
                      required: [id, nombre, espacio, items, actualizadoEn, importado]
                      properties:
                        id: { type: string }
                        nombre: { type: string }
                        espacio: { type: [string, 'null'] }
                        items: { type: integer }
                        actualizadoEn: { type: [string, 'null'] }
                        importado: { $ref: '#/components/schemas/ImportacionMonday' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '502': { description: Monday no respondió }

  /monday/tableros/{tableroId}:
    parameters:
      - { name: tableroId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Tableros]
      operationId: previaTableroMonday
      summary: 'Vista previa: qué se pasa, cómo se traducen los estados y a quién del equipo corresponde cada persona de Monday'
      x-roles: [EQUIPO]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviaMonday' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '502': { description: Monday no respondió }

  /monday/tableros/{tableroId}/importar:
    parameters:
      - { name: tableroId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Tableros]
      operationId: importarTableroMonday
      summary: 'Crea el proyecto en InooWork con todo el tablero y guarda el historial de cada ítem (actualizaciones, respuestas y archivos)'
      description: |
        `estados` y `personas` corrigen lo sugerido en la vista previa (lo que no se manda queda como se sugirió).
        Una persona emparejada con alguien sin ficha de InooWork da 422. El líder, si no se elige, es el dueño del
        tablero en Monday (si está emparejado) o quien importa. Los archivos se copian al almacén del portal.
        409 YA_IMPORTADO si ese tablero ya está en un proyecto que sigue existiendo.
      x-roles: [EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cliente]
              properties:
                nombre: { type: string, maxLength: 120 }
                cliente: { type: string, maxLength: 120 }
                estados:
                  type: object
                  description: Etiqueta de Monday → estado de InooWork.
                  additionalProperties: { type: string, enum: [Sin Iniciar, En Progreso, En Revisión, Completado, Soporte Continuo, Bloqueado] }
                personas:
                  type: object
                  description: Id de persona en Monday → id de usuario del equipo (o null, sin asignar).
                  additionalProperties: { type: [string, 'null'] }
                liderId: { type: [string, 'null'] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [tablero, resumen, archivosSinCopiar]
                properties:
                  tablero: { $ref: '#/components/schemas/TableroInooWork' }
                  resumen:
                    type: object
                    required: [grupos, items, subitems, actualizaciones, archivos, archivosCopiados, sinResponsable]
                    properties:
                      grupos: { type: integer }
                      items: { type: integer }
                      subitems: { type: integer }
                      actualizaciones: { type: integer }
                      archivos: { type: integer }
                      archivosCopiados: { type: integer }
                      sinResponsable: { type: integer }
                  archivosSinCopiar:
                    type: array
                    items: { type: object, required: [nombre, motivo], properties: { nombre: { type: string }, motivo: { type: string } } }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }
        '502': { description: Monday o InooWork no respondieron }

