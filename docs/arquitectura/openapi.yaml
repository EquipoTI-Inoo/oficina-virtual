openapi: 3.1.0
info:
  title: API Portal de Clientes y Oficina Virtual (Inoo)
  version: 1.1.0
  summary: Contrato compartido entre backend, portal Next.js (cliente + panel interno) y n8n.
  description: |
    Contrato v1 de la API que usan el portal de clientes, el panel interno y las integraciones
    (n8n, InooWork). Basado en el PRD del 3 oct 2026 y el backlog v1.0.

    **v1.1 (6 oct 2026)**: ajustado a las pantallas de Figma del portal (inicio, servicios, entregables,
    detalle de pieza, blog, calendario, brief, resultados, avance, soporte, notificaciones, panel general,
    bandeja de producción y ficha de cliente).

    **v1.2 (12 oct 2026)**: catálogo real de servicios (`CodigoServicio`) con variantes y detalle, plantillas
    de proyecto con etapas y % de avance acumulado, y etapas por proyecto que mueve el equipo. El cliente solo
    ve los servicios que tiene contratados. El Inicio del cliente resume su cuenta (lo que antes era la ficha
    del equipo): servicios con avance, responsable, carpeta de Drive, su marca (si aplica), actividad y, sin montos,
    un aviso si un pago vence pronto. Los pagos, usuarios, correos y ayuda están en "Mi cuenta". Cada servicio
    tiene su perfil de proyecto: métricas de su plantilla, etapas, reuniones, entregables por revisar y
    comentarios del cliente. Requerimientos: la agencia le pide al cliente (brief, accesos, catálogo) desde una
    plantilla con formulario y fecha límite en días hábiles; si se atrasa, se corre el cronograma del servicio y se
    le avisa. Reemplazan a los requerimientos del brief (cliente → agencia) del 10 oct. Los tickets del soporte
    continuo se generan dentro de ese servicio (`servicioContratadoId`); sin servicio son consultas generales.
    Cambio de responsable: el cliente deja los datos de su sucesor y el equipo lo aprueba antes de dar el acceso.
    Avisos: feriados, días no laborables, aniversario del cliente y avisos generales; los feriados y días no
    laborables no cuentan como días hábiles en plazos ni etapas.

    ## Convenciones
    - **JSON en camelCase**, fechas ISO 8601 en UTC (`2026-11-03T15:00:00Z`), periodos mensuales `AAAA-MM`.
    - **IDs** son UUID, salvo `numero` de ticket (se muestra como `TCK-000123`).
    - **Dinero** en USD como número con hasta 4 decimales (solo para mostrar; no se cobra nada con esta API).
    - **Listas paginadas por cursor**: `?limite=20&cursor=...` → `{ "datos": [...], "paginacion": { "siguienteCursor": "..." | null, "total": 4 } }`.
    - **Errores** en `application/problem+json` (RFC 9457) con un `codigo` estable para que el frontend traduzca.
    - **Idempotencia**: los POST que crean o deciden algo aceptan `Idempotency-Key`; reintentar con la misma clave devuelve la misma respuesta.
    - **Visibilidad**: `x-roles` indica quién puede llamar. Un usuario CLIENTE solo ve clientes de los que es miembro.
      Los campos marcados "solo equipo" no se envían a usuarios CLIENTE (el backend los omite, no los manda en null).
      Un CLIENTE sí ve en listas y calendario las piezas que se están produciendo, pero con `estado: EN_PRODUCCION`
      y sin contenido; solo ve el contenido de las versiones que el equipo le envió a revisión.

    ## Autenticación
    - Portal y panel: `Authorization: Bearer <JWT de Cognito>`. Dos user pools (equipo y clientes); el backend
      acepta ambos y resuelve el usuario con `GET /me`.
    - n8n y sincronización InooWork: `X-Api-Key`, con scopes.
    - Webhooks entrantes de InooWork: firma HMAC-SHA256 en `X-Inoo-Firma`.
servers:
  - url: https://clientes.inoo.pe/api/v1
    description: Producción (dominio propuesto en el PRD, pendiente de confirmar)
  - url: http://localhost:3000/api/v1
    description: Desarrollo local
security:
  - bearerAuth: []
tags:
  - name: Sesión
  - name: Clientes
  - name: Referencias y briefs
  - name: Requerimientos
  - name: Servicios
  - name: Piezas
  - name: Planificación
  - name: Archivos
  - name: Paid media
  - name: Reportes
  - name: Soporte
  - name: Correos
  - name: Panel interno
  - name: Integraciones

paths:
  # ------------------------------------------------------------------ Sesión
  /me:
    get:
      tags: [Sesión]
      operationId: obtenerSesion
      summary: Usuario actual, su tipo y los clientes a los que tiene acceso
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
              example:
                usuario: { id: 5b0c1e2a-8f3d-4c6b-9a71-2d4e6f8a0b1c, nombre: Valeria Mendoza, email: valeria@casaoliva.pe, cargo: Administradora, iniciales: VM, tipo: CLIENTE, rolEquipo: null }
                notificacionesSinLeer: 1
                clientes:
                  - { clienteId: 7f3a9c10-2b4d-4e8f-a1c3-5d7e9f0a2b4c, nombre: Casa Oliva, rol: ADMIN_CLIENTE }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  # ------------------------------------------------------------------ Clientes
  /me/notificaciones:
    get:
      tags: [Sesión]
      operationId: listarNotificaciones
      summary: Notificaciones de la campana (más recientes primero)
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: noLeidas, in: query, schema: { type: boolean, default: false } }
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - properties:
                      datos: { type: array, items: { $ref: '#/components/schemas/Notificacion' } }
              example:
                datos:
                  - { id: 0c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f, tipo: PIEZAS_LISTAS, titulo: Tienes contenido nuevo, cuerpo: 4 piezas listas para revisión. Revisa el contenido de octubre., enlace: /entregables, leida: false, creadoEn: '2026-10-06T13:00:00Z' }
                paginacion: { siguienteCursor: null, total: 1 }

  /me/notificaciones/leer:
    post:
      tags: [Sesión]
      operationId: marcarNotificacionesLeidas
      summary: Marcar como leídas (las indicadas o todas)
      x-roles: [EQUIPO, CLIENTE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: string, format: uuid } }
                todas: { type: boolean, default: false }
      responses:
        '204': { description: Marcadas }

  /servicios:
    get:
      tags: [Servicios]
      operationId: listarCatalogoServicios
      summary: Catálogo de servicios que vende la agencia, con sus variantes
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/ServicioCatalogo' } }
  /clientes:
    get:
      tags: [Clientes]
      operationId: listarClientes
      summary: Clientes visibles para el usuario (equipo ve todos; cliente ve los suyos)
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoCliente' } }
        - { name: q, in: query, description: Búsqueda por nombre, schema: { type: string } }
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - properties:
                      datos: { type: array, items: { $ref: '#/components/schemas/ClienteResumen' } }
    post:
      tags: [Clientes]
      operationId: crearCliente
      summary: Alta de cliente (CU-01). Dispara la creación de carpetas en Drive vía n8n.
      x-roles: [ACCOUNT_MANAGER, ADMIN]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClienteEntrada' }
      responses:
        '201':
          description: Creado. `driveCarpetaId` llega en null y se completa cuando n8n termina (evento `cliente.creado`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }

  /clientes/{clienteId}:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Clientes]
      operationId: obtenerCliente
      summary: Perfil del cliente (CLI-01)
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Clientes]
      operationId: actualizarCliente
      summary: Editar perfil (merge parcial)
      x-roles: [ACCOUNT_MANAGER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClienteEntrada' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '422': { $ref: '#/components/responses/Validacion' }

  /clientes/{clienteId}/inicio:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Clientes]
      operationId: obtenerInicioCliente
      summary: 'Inicio del cliente ("Tu cuenta"): todo lo que pinta la pantalla en una sola llamada'
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: periodo, in: query, description: Por defecto el mes actual (America/Lima), schema: { $ref: '#/components/schemas/Periodo' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InicioCliente' }
              example:
                periodo: '2026-10'
                indicadores: { serviciosActivos: 4, porAprobar: 4, ticketsAbiertos: 2, requerimientosPendientes: 1 }
                plan: { nombre: Plan Crecimiento, fechaFin: '2026-12-31' }
                avanceMes: { totales: 20, aprobadas: 12, publicadas: 3, porRevisar: 4, enProduccion: 4, porcentaje: 60 }
                pendientes: []
                cuenta:
                  nombre: Casa Oliva
                  responsable: { id: 7f8e9d0c-1b2a-4c3d-8e4f-5a6b7c8d9e0f, nombre: Diego Castro, cargo: Equipo de agencia }
                  driveUrl: 'https://drive.google.com/drive/folders/demo-casa-oliva'
                servicios:
                  - codigo: CRM_IMPLEMENTACION
                    nombre: Implementación de CRM
                    titulo: Implementación de CRM - Casa Oliva
                    servicioContratadoId: 3c9d8e7f-6a5b-4c3d-9e2f-1a0b9c8d7e6f
                    cantidadMensual: 0
                    unidad: entregas
                    estado: ACTIVO
                    avance: { porcentaje: 20, etapaActual: { orden: 2, nombre: Procesos e implementación, estado: EN_PROGRESO, atrasada: false }, totalEtapas: 4, etapasCompletadas: 1 }
                avisoPago: { situacion: ATRASADO, diasAtraso: 8 }
                marca: { mensajeCentral: Cuida tu piel. Vuelve a ti., tono: [Cercano, Consciente, Sereno] }
                actividad:
                  - { fecha: '2026-10-06T15:00:00Z', texto: 'Terminamos la etapa «Sesión de contenido» de Social Media Pro', tipo: ETAPA }
                ticketsAbiertos: []

  /clientes/{clienteId}/estado-pago:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Clientes]
      operationId: obtenerEstadoPago
      summary: '«Al día» o «Atrasado X días» (reunión 15 oct). Sin cuotas ni montos: eso vivirá en Cosmic'
      description: |
        Cada rol ve lo suyo:
        - ADMIN y FINANZAS: todo, con la nota y quién lo actualizó.
        - El resto del equipo: situación, días y si hay alerta (para coordinar antes de seguir con el proyecto).
        - ADMIN_CLIENTE: solo situación y días. Otros roles del cliente reciben 403.
      x-roles: [EQUIPO, ADMIN_CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoPago' }
              example: { situacion: ATRASADO, atrasadoDesde: '2026-09-28', diasAtraso: 8, alertaOperaciones: true, umbralDias: 7, nota: 'Cuota 2 de 3 de la implementación de CRM', actualizadoEn: '2026-10-01T15:00:00Z', actualizadoPor: { id: 8e9f0a1b-2c3d-4e5f-8a6b-7c8d9e0f1a2b, nombre: Rosa Paredes } }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    put:
      tags: [Clientes]
      operationId: actualizarEstadoPago
      summary: 'Administración o Finanzas marca al cliente al día o atrasado desde una fecha'
      description: Emite `pago.situacion_cambiada`. Si el atraso alcanza el umbral, operaciones ve la alerta en el panel y en la ficha.
      x-roles: [ADMIN, FINANZAS]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EstadoPagoEntrada' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoPago' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }

  /avisos:
    get:
      tags: [Clientes]
      operationId: listarAvisos
      summary: 'Equipo: avisos vigentes y próximos (globales y por cliente). El cliente los recibe en su Inicio.'
      x-roles: [EQUIPO]
      parameters:
        - { name: clienteId, in: query, description: Solo los de ese cliente y los globales, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/Aviso' } }
    post:
      tags: [Clientes]
      operationId: crearAviso
      summary: 'Publicar un aviso. FERIADO y NO_LABORABLE son para todos y dejan de contar como días hábiles.'
      x-roles: [ACCOUNT_MANAGER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, titulo, fechaInicio]
              properties:
                tipo: { type: string, enum: [FERIADO, NO_LABORABLE, GENERAL] }
                titulo: { type: string, minLength: 3 }
                mensaje: { type: string }
                clienteId: { type: [string, 'null'], format: uuid, description: 'Solo GENERAL; null = todos los clientes' }
                fechaInicio: { type: string, format: date }
                fechaFin: { type: string, format: date, description: 'Por defecto, la misma que fechaInicio' }
                visibleDesde: { type: string, format: date, description: 'Por defecto, 7 días antes de fechaInicio' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Aviso' }
        '422': { $ref: '#/components/responses/Validacion' }

  /avisos/{avisoId}:
    parameters:
      - { name: avisoId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Clientes]
      operationId: eliminarAviso
      summary: Quitar un aviso (vuelve a contar el día como hábil si era feriado o no laborable)
      x-roles: [ACCOUNT_MANAGER, ADMIN]
      responses:
        '204': { description: Eliminado }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /clientes/{clienteId}/actividad:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Clientes]
      operationId: listarActividadCliente
      summary: '"Historial de la cuenta" de la ficha: versiones creadas, aprobaciones, cambios de marca'
      x-roles: [EQUIPO]
      parameters:
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - properties:
                      datos: { type: array, items: { $ref: '#/components/schemas/ActividadCuenta' } }
  /clientes/{clienteId}/miembros:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Clientes]
      operationId: listarMiembros
      summary: Usuarios del cliente con acceso al portal (POR-01)
      x-roles: [EQUIPO, ADMIN_CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/Miembro' } }
    post:
      tags: [Clientes]
      operationId: invitarMiembro
      summary: Invitar a un usuario (crea la cuenta en el pool de clientes y envía el correo)
      description: Solo el equipo. El cliente no crea usuarios; pide el alta a su equipo Inoo o usa el cambio de responsable.
      x-roles: [ACCOUNT_MANAGER, ADMIN]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, nombre, rol]
              properties:
                email: { type: string, format: email }
                nombre: { type: string }
                rol: { $ref: '#/components/schemas/RolCliente' }
      responses:
        '201':
          description: Invitado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Miembro' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /clientes/{clienteId}/cambio-responsable:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Clientes]
      operationId: listarSolicitudesResponsable
      summary: 'Responsable actual de la cuenta y las solicitudes de cambio (la más reciente primero)'
      x-roles: [EQUIPO, ADMIN_CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [responsable, solicitudes]
                properties:
                  responsable: { oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ] }
                  solicitudes: { type: array, items: { $ref: '#/components/schemas/SolicitudResponsable' } }
    post:
      tags: [Clientes]
      operationId: solicitarCambioResponsable
      summary: 'Quien administra la cuenta propone a su sucesor; el equipo lo aprueba. Emite `responsable.cambio_solicitado`.'
      description: Una sola solicitud PENDIENTE por cliente (409 SOLICITUD_PENDIENTE). No crea ningún acceso hasta que el equipo la aprueba.
      x-roles: [ADMIN_CLIENTE]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, email, telefono]
              properties:
                nombre: { type: string, minLength: 3 }
                email: { type: string, format: email }
                telefono: { type: string, minLength: 6 }
                cargo: { type: string }
                motivo: { type: string }
                quitarAccesoAnterior: { type: boolean, default: true, description: 'Al aprobarse, quien la pidió deja de tener acceso' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitudResponsable' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }

  /solicitudes-responsable/{solicitudId}/decision:
    parameters:
      - { name: solicitudId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Clientes]
      operationId: decidirCambioResponsable
      summary: 'El equipo aprueba (crea el acceso del sucesor como ADMIN_CLIENTE y lo hace contacto principal) o rechaza con una nota'
      description: Al aprobar se emite `responsable.cambiado` (n8n envía la invitación al sucesor y avisa al AM para contactarlo).
      x-roles: [ACCOUNT_MANAGER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APROBADA, RECHAZADA] }
                nota: { type: string, description: Obligatoria al rechazar; la ve el cliente }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitudResponsable' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }

  /clientes/{clienteId}/miembros/{usuarioId}:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - { name: usuarioId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Clientes]
      operationId: cambiarRolMiembro
      summary: Cambiar el rol de un usuario del cliente
      x-roles: [ACCOUNT_MANAGER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rol]
              properties: { rol: { $ref: '#/components/schemas/RolCliente' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Miembro' }
    delete:
      tags: [Clientes]
      operationId: quitarMiembro
      summary: Quitar acceso a un usuario del cliente
      x-roles: [ACCOUNT_MANAGER, ADMIN]
      responses:
        '204': { description: Quitado }

  # ------------------------------------------------------------------ Referencias y briefs
  /clientes/{clienteId}/referencias:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Referencias y briefs]
      operationId: listarReferencias
      summary: Referencias permanentes de la marca (logo, manual, paleta, marcas que admira). Las del mes van en el brief.
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: tipo, in: query, schema: { $ref: '#/components/schemas/TipoReferencia' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/Referencia' } }
    post:
      tags: [Referencias y briefs]
      operationId: crearReferencia
      summary: Agregar una referencia permanente a la ficha. Si lleva archivo, primero se sube con /archivos.
