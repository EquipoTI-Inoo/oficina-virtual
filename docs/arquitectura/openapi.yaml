        bocetos: { type: array, items: { $ref: '#/components/schemas/BocetoWeb' }, description: 'Capturas de la propuesta visual, en el orden del flujograma' }
        documento: { oneOf: [ { $ref: '#/components/schemas/ResumenEntregableTaller' }, { type: 'null' } ], description: Entregable «Benchmark y flujograma» }
        demoEntregable: { oneOf: [ { $ref: '#/components/schemas/ResumenEntregableTaller' }, { type: 'null' } ], description: Entregable PROTOTIPO con la última demo }
        demos: { type: array, items: { $ref: '#/components/schemas/DemoWeb' } }
