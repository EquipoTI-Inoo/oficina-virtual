      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/Entregable' } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    post:
      tags: [Servicios]
      operationId: crearEntregable
      summary: 'El equipo carga un entregable con su primera versión (EN_PREPARACION: el cliente todavía no lo ve)'
      x-roles: [EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntregableEntrada' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntregableDetalle' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }

  /clientes/{clienteId}/entregables:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Servicios]
      operationId: listarEntregablesCliente
      summary: 'Entregables de todos los proyectos del cliente («Entregables por revisar»); filtra por estado'
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoEntregable' } }
      responses:
        '200':
          description: 'Primero lo que espera revisión, por fecha de envío'
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/Entregable' } }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /entregables/{entregableId}:
    parameters:
      - { name: entregableId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Servicios]
      operationId: obtenerEntregable
      summary: 'Detalle con versiones y decisiones. El cliente solo ve las versiones que se le enviaron'
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntregableDetalle' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /entregables/{entregableId}/versiones:
    parameters:
      - { name: entregableId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Servicios]
      operationId: nuevaVersionEntregable
      summary: 'Nueva versión (por ejemplo, tras los cambios del cliente). Queda EN_PREPARACION hasta enviarla'
      x-roles: [EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionEntregableEntrada' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntregableDetalle' }
        '409': { description: 'ENTREGABLE_APROBADO: ya está aprobado', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '422': { $ref: '#/components/responses/Validacion' }

  /entregables/{entregableId}/enviar:
    parameters:
      - { name: entregableId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Servicios]
      operationId: enviarEntregable
      summary: 'Una persona del equipo envía la versión vigente al cliente (LISTO_REVISION). Emite entregable.listo_revision'
      x-roles: [EQUIPO]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntregableDetalle' }
        '409': { description: 'VERSION_YA_ENVIADA o ENTREGABLE_APROBADO', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }

  /entregables/{entregableId}/decision:
    parameters:
      - { name: entregableId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Servicios]
      operationId: decidirEntregable
      summary: 'El cliente aprueba o pide cambios (comentario obligatorio). Cada pedido de cambios suma un rebote. Emite entregable.decidido'
      x-roles: [ADMIN_CLIENTE, APROBADOR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APROBADO, CAMBIOS_SOLICITADOS] }
                comentario: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntregableDetalle' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { description: 'ENTREGABLE_NO_ESPERA_REVISION', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '422': { $ref: '#/components/responses/Validacion' }

  /servicios-contratados/{servicioContratadoId}/taller-web:
    parameters:
      - { name: servicioContratadoId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Taller web]
      operationId: obtenerTallerWeb
      summary: 'Taller web del proyecto (solo equipo): benchmark, flujograma, prototipo y demos. Se crea al abrirlo, con las referencias del brief web'
      x-roles: [EQUIPO]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TallerWeb' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { description: 'NO_ES_WEB: el proyecto no es de Diseño y desarrollo web', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
    put:
      tags: [Taller web]
      operationId: editarTallerWeb
      summary: 'El equipo corrige referencias, puntajes, hallazgos, recomendaciones, flujograma y el prompt del prototipo. Las capturas se conservan por id de referencia'
      x-roles: [EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TallerWebEdicion' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TallerWeb' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }

  /servicios-contratados/{servicioContratadoId}/taller-web/capturas:
    parameters:
      - { name: servicioContratadoId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Taller web]
      operationId: capturarReferenciasWeb
      summary: 'Capturas de escritorio y móvil de las referencias pedidas (o de las que no tienen). Con NAVEGADOR_MODO=simulado son bocetos de relleno'
      x-roles: [EQUIPO]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                referenciaIds: { type: array, items: { type: string }, maxItems: 8 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoTallerWeb' }
        '409': { description: 'TALLER_SIN_REFERENCIAS', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }

  /servicios-contratados/{servicioContratadoId}/taller-web/analisis:
    parameters:
      - { name: servicioContratadoId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Taller web]
      operationId: analizarBenchmarkWeb
      summary: 'Puntaje de 1 a 5 por dimensión de cada referencia (mirando sus capturas), hallazgos clave y recomendaciones UX. Reemplaza los puntajes anteriores'
      x-roles: [EQUIPO]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoTallerWeb' }
        '409': { description: 'TALLER_SIN_REFERENCIAS', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '502': { description: 'IA_NO_DISPONIBLE: el modelo no respondió', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }

  /servicios-contratados/{servicioContratadoId}/taller-web/flujograma:
    parameters:
      - { name: servicioContratadoId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Taller web]
      operationId: generarFlujogramaWeb
      summary: 'Propone el flujograma (navegación por niveles + secciones de cada página) desde el brief, el resumen de la reunión, el alcance y las recomendaciones'
      x-roles: [EQUIPO]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoTallerWeb' }
        '502': { description: 'IA_NO_DISPONIBLE', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }

  /servicios-contratados/{servicioContratadoId}/taller-web/bocetos:
    parameters:
      - { name: servicioContratadoId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Taller web]
      operationId: generarBocetoWeb
      summary: 'Captura de la propuesta visual de una página (paso 3): Claude escribe su HTML siguiendo la plantilla de 21st.dev y el navegador lo fotografía. Rehacerla reemplaza la anterior de esa página y dispositivo (sin aprobar). Sin IA o navegador reales, de relleno'
      x-roles: [EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paginaId]
              properties:
                paginaId: { type: string }
                dispositivo: { $ref: '#/components/schemas/DispositivoWeb' }
                prompt: { type: [string, 'null'], maxLength: 30000, description: 'Rehacer con este prompt (8 nov); sin él, el estándar' }
      responses:
        '201':
          description: Captura agregada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoTallerWeb' }
        '409': { description: 'TALLER_SIN_FLUJOGRAMA o LIMITE_BOCETOS', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '422': { $ref: '#/components/responses/Validacion' }
        '502': { description: 'IA_NO_DISPONIBLE o NAVEGADOR_NO_DISPONIBLE', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }

  /servicios-contratados/{servicioContratadoId}/taller-web/documento:
    parameters:
      - { name: servicioContratadoId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Taller web]
      operationId: generarDocumentoWeb
      summary: 'Arma el PDF (alcance, benchmark, flujograma y las capturas aprobadas) y lo deja como entregable (o nueva versión) de la etapa Arquitectura y benchmark, EN_PREPARACION. Se envía al cliente con POST /entregables/{id}/enviar'
      x-roles: [EQUIPO]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nota: { type: [string, 'null'], maxLength: 500 }
      responses:
        '201':
          description: Entregable listo para revisar internamente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoTallerWeb' }
        '409': { description: 'TALLER_INCOMPLETO (sin referencias analizadas ni flujograma) o ENTREGABLE_APROBADO', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }

  /servicios-contratados/{servicioContratadoId}/taller-web/prototipo:
    parameters:
      - { name: servicioContratadoId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Taller web]
      operationId: generarPantallaPrototipo
      summary: 'Genera en Stitch desde el prompt (el guardado o el estándar del flujograma): una pantalla o, con alcance SITIO, todo el sitio en un solo prompt. El paso a Figma lo hace una persona. Sin STITCH_API_KEY, pantalla de relleno'
      x-roles: [EQUIPO]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt: { type: string, maxLength: 30000, description: 'Sin prompt (o vacío), el estándar armado desde el flujograma y la plantilla de 21st.dev. Con Stitch real, antes se crea el sistema de diseño del proyecto con el DESIGN.md (designMd)' }
                alcance: { type: string, enum: [PAGINA, SITIO], default: PAGINA, description: 'SITIO: todas las páginas del flujograma en un solo prompt; Stitch puede devolver varias pantallas y se guardan hasta el tope' }
                sinAprobacion: { type: boolean, description: '9 nov: generar aunque el cliente no haya aprobado la fase 1 (si no, 409 FASE1_SIN_APROBAR)' }
                generador: { type: string, enum: [STITCH, CLAUDE], default: STITCH, description: 'CLAUDE (6 nov): Claude escribe el HTML de cada página con su prompt (con SITIO, una llamada por página) y el navegador lo fotografía' }
                paginaId: { type: string, description: 'Página del flujograma a diseñar (con alcance PAGINA); por defecto, la de entrada' }
                dispositivo: { $ref: '#/components/schemas/DispositivoWeb' }
      responses:
        '201':
          description: Pantalla agregada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoTallerWeb' }
        '409': { description: 'TALLER_SIN_FLUJOGRAMA o LIMITE_PANTALLAS', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '502': { description: 'STITCH_NO_DISPONIBLE', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }

  /servicios-contratados/{servicioContratadoId}/taller-web/estrategia:
    parameters: [ { name: servicioContratadoId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [Taller web]
      operationId: generarEstrategiaWeb
      summary: 'Fase 1 (9 nov): la IA escribe el copywriting (3 heros, textos por página, botones, microcopys y preguntas frecuentes), la matriz de funcionalidades y los pendientes; y la propuesta de valor y los KPIs si faltan'
      x-roles: [EQUIPO]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ResultadoTallerWeb' } } } }
        '409': { $ref: '#/components/responses/Conflicto' }

  /servicios-contratados/{servicioContratadoId}/taller-web/materiales:
    parameters: [ { name: servicioContratadoId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [Taller web]
      operationId: subirMaterialTaller
      summary: 'Sube un archivo del cliente (9 nov): el logo y el manual pasan a ser los del branding; la transcripción y el manual llevan el texto que sacó el navegador, para la IA'
      x-roles: [EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, nombre]
              properties:
                tipo: { $ref: '#/components/schemas/TipoMaterialTaller' }
                nombre: { type: string }
                mime: { type: string }
                base64: { type: string, description: 'El archivo. Logo hasta 5 MB; manual y otros hasta 25 MB; transcripción hasta 10 MB' }
                texto: { type: [string, 'null'], description: 'El texto del archivo (transcripción o manual), sacado en el navegador. La transcripción puede venir solo como texto' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [taller], properties: { taller: { $ref: '#/components/schemas/TallerWeb' } } }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }

  /servicios-contratados/{servicioContratadoId}/taller-web/materiales/{materialId}:
    parameters:
      - { name: servicioContratadoId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: materialId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Taller web]
      operationId: quitarMaterialTaller
      summary: 'Saca un archivo del taller (si era el logo o el manual, deja de usarse en el branding)'
      x-roles: [EQUIPO]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [taller], properties: { taller: { $ref: '#/components/schemas/TallerWeb' } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /servicios-contratados/{servicioContratadoId}/taller-web/brief-desde-transcripcion:
    parameters: [ { name: servicioContratadoId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [Taller web]
      operationId: briefDesdeTranscripcion
      summary: 'DeepSeek llena el brief con la transcripción de la reunión (pegada o la subida) y el manual de marca: objetivo, público, alcance, CMS, mensaje, tono, resumen, secciones, tipografías, colores y los sitios de referencia que se nombraron. Queda como corregido, para revisarlo'
      x-roles: [EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { transcripcion: { type: string, description: 'Si no viene, usa las transcripciones subidas' } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [taller, simulado, completados, referenciasNuevas]
                properties:
                  taller: { $ref: '#/components/schemas/TallerWeb' }
                  simulado: { type: boolean, description: 'true si la IA no estaba disponible y solo se resumió la reunión' }
                  completados: { type: array, items: { type: string } }
                  referenciasNuevas: { type: integer }
        '422': { $ref: '#/components/responses/Validacion' }

  /servicios-contratados/{servicioContratadoId}/taller-web/demos:
    parameters:
      - { name: servicioContratadoId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Taller web]
      operationId: crearDemoWeb
      summary: 'Publica la demo navegable (generada desde el flujograma o el HTML que pega el equipo, siempre sin rastros de IA) en un link que vence, noindex, con límite por IP y vistas contadas. La deja como entregable PROTOTIPO de la etapa Prototipo, EN_PREPARACION'
      x-roles: [EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                origen: { type: string, enum: [GENERAR, HTML], default: GENERAR }
                sinAprobacion: { type: boolean, description: '9 nov: generar aunque el cliente no haya aprobado la fase 1 (si no, 409 FASE1_SIN_APROBAR)' }
                html: { type: string, description: 'Solo con origen HTML (hasta 1,5 MB)' }
                diasVigencia: { type: integer, minimum: 1, maximum: 30, default: 7 }
                nota: { type: [string, 'null'], maxLength: 500 }
      responses:
        '201':
          description: Demo publicada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoTallerWeb' }
        '409': { description: 'TALLER_SIN_FLUJOGRAMA o ENTREGABLE_APROBADO', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '422': { $ref: '#/components/responses/Validacion' }

  /servicios-contratados/{servicioContratadoId}/taller-web/demos/{demoId}:
    parameters:
      - { name: servicioContratadoId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: demoId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Taller web]
      operationId: revocarDemoWeb
      summary: 'Da de baja el link de una demo antes de que venza'
      x-roles: [EQUIPO]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TallerWeb' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /publico/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
    get:
      tags: [Taller web]
      operationId: archivoPublico
      summary: 'Archivo generado por el taller (captura, pantalla, informe o demo) por su enlace con token. Sin sesión. Las demos también se sirven en /demo/{token}: noindex, CSP sandbox, límite por IP y vistas contadas'
      security: []
      responses:
        '200': { description: 'El archivo, con su tipo' }
        '404': { description: 'No existe' }
        '410': { description: 'Venció o se dio de baja' }
        '429': { description: 'Demasiadas solicitudes desde esta IP' }

  /tareas/{tareaId}:
    parameters:
      - { name: tareaId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Servicios]
      operationId: actualizarTarea
      summary: 'Cambiar estado, responsable, fecha, etapa o texto. Un responsable nuevo emite tarea.asignada'
      x-roles: [EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TareaEntrada' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarea' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }
    delete:
      tags: [Servicios]
      operationId: eliminarTarea
      summary: Quitar una tarea creada por error
      x-roles: [EQUIPO]
      responses:
        '204': { description: Eliminada }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /tareas/{tareaId}/comentarios:
    parameters:
      - { name: tareaId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Servicios]
      operationId: listarComentariosTarea
      summary: Conversación interna de la tarea, del más antiguo al más nuevo
      x-roles: [EQUIPO]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/ComentarioTarea' } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    post:
      tags: [Servicios]
      operationId: comentarTarea
      summary: 'Comentar y mencionar a personas del equipo; cada mención emite tarea.mencion (aviso a esa persona)'
      x-roles: [EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto: { type: string, minLength: 2, maxLength: 2000 }
                mencionIds: { type: array, items: { type: string, format: uuid }, description: Personas del equipo }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComentarioTarea' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }

  /panel/clientes:
    get:
      tags: [Panel interno]
      operationId: panelClientes
      summary: Pantalla "Panel general". Indicadores de la agencia, alertas y fila por cliente.
      x-roles: [EQUIPO]
      parameters:
        - { name: periodo, in: query, schema: { $ref: '#/components/schemas/Periodo' } }
        - { name: q, in: query, description: Nombre de marca o contacto, schema: { type: string } }
        - { name: estadoOperativo, in: query, schema: { $ref: '#/components/schemas/EstadoOperativo' } }
        - { name: accountManagerId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [resumen, datos]
                properties:
                  resumen: { $ref: '#/components/schemas/ResumenAgencia' }
                  datos: { type: array, items: { $ref: '#/components/schemas/FilaPanelCliente' } }

  /panel/clientes/exportar:
    get:
      tags: [Panel interno]
      operationId: exportarPanelClientes
      summary: '"Exportar resumen" en CSV con los mismos filtros'
      x-roles: [EQUIPO]
      parameters:
        - { name: periodo, in: query, schema: { $ref: '#/components/schemas/Periodo' } }
        - { name: q, in: query, schema: { type: string } }
        - { name: estadoOperativo, in: query, schema: { $ref: '#/components/schemas/EstadoOperativo' } }
      responses:
        '200':
          description: CSV (UTF-8, separador coma). El frontend lo descarga con fetch + Blob.
          content:
            text/csv:
              schema: { type: string }

  /panel/piezas:
    get:
      tags: [Panel interno]
      operationId: panelBandejaProduccion
      summary: Pantalla "Bandeja de producción". Piezas agrupadas en columnas por estado, de uno o todos los clientes.
      description: |
        Columnas: BORRADOR (BORRADOR + EN_REVISION_INTERNA), EN_REVISION (LISTO_REVISION, esperando al cliente),
        APROBADO, CAMBIOS_SOLICITADOS y PUBLICADO. Cada columna trae hasta `porColumna` piezas y su `total`;
        "Ver las otras N" pide la misma columna con `columna` y `cursor`.
      x-roles: [EQUIPO]
      parameters:
        - { name: clienteId, in: query, schema: { type: string, format: uuid } }
        - { name: periodo, in: query, schema: { $ref: '#/components/schemas/Periodo' } }
        - { name: servicioContratadoId, in: query, schema: { type: string, format: uuid } }
        - { name: origen, in: query, schema: { type: string, enum: [AGENTE, PERSONA] } }
        - { name: columna, in: query, schema: { $ref: '#/components/schemas/ColumnaBandeja' } }
        - { name: porColumna, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BandejaProduccion' }

  /panel/costos-ia:
    get:
      tags: [Panel interno]
      operationId: panelCostosIa
      summary: Costo de IA por cliente y por modelo en el periodo (ADM-01)
      x-roles: [ADMIN]
      parameters:
        - { name: periodo, in: query, required: true, schema: { $ref: '#/components/schemas/Periodo' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReporteCostos' }

  /panel/ejecuciones:
    get:
      tags: [Panel interno]
      operationId: panelEjecuciones
      summary: Ejecuciones de agentes con errores y costo
      x-roles: [ADMIN]
      parameters:
        - { name: clienteId, in: query, schema: { type: string, format: uuid } }
        - { name: agente, in: query, schema: { type: string } }
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoEjecucion' } }
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - properties:
                      datos: { type: array, items: { $ref: '#/components/schemas/Ejecucion' } }

  # ------------------------------------------------------------------ Integraciones (n8n / InooWork)
  /integraciones/ejecuciones:
    post:
      tags: [Integraciones]
      operationId: registrarEjecucion
      summary: n8n abre o cierra una ejecución de agente y reporta consumo por modelo. Idempotente por n8nExecutionId+agente.
      security: [ { apiKey: [] } ]
      x-scopes: [ejecuciones:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EjecucionEntrada' }
            example:
              clienteId: 7f3a9c10-2b4d-4e8f-a1c3-5d7e9f0a2b4c
              agente: contenido-blog
              n8nWorkflowId: wf_12
              n8nExecutionId: '88231'
              piezaId: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
              estado: OK
              consumos:
                - { proveedor: google, modelo: gemini-3.8-flash, tokensEntrada: 52000, tokensSalida: 4100 }
                - { proveedor: openai, modelo: gpt-6.1-sol, tokensEntrada: 15000, tokensSalida: 7600 }
      responses:
        '200':
          description: Registrada. Si el gasto del mes cruza el umbral, `alerta` viene informada (y sale el evento presupuesto.alerta).
          content:
            application/json:
              schema:
                type: object
                required: [ejecucionId, gastoMesUsd, limiteUsd, pctLimite, bloquear]
                properties:
                  ejecucionId: { type: string, format: uuid }
                  gastoMesUsd: { type: number }
                  limiteUsd: { type: number }
                  pctLimite: { type: number }
                  alerta: { type: [string, 'null'], enum: [UMBRAL, LIMITE, null] }
                  bloquear: { type: boolean, description: true si se superó el 100 %; n8n no debe lanzar nuevas ejecuciones no críticas }

  /integraciones/piezas:
    post:
      tags: [Integraciones]
      operationId: crearPiezaDesdeAgente
      summary: Un agente crea una pieza con su primera versión (estado BORRADOR)
      security: [ { apiKey: [] } ]
      x-scopes: [piezas:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PiezaEntradaAgente'
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pieza' }

  /integraciones/piezas/{piezaId}/versiones:
    parameters: [ { $ref: '#/components/parameters/PiezaId' } ]
    post:
      tags: [Integraciones]
      operationId: crearVersionDesdeAgente
      summary: Nueva versión tras CAMBIOS_SOLICITADOS; la pieza vuelve a BORRADOR y luego a EN_REVISION_INTERNA
      security: [ { apiKey: [] } ]
      x-scopes: [piezas:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionEntrada' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionPieza' }

  /integraciones/calendarios:
    post:
      tags: [Integraciones]
      operationId: guardarPropuestaCalendario
      summary: El Jefe de Marketing guarda la propuesta del mes (crea piezas en BORRADOR con fechas y canal)
      security: [ { apiKey: [] } ]
      x-scopes: [piezas:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropuestaCalendario' }
      responses:
        '201':
          description: Creado o nueva versión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calendario' }

  /integraciones/inoowork/sincronizacion:
    post:
      tags: [Integraciones]
      operationId: sincronizarInooWork
      summary: n8n empuja el estado leído de InooWork (personas, proyectos/ítems y tickets). Reemplaza hitos del servicio.
      description: |
        InooWork hoy no emite webhooks y solo expone `GET /api/projects` (todos) y `PUT` del proyecto completo.
        Por defecto n8n consulta cada 5 minutos, calcula diferencias y llama a este endpoint. Si InooWork suma
        webhooks, apuntarán a `/webhooks/inoowork` con el mismo cuerpo.
      security: [ { apiKey: [] } ]
      x-scopes: [inoowork:sync]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SincronizacionInooWork' }
      responses:
        '200':
          description: Aplicada
          content:
            application/json:
              schema:
                type: object
                properties:
                  hitosActualizados: { type: integer }
                  ticketsActualizados: { type: integer }
                  personasCreadas: { type: integer }
                  personasActualizadas: { type: integer }
                  empleadosSinCorreo: { type: array, items: { type: string }, description: 'Empleados de InooWork que no se pudieron crear porque no tienen correo' }

  /webhooks/inoowork:
    post:
      tags: [Integraciones]
      operationId: webhookInooWork
      summary: Entrada futura de webhooks de InooWork (mismo cuerpo que la sincronización), firmada con HMAC
      security: [ { firmaInooWork: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SincronizacionInooWork' }
      responses:
        '204': { description: Aceptado }
        '401': { $ref: '#/components/responses/NoAutenticado' }

webhooks:
  eventoPlataforma:
    post:
      operationId: eventoPlataforma
      summary: Eventos que la API envía a n8n (outbox). Firma HMAC-SHA256 de `<X-Inoo-Timestamp>.<cuerpo>` en `X-Inoo-Firma`.
      description: |
        Entrega al menos una vez, en orden por `id`; el consumidor debe deduplicar por `id`.
        Reintentos con backoff exponencial hasta 24 h.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventoSaliente' }
            example:
              id: 10452
              tipo: pieza.estado_cambiado
              ocurridoEn: '2026-11-04T15:02:11Z'
              clienteId: 7f3a9c10-2b4d-4e8f-a1c3-5d7e9f0a2b4c
              datos: { piezaId: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d, estado: CAMBIOS_SOLICITADOS, usuarioId: 5b0c1e2a-8f3d-4c6b-9a71-2d4e6f8a0b1c, canal: PORTAL, comentario: Cambiar el CTA }
      responses:
        '2XX': { description: Recibido }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ID token o access token de Cognito (pool de equipo o de clientes)
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
    llaveJarvis:
      type: http
      scheme: bearer
      description: 'Llave personal de Jarvis («jv_» + 40 hex), la que se genera en «Mi panel». Solo para la pasarela /ia-equipo; Hermes la manda como API key de OpenAI'
    firmaInooWork:
      type: apiKey
      in: header
      name: X-Inoo-Firma
      description: "sha256=<hex HMAC-SHA256 de `<X-Inoo-Timestamp>.<cuerpo>` con el secreto compartido>. Firmar la marca de tiempo junto al cuerpo impide reenviar un cuerpo viejo con una marca nueva; rechazo si tiene más de 5 min"

  parameters:
    ClienteId: { name: clienteId, in: path, required: true, schema: { type: string, format: uuid } }
    PiezaId: { name: piezaId, in: path, required: true, schema: { type: string, format: uuid } }
    ArchivoId: { name: archivoId, in: path, required: true, schema: { type: string, format: uuid } }
    TicketId: { name: ticketId, in: path, required: true, schema: { type: string, format: uuid } }
    Limite: { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Cursor: { name: cursor, in: query, description: Valor opaco de `paginacion.siguienteCursor`, schema: { type: string } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: UUID generado por el cliente por cada intención (no por cada reintento). Vigencia 24 h.
      schema: { type: string, maxLength: 64 }

  responses:
    NoAutenticado:
      description: Token ausente, vencido o inválido
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    SinPermiso:
      description: Autenticado pero sin permiso para esta acción
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example: { type: 'https://clientes.inoo.pe/errores/sin-permiso', title: Sin permiso, status: 403, codigo: SIN_PERMISO }
    NoEncontrado:
      description: No existe o no es visible para este usuario (no se distingue, para no filtrar datos de otros clientes)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Conflicto:
      description: Estado o versión desactualizados
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: 'https://clientes.inoo.pe/errores/version-desactualizada'
            title: La pieza cambió mientras la revisabas
            status: 409
            codigo: VERSION_DESACTUALIZADA
            detail: Estás aprobando la versión 2 pero la vigente es la 3.
    Validacion:
      description: Datos inválidos
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: 'https://clientes.inoo.pe/errores/validacion'
            title: Hay campos con errores
            status: 422
            codigo: VALIDACION
            errores: [ { campo: declaraDerechos, codigo: REQUERIDO, mensaje: Debes declarar que tienes los derechos de uso } ]

  schemas:
    # ---------- comunes
    Periodo: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', examples: ['2026-11'] }
    Pagina:
      type: object
      required: [datos, paginacion]
      properties:
        datos: { type: array, items: {} }
        paginacion:
          type: object
          required: [siguienteCursor]
          properties:
            siguienteCursor: { type: [string, 'null'] }
            total: { type: integer, description: Total con los filtros aplicados ("4 entregables") }
    Problema:
      type: object
      required: [type, title, status, codigo]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        codigo:
          type: string
          description: Código estable para el frontend
          enum: [NO_AUTENTICADO, SIN_PERMISO, NO_ENCONTRADO, VALIDACION, TRANSICION_INVALIDA, VERSION_DESACTUALIZADA,
                 COMENTARIO_REQUERIDO, DERECHOS_NO_DECLARADOS, ARCHIVO_NO_SUBIDO, ARCHIVO_DEMASIADO_GRANDE,
                 IDEMPOTENCIA_CONFLICTO, LIMITE_PETICIONES, ERROR_INTERNO]
        errores:
          type: array
          items:
            type: object
            required: [campo, codigo]
            properties:
              campo: { type: string }
              codigo: { type: string }
              mensaje: { type: string }
        traceId: { type: string }
    UrlFirmada:
      type: object
      required: [url, expiraEn]
      properties:
        url: { type: string, format: uri }
        expiraEn: { type: string, format: date-time }
        nombreArchivo: { type: string }

    # ---------- enums (mismos valores que la base)
    TipoUsuario: { type: string, enum: [EQUIPO, CLIENTE, SERVICIO] }
    RolEquipo: { type: string, enum: [ACCOUNT_MANAGER, DISENO, AUDIOVISUAL, PAID_MEDIA, DESARROLLO_WEB, ADMIN, FINANZAS], description: 'FINANZAS (reunión 15 oct): ve y cambia el estado de pago de los clientes, junto con ADMIN' }
    RolCliente:
      type: string
      enum: [ADMIN_CLIENTE, APROBADOR, LECTOR]
      description: ADMIN_CLIENTE gestiona usuarios; APROBADOR aprueba, sube y abre tickets; LECTOR solo mira y abre tickets.
    EstadoCliente: { type: string, enum: [ACTIVO, PAUSADO, BAJA] }
    TipoReferencia: { type: string, enum: [MARCA_ADMIRADA, COMPETIDOR, PIEZA_EJEMPLO, MANUAL_MARCA, LOGO, OTRO] }
    EstadoRequerimiento:
      type: string
      description: 'PENDIENTE: el cliente aún no lo envía · ENVIADO: espera revisión del equipo · OBSERVADO: el equipo pidió corregir algo · APROBADO: listo'
      enum: [PENDIENTE, ENVIADO, OBSERVADO, APROBADO]
    TipoCampo: { type: string, description: 'OPCIONES = selección múltiple (lista de opciones elegidas)', enum: [TEXTO, TEXTO_LARGO, LISTA, URL, OPCION, OPCIONES, SI_NO, ARCHIVOS, NUMERO, FECHA] }
    CodigoServicio:
      type: string
      description: Servicios que vende Inoo (reunión del 12 oct 2026). Blog y Estáticos ya no son servicios.
      enum: [SOCIAL_MEDIA_PRO, BRANDFORMANCE, PAID_MEDIA, WEB, CRM_IMPLEMENTACION, CRM_INTEGRACION, AUDIOVISUAL, SOPORTE_CONTINUO]
    ModalidadServicio: { type: string, enum: [MENSUAL, PROYECTO], description: 'MENSUAL repite sus etapas cada mes; PROYECTO las recorre una vez' }
    EstadoServicio: { type: string, enum: [ACTIVO, PAUSADO, STANDBY, FINALIZADO], description: 'STANDBY: el cliente no usó el portal en 30 días; vuelve a ACTIVO solo cuando lo usa' }
    MetricaProyecto: { type: string, enum: [REUNIONES_REALIZADAS, REUNIONES_EXITOSAS, DOCUMENTOS_A_TIEMPO, PIEZAS_APROBADAS, TICKETS_RESUELTOS, RESULTADOS_CAMPANA] }
    EstadoOperativo:
      type: string
      enum: [AL_DIA, EN_CURSO, ATENCION]
      description: 'Calculado. ATENCION si hay piezas atrasadas, tickets fuera de SLA o gasto de IA ≥ umbral; AL_DIA si no hay nada pendiente; EN_CURSO en otro caso.'
    ColumnaBandeja: { type: string, enum: [BORRADOR, EN_REVISION, APROBADO, CAMBIOS_SOLICITADOS, PUBLICADO] }
    TipoPieza: { type: string, enum: [BLOG, COPY, ESTATICO, CARRUSEL, PORTADA, GUION, SHOTLIST, STORYBOARD, PROTOTIPO_WEB, ANUNCIO, REPORTE] }
    EstadoPieza:
      type: string
      enum: [BORRADOR, EN_REVISION_INTERNA, LISTO_REVISION, APROBADO_CLIENTE, CAMBIOS_SOLICITADOS, PUBLICADO, EN_PRODUCCION]
      description: |
        `EN_PRODUCCION` solo aparece en respuestas a usuarios CLIENTE: reemplaza a BORRADOR y EN_REVISION_INTERNA.
        Etiquetas para la UI: EN_PRODUCCION «En producción», LISTO_REVISION «Listo para revisión»,
        APROBADO_CLIENTE «Aprobada», CAMBIOS_SOLICITADOS «Cambios solicitados», PUBLICADO «Publicado».
    AccionPieza:
      type: string
      enum: [APROBAR, SOLICITAR_CAMBIOS, COMENTAR, DESCARGAR, ENVIAR_REVISION_INTERNA, LIBERAR_A_CLIENTE, RETIRAR, MARCAR_PUBLICADO, SUBIR_VERSION]
    EstadoCalendario: { type: string, enum: [PROPUESTO, CAMBIOS_SOLICITADOS, APROBADO_PLAN] }
    EstadoIdea: { type: string, enum: [PROPUESTA, ELEGIDA, DESCARTADA] }
    CanalDecision: { type: string, enum: [PORTAL, PANEL, TELEGRAM, SLACK, SISTEMA] }
    CategoriaTicket: { type: string, enum: [MARKETING, DISENO, WEB, CRM, FACTURACION, OTRO] }
    UrgenciaTicket: { type: string, enum: [BAJA, MEDIA, ALTA, CRITICA] }
    EstadoTicket: { type: string, enum: [ABIERTO, EN_PROCESO, ESPERANDO_CLIENTE, RESUELTO, CERRADO] }
    EstadoHito: { type: string, enum: [SIN_INICIAR, EN_PROGRESO, EN_REVISION, COMPLETADO, BLOQUEADO] }
    EstadoEjecucion: { type: string, enum: [EN_CURSO, OK, ERROR, CANCELADA] }

    # ---------- sesión y clientes
    Usuario:
      type: object
      required: [id, nombre, email, tipo]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        email: { type: string, format: email }
        cargo: { type: [string, 'null'], examples: [Administradora] }
        iniciales: { type: string, examples: [VM] }
        tipo: { $ref: '#/components/schemas/TipoUsuario' }
        rolEquipo: { oneOf: [ { $ref: '#/components/schemas/RolEquipo' }, { type: 'null' } ] }
        area: { oneOf: [ { $ref: '#/components/schemas/AreaEquipo' }, { type: 'null' } ] }
        nivelAcceso: { oneOf: [ { $ref: '#/components/schemas/NivelAcceso' }, { type: 'null' } ], description: 'Solo equipo: su nivel efectivo' }
        esLead: { type: boolean }
        esSuperUsuario: { type: boolean, description: 'Solo equipo: por encima de ADMIN; cambia niveles, permisos y quién es ADMIN' }
        esPrueba: { type: boolean, description: 'Entorno de pruebas (6 nov): solo ve y toca datos de prueba' }
        esCuentaPruebas: { type: boolean, description: 'La cuenta pruebas@inoo.pe: solo elige con qué usuario de prueba entrar' }
        permisos: { type: array, items: { $ref: '#/components/schemas/PermisoEquipo' }, description: 'Solo equipo: sus permisos efectivos' }
    PersonaMini:
      type: object
      required: [id, nombre]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        cargo: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
    InactividadCliente:
      type: object
      description: 'Actividad del cliente en el portal y standby (solo equipo)'
      required: [ultimaActividad, diasSinActividad, fechaStandby, estado, serviciosEnStandby]
      properties:
        ultimaActividad: { type: string, format: date-time }
        diasSinActividad: { type: integer }
        fechaStandby: { type: string, format: date, description: 'Cuándo pasarían sus servicios a standby si nadie entra' }
        estado: { type: string, enum: [ACTIVO, POR_ENTRAR, STANDBY], description: 'POR_ENTRAR: faltan 7 días o menos (ya se avisó)' }
        serviciosEnStandby: { type: integer }
    Sesion:
      type: object
      required: [usuario, clientes, notificacionesSinLeer]
      properties:
        usuario: { $ref: '#/components/schemas/Usuario' }
        notificacionesSinLeer: { type: integer, description: Punto de la campana }
        clientes:
          type: array
          description: Para EQUIPO viene vacío (ve todos vía /clientes)
          items:
            type: object
            required: [clienteId, nombre, rol]
            properties:
              clienteId: { type: string, format: uuid }
              nombre: { type: string }
              rol: { $ref: '#/components/schemas/RolCliente' }
    Notificacion:
      type: object
      required: [id, tipo, titulo, leida, creadoEn]
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, enum: [AVISO, PIEZAS_LISTAS, PIEZA_APROBADA, CAMBIOS_REGISTRADOS, TICKET_CREADO, TICKET_RESPONDIDO, TICKET_RESUELTO, BRIEF_RECIBIDO, ALERTA_GASTO_IA] }
        clienteId: { type: [string, 'null'], format: uuid }
        titulo: { type: string }
        cuerpo: { type: [string, 'null'] }
        enlace: { type: [string, 'null'], description: Ruta interna del portal }
        leida: { type: boolean }
        creadoEn: { type: string, format: date-time }
    Marca:
      type: object
      properties:
        descripcion: { type: string }
        mensajeCentral: { type: string, examples: [Cuida tu piel. Vuelve a ti.] }
        campanaActual: { type: string, examples: ['Campaña de octubre: «Tu ritual, tu momento».'] }
        valores: { type: array, items: { type: string } }
        paleta: { type: array, items: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' } }
        tipografias: { type: array, items: { type: string } }
        logoArchivoId: { type: [string, 'null'], format: uuid }
    Tono:
      type: object
      properties:
        etiquetas: { type: array, items: { type: string }, examples: [[Cercano, Consciente, Sereno]] }
        descripcion: { type: string }
        ejemplo: { type: string, examples: ['«Entre tantos pendientes, regálate una pausa.»'] }
    Publico:
      type: object
      properties:
        descripcion: { type: string }
        intereses: { type: array, items: { type: string } }
        segmentos: { type: [string, 'null'] }
    ClienteEntrada:
      type: object
      properties:
        nombre: { type: string, minLength: 2 }
        responsableProyectosId: { type: string, format: uuid, description: 'Solo en el alta: quién de Inoo lleva los proyectos que se crean desde el ingreso' }
        marca: { $ref: '#/components/schemas/Marca' }
        tono: { $ref: '#/components/schemas/Tono' }
        publico: { $ref: '#/components/schemas/Publico' }
        contactoPrincipalId: { type: string, format: uuid }
        pilaresContenido: { type: array, items: { type: string } }
        canales: { type: array, items: { type: string, enum: [INSTAGRAM, FACEBOOK, LINKEDIN, TIKTOK, YOUTUBE, BLOG, WEB] } }
        wordpressUrl: { type: [string, 'null'], format: uri }
        fechaAniversario: { type: [string, 'null'], format: date, description: 'Desde cuándo trabajamos juntos (día del aniversario)' }
        contacto:
          type: object
          description: 'Solo al crear: crea el acceso al portal de su responsable como ADMIN_CLIENTE (invitación por correo) y lo deja como contacto principal'
          required: [nombre, email]
          properties:
            nombre: { type: string, minLength: 3 }
            email: { type: string, format: email }
            cargo: { type: string }
        accountManagerId: { type: string, format: uuid }
        limiteGastoIaUsd: { type: number, minimum: 0, description: Solo ADMIN }
        estado: { $ref: '#/components/schemas/EstadoCliente' }
        ingreso:
          type: object
          description: 'Respuestas del ingreso de cliente que llena Comercial en el alta (antes, el formulario de Monday). Preguntas en GET /formularios/ingreso-cliente; reemplaza el ingreso anterior'
          additionalProperties: true
    ClienteResumen:
      type: object
      required: [id, nombre, estado]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        slug: { type: string }
        estado: { $ref: '#/components/schemas/EstadoCliente' }
        logoUrl: { type: [string, 'null'], format: uri }
        acceso: { type: string, enum: [COMPLETO, PROYECTOS], description: 'Equipo: COMPLETO ve toda la cuenta; PROYECTOS solo sus proyectos y la marca' }
    Cliente:
      description: Ficha de cliente (panel) y perfil (portal)
      allOf:
        - $ref: '#/components/schemas/ClienteResumen'
        - type: object
          properties:
            marca: { $ref: '#/components/schemas/Marca' }
            tono: { $ref: '#/components/schemas/Tono' }
            publico: { $ref: '#/components/schemas/Publico' }
            pilaresContenido: { type: array, items: { type: string } }
            canales: { type: array, items: { type: string } }
            wordpressUrl: { type: [string, 'null'] }
            fechaAniversario: { type: [string, 'null'], format: date }
            plan: { oneOf: [ { $ref: '#/components/schemas/PlanCliente' }, { type: 'null' } ] }
            contactoPrincipal: { oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ] }
            accountManager:
              description: '"Tu equipo de contacto" en el portal y "Responsable de cuenta" en la ficha'
              oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ]
            conteos:
              type: object
              properties:
                serviciosActivos: { type: integer }
                aprobacionesPendientes: { type: integer }
            driveUrl: { type: [string, 'null'], format: uri, description: Solo equipo }
            driveCarpetaId: { type: [string, 'null'], description: Solo equipo }
            limiteGastoIaUsd: { type: number, description: Solo equipo }
            inactividad: { $ref: '#/components/schemas/InactividadCliente' }
            ingreso: { oneOf: [ { $ref: '#/components/schemas/IngresoCliente' }, { type: 'null' } ], description: Solo equipo }
            creadoEn: { type: string, format: date-time }
    IngresoCliente:
      type: object
      required: [respuestas, registradoEn]
      properties:
        respuestas: { type: object, additionalProperties: true, description: 'Solo las de preguntas visibles según el camino elegido' }
        registradoEn: { type: string, format: date-time }
        registradoPor: { oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ] }
    InicioCliente:
      type: object
      required: [periodo, indicadores, avanceMes, pendientes, servicios, ticketsAbiertos]
      properties:
        periodo: { $ref: '#/components/schemas/Periodo' }
        indicadores:
          type: object
          required: [serviciosActivos, porAprobar, ticketsAbiertos, requerimientosPendientes]
          properties:
            serviciosActivos: { type: integer }
            porAprobar: { type: integer, description: 'Piezas y entregables que esperan su revisión. También es el contador del menú "Entregables por revisar"' }
            ticketsAbiertos: { type: integer }
            ideasPorElegir: { type: integer }
            requerimientosPendientes: { type: integer, description: 'Lo que la agencia le pidió al cliente y aún no entrega' }
        cuenta:
          type: object
          description: '"Tu cuenta": lo esencial de la ficha que ve el cliente'
          required: [nombre]
          properties:
            nombre: { type: string }
            contactoPrincipal: { oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ] }
            responsable: { oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ], description: 'Responsable de cuenta en Inoo ("Tu equipo Inoo")' }
            driveUrl: { type: [string, 'null'], format: uri }
            enlaceCosmiq: { type: [string, 'null'], format: uri, description: 'Enlace a su cuenta en Cosmiq si tiene un proyecto de CRM vigente que lo lleva; si no, null. El portal lo muestra en el menú del cliente' }
        avisoPago:
          description: 'Solo si está atrasado, sin montos (reunión 15 oct). Solo para ADMIN_CLIENTE, ADMIN y FINANZAS; si no, null.'
          type: [object, 'null']
          required: [situacion, diasAtraso]
          properties:
            situacion: { type: string, enum: [ATRASADO] }
            diasAtraso: { type: integer, minimum: 0 }
        marca:
          description: 'Solo si tiene Social Media Pro, Brandformance o Paid Media; si no, null'
          type: [object, 'null']
          properties:
            mensajeCentral: { type: [string, 'null'] }
            campanaActual: { type: [string, 'null'] }
            descripcion: { type: [string, 'null'] }
            tono: { type: array, items: { type: string } }
            publico: { type: [string, 'null'] }
        avisos:
          type: array
          description: 'Avisos visibles hoy (feriados próximos, días no laborables, aniversario, generales)'
          items: { $ref: '#/components/schemas/Aviso' }
        actividad:
          type: array
          description: 'Actividad reciente, breve (máximo 4): aprobaciones, etapas terminadas y requerimientos'
          items:
            type: object
            required: [fecha, texto, tipo]
            properties:
              fecha: { type: string, format: date-time }
              texto: { type: string, examples: ['Aprobaste «Cuida tu piel. Vuelve a ti.»'] }
              tipo: { type: string, enum: [APROBACION, ETAPA, REQUERIMIENTO, PUBLICACION] }
        plan: { oneOf: [ { $ref: '#/components/schemas/PlanCliente' }, { type: 'null' } ] }
        avanceMes: { $ref: '#/components/schemas/ProgresoPiezas' }
        pendientes: { type: array, description: 'Piezas en LISTO_REVISION, ordenadas por fecha', items: { $ref: '#/components/schemas/PiezaResumen' } }
        servicios:
          type: array
          description: Solo los contratados
          items:
            type: object
            required: [codigo, nombre, titulo, servicioContratadoId, cantidadMensual, unidad, estado, avance]
            properties:
              codigo: { $ref: '#/components/schemas/CodigoServicio' }
              nombre: { type: string }
              titulo: { type: string, examples: [Implementación de CRM - Casa Oliva] }
              servicioContratadoId: { type: string, format: uuid }
              cantidadMensual: { type: integer }
              unidad: { type: string }
              estado: { $ref: '#/components/schemas/EstadoServicio' }
              avance: { $ref: '#/components/schemas/AvanceProyecto' }
              responsable: { oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ], description: Responsable del servicio en Inoo }
              siguientePaso: { type: [string, 'null'], description: 'Qué sigue en el proyecto, en minúscula para leerse tras «Qué sigue:» (2 nov: el inicio del cliente se centra en el avance)' }
        proximaPublicacion:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            titulo: { type: string }
            fechaProgramada: { type: string, format: date-time }
        ticketsAbiertos:
          type: array
          items:
            type: object
            required: [id, codigo, asunto, estado]
            properties:
              id: { type: string, format: uuid }
              codigo: { type: string }
              asunto: { type: string }
              estado: { $ref: '#/components/schemas/EstadoTicket' }
    Aviso:
      type: object
      required: [id, tipo, titulo, fechaInicio, fechaFin]
      properties:
        id: { type: string, description: 'uuid; el aniversario calculado usa «aniversario-<clienteId>»' }
        clienteId: { type: [string, 'null'], format: uuid }
        tipo: { type: string, enum: [FERIADO, NO_LABORABLE, ANIVERSARIO, GENERAL] }
        titulo: { type: string, examples: [Combate de Angamos] }
        mensaje: { type: [string, 'null'] }
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date }
        visibleDesde: { type: string, format: date }
    SituacionPago: { type: string, enum: [AL_DIA, ATRASADO] }
    FormatoEntregable: { type: string, enum: [PDF, IMAGEN, ENLACE, PROTOTIPO, DOCUMENTO] }
    EstadoEntregable:
      type: string
      enum: [EN_PREPARACION, LISTO_REVISION, CAMBIOS_SOLICITADOS, APROBADO]
      description: 'El cliente nunca ve EN_PREPARACION: si ya se le envió una versión y el equipo prepara otra, le llega CAMBIOS_SOLICITADOS («Revisado»)'
    Entregable:
      type: object
      required: [id, servicioContratadoId, servicioTitulo, titulo, formato, estado, version, rebotes, atrasado, diasAtrasoRevision, creadoEn]
      properties:
        id: { type: string, format: uuid }
        servicioContratadoId: { type: string, format: uuid }
        servicioTitulo: { type: string, examples: [Diseño y desarrollo web - Casa Oliva] }
        etapaId: { type: [string, 'null'], format: uuid }
        etapaNombre: { type: [string, 'null'] }
        titulo: { type: string, examples: [Flujograma y benchmark de referencias] }
        descripcion: { type: [string, 'null'] }
        formato: { $ref: '#/components/schemas/FormatoEntregable' }
        estado: { $ref: '#/components/schemas/EstadoEntregable' }
        version: { type: integer, description: 'Vigente; para el cliente, la última que se le envió' }
        url: { type: [string, 'null'], description: 'Archivo o enlace de esa versión (PDF, imagen, prototipo)' }
        nombreArchivo: { type: [string, 'null'] }
        rebotes: { type: integer, description: 'Veces que el cliente pidió cambios (KPI de la reunión 15 oct)' }
        atrasado: { type: boolean, description: 'LISTO_REVISION y el cliente no lo revisó en su plazo' }
        diasAtrasoRevision: { type: integer, minimum: 0 }
        enviadoEn: { type: [string, 'null'], format: date-time }
        aprobadoEn: { type: [string, 'null'], format: date-time }
        creadoEn: { type: string, format: date-time }
    DispositivoWeb: { type: string, enum: [ESCRITORIO, MOVIL] }
    DimensionBenchmark:
      type: string
      enum: [IDENTIDAD_VISUAL, JERARQUIA_VISUAL, USABILIDAD_MOVIL, ARQUITECTURA_INFORMACION, PROPUESTA_VALOR, FICHA_PRODUCTO, FLUJO_COMPRA, CONVERSION]
    PuntajeBenchmark:
      type: object
      required: [dimension, puntaje, comentario]
      properties:
        dimension: { $ref: '#/components/schemas/DimensionBenchmark' }
        puntaje: { type: integer, minimum: 1, maximum: 5 }
        comentario: { type: string, maxLength: 160, examples: [Menú claro, bien segmentado] }
    ReferenciaWeb:
      type: object
      required: [id, nombre, url, origen, capturas, puntajes, resumen, analizadaEn, puntajeGlobal]
      properties:
        id: { type: string }
        nombre: { type: string, examples: [Aesop] }
        url: { type: string, examples: ['https://www.aesop.com/'] }
        origen: { type: string, enum: [BRIEF, EQUIPO], description: 'BRIEF = salió de «Sitios que te gustan» del brief web' }
        capturas:
          type: array
          items:
            type: object
            required: [tipo, url, simulada]
            properties:
              tipo: { $ref: '#/components/schemas/DispositivoWeb' }
              url: { type: string, description: 'Enlace /api/v1/publico/{token} o data: URI (las de relleno)' }
              simulada: { type: boolean }
        puntajes: { type: array, items: { $ref: '#/components/schemas/PuntajeBenchmark' } }
        resumen: { type: [string, 'null'] }
        analizadaEn: { type: [string, 'null'], format: date-time }
        puntajeGlobal: { type: [number, 'null'], description: Promedio de los puntajes con un decimal }
        marcas: { type: array, items: { $ref: '#/components/schemas/MarcaCaptura' }, description: '9 nov: puntos numerados sobre las capturas (verde lo que tomamos, rojo lo que evitamos)' }
    PuntoTaller:
      type: object
      required: [titulo, texto]
      properties:
        titulo: { type: string, maxLength: 80 }
        texto: { type: string, maxLength: 400 }
    PaginaFlujograma:
      type: object
      required: [id, titulo, descripcion, nivel, padreId, secciones]
      properties:
        id: { type: string, examples: [ficha-producto] }
        titulo: { type: string }
        descripcion: { type: string }
        nivel: { type: integer, minimum: 0, maximum: 3, description: '0 = entrada (una sola), 1 = menú principal…' }
        padreId: { type: [string, 'null'] }
        secciones: { type: array, items: { type: string }, maxItems: 12, description: Flujograma estructural (de arriba hacia abajo) }
    PantallaPrototipo:
      type: object
      required: [id, nombre, dispositivo, imagenUrl, conHtml, simulada, creadaEn]
      properties:
        id: { type: string }
        nombre: { type: string }
        dispositivo: { $ref: '#/components/schemas/DispositivoWeb' }
        imagenUrl: { type: string }
        conHtml: { type: boolean, description: Stitch devolvió también el HTML (se usa como guía de la demo) }
        paginaId: { type: [string, 'null'], description: Página del flujograma que se diseñó }
        prompt: { type: string, description: El prompt exacto que recibió el generador }
        generador: { type: string, enum: [STITCH, CLAUDE], description: Quién la dibujó (las anteriores al 6 nov no lo dicen y son de Stitch) }
        simulada: { type: boolean }
        creadaEn: { type: string, format: date-time }
    DemoWeb:
      type: object
      required: [id, url, venceEn, vistas, revocada, simulada, creadaEn]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, examples: ['/demo/3f2a…'] }
        venceEn: { type: string, format: date-time }
        vistas: { type: integer }
        revocada: { type: boolean }
        simulada: { type: boolean }
        creadaEn: { type: string, format: date-time }
    ResumenEntregableTaller:
      type: object
      required: [id, titulo, estado, version, formato]
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string }
        estado: { $ref: '#/components/schemas/EstadoEntregable' }
        version: { type: integer }
        formato: { $ref: '#/components/schemas/FormatoEntregable' }
    MarcaCaptura:
      type: object
      required: [n, tipo, captura, x, y, texto]
      properties:
        n: { type: integer, description: 'Número de la marca (primero lo que tomamos)' }
        tipo: { type: string, enum: [TOMAR, EVITAR] }
        captura: { $ref: '#/components/schemas/DispositivoWeb' }
        x: { type: number, description: 'Porcentaje desde la izquierda (2 a 98)' }
        y: { type: number, description: 'Porcentaje desde arriba (2 a 98)' }
        texto: { type: string, maxLength: 200 }
    EstrategiaWeb:
      type: object
      description: 'Fase 1 (9 nov): lo que pide el proyecto, el copywriting, la matriz de funcionalidades y los pendientes por validar'
      required: [especificaciones, copy, funcionalidades, pendientes, generadaEn]
      properties:
        especificaciones:
          type: object
          required: [catalogo, whatsapp]
          properties:
            catalogo:
              type: object
              required: [categorias, atributos, conPrecio, cantidad]
              properties:
                categorias: { type: array, items: { type: string } }
                atributos: { type: array, items: { type: string } }
                conPrecio: { type: [boolean, 'null'] }
                cantidad: { type: [integer, 'null'] }
            whatsapp:
              type: object
              required: [numero, campos]
              properties:
                numero: { type: [string, 'null'] }
                campos: { type: array, items: { type: object, required: [nombre, obligatorio], properties: { nombre: { type: string }, obligatorio: { type: boolean } } } }
        copy:
          oneOf:
            - type: object
              required: [heros, paginas, ctas, microcopys, faq]
              properties:
                heros: { type: array, items: { type: object, required: [titulo, subtitulo, cta], properties: { titulo: { type: string }, subtitulo: { type: string }, cta: { type: string } } } }
                paginas: { type: array, items: { type: object, required: [pagina, bloques], properties: { pagina: { type: string }, bloques: { type: array, items: { type: object, required: [nombre, texto], properties: { nombre: { type: string }, texto: { type: string } } } } } } }
                ctas: { type: array, items: { type: string } }
                microcopys: { type: array, items: { type: object, required: [momento, texto], properties: { momento: { type: string }, texto: { type: string } } } }
                faq: { type: array, items: { type: object, required: [pregunta, respuesta], properties: { pregunta: { type: string }, respuesta: { type: string } } } }
            - type: 'null'
        funcionalidades: { type: array, items: { type: object, required: [nombre, descripcion, prioridad], properties: { nombre: { type: string }, descripcion: { type: string }, prioridad: { type: string, enum: [IMPRESCINDIBLE, DESEABLE] } } } }
        pendientes: { type: array, items: { type: string } }
        generadaEn: { type: [string, 'null'], format: date-time }
    TipoMaterialTaller: { type: string, enum: [LOGO, MANUAL, TRANSCRIPCION, OTRO] }
    MaterialTaller:
      type: object
      required: [id, tipo, nombre, mime, url, bytes, conTexto, creadoEn]
      properties:
        id: { type: string }
        tipo: { $ref: '#/components/schemas/TipoMaterialTaller' }
        nombre: { type: string }
        mime: { type: string }
        url: { type: string, description: 'Enlace público con token (vacío si la transcripción llegó solo como texto)' }
        bytes: { type: integer }
        conTexto: { type: boolean, description: 'Si se guardó su texto para la IA' }
        creadoEn: { type: string, format: date-time }

    TallerWeb:
      type: object
      description: 'Solo equipo. Es la IA de Inoo: el cliente no lo ve; le llegan el PDF y la demo como entregables'
      required: [servicioContratadoId, servicioTitulo, variante, version, insumos, insumosEditados, materiales, estrategia, fase1, dimensiones, referencias, hallazgos, recomendaciones, flujograma, prototipo, plantilla, bocetos, documento, demoEntregable, demos, modos, actualizadoEn]
      properties:
        servicioContratadoId: { type: string, format: uuid }
        servicioTitulo: { type: string }
        variante: { type: [string, 'null'] }
        version: { type: integer, description: 'Para PUT: 409 VERSION_DESACTUALIZADA si otra persona guardó antes' }
