  /jarvis/propuestas:
    post:
      tags: [Jarvis del equipo]
      operationId: proponerAccionJarvis
      summary: 'Jarvis propone una acción (tarea, comentario interno o pendiente del calendario); su dueño la aprueba en el chat'
      description: |
        Solo para el Hermes del área, con su clave y X-Jarvis-Conversacion: es lo único que Jarvis puede mandar por POST.
        No hace nada todavía: queda PENDIENTE hasta que la persona dueña de la conversación decide. Lo que esa persona
        no vería (un proyecto ajeno) da 404. Hasta 10 pendientes por persona.
      x-roles: [EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, datos]
              properties:
                tipo: { type: string, enum: [CREAR_TAREA, COMENTAR_PROYECTO, CREAR_PENDIENTE] }
                datos:
                  type: object
                  description: |
                    CREAR_TAREA: servicioContratadoId, titulo, descripcion?, responsableId?, fechaLimite? (AAAA-MM-DD).
                    COMENTAR_PROYECTO: servicioContratadoId, texto (siempre interno). CREAR_PENDIENTE: titulo, fecha, notas?.
                  additionalProperties: true
      responses:
        '201':
          description: Propuesta guardada, sin hacer
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/AccionJarvis' }
                  - type: object
                    required: [mensaje]
                    properties:
                      mensaje: { type: string }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { description: Demasiadas propuestas sin decidir }
        '422': { $ref: '#/components/responses/Validacion' }

