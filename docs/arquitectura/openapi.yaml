openapi: 3.1.0
info:
  title: API Portal de Clientes y Oficina Virtual (Inoo)
  version: 1.1.0
  summary: Contrato compartido entre backend, portal Next.js (cliente + panel interno) y n8n.
  description: |
    Contrato v1 de la API que usan el portal de clientes, el panel interno y las integraciones
    (n8n, InooWork). Basado en el PRD del 3 oct 2026 y el backlog v1.0.

    **v1.1 (6 oct 2026)**: ajustado a las pantallas de Figma del portal (inicio, servicios, entregables,
    detalle de pieza, blog, calendario, brief, resultados, avance, soporte, notificaciones, panel general,
    bandeja de producción y ficha de cliente).

    ## Convenciones
    - **JSON en camelCase**, fechas ISO 8601 en UTC (`2026-11-03T15:00:00Z`), periodos mensuales `AAAA-MM`.
    - **IDs** son UUID, salvo `numero` de ticket (se muestra como `TCK-000123`).
    - **Dinero** en USD como número con hasta 4 decimales (solo para mostrar; no se cobra nada con esta API).
    - **Listas paginadas por cursor**: `?limite=20&cursor=...` → `{ "datos": [...], "paginacion": { "siguienteCursor": "..." | null, "total": 4 } }`.
    - **Errores** en `application/problem+json` (RFC 9457) con un `codigo` estable para que el frontend traduzca.
    - **Idempotencia**: los POST que crean o deciden algo aceptan `Idempotency-Key`; reintentar con la misma clave devuelve la misma respuesta.
    - **Visibilidad**: `x-roles` indica quién puede llamar. Un usuario CLIENTE solo ve clientes de los que es miembro.
      Los campos marcados "solo equipo" no se envían a usuarios CLIENTE (el backend los omite, no los manda en null).
      Un CLIENTE sí ve en listas y calendario las piezas que se están produciendo, pero con `estado: EN_PRODUCCION`
      y sin contenido; solo ve el contenido de las versiones que el equipo le envió a revisión.

    ## Autenticación
    - Portal y panel: `Authorization: Bearer <JWT de Cognito>`. Dos user pools (equipo y clientes); el backend
      acepta ambos y resuelve el usuario con `GET /me`.
    - n8n y sincronización InooWork: `X-Api-Key`, con scopes.
    - Webhooks entrantes de InooWork: firma HMAC-SHA256 en `X-Inoo-Firma`.
servers:
  - url: https://clientes.inoo.pe/api/v1
    description: Producción (dominio propuesto en el PRD, pendiente de confirmar)
  - url: http://localhost:3000/api/v1
    description: Desarrollo local
security:
  - bearerAuth: []
tags:
  - name: Sesión
  - name: Clientes
  - name: Referencias y briefs
  - name: Servicios
  - name: Piezas
  - name: Planificación
  - name: Archivos
  - name: Paid media
  - name: Reportes
  - name: Soporte
  - name: Correos
  - name: Panel interno
  - name: Integraciones

paths:
  # ------------------------------------------------------------------ Sesión
  /me:
    get:
      tags: [Sesión]
      operationId: obtenerSesion
      summary: Usuario actual, su tipo y los clientes a los que tiene acceso
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
              example:
                usuario: { id: 5b0c1e2a-8f3d-4c6b-9a71-2d4e6f8a0b1c, nombre: Valeria Mendoza, email: valeria@casaoliva.pe, cargo: Administradora, iniciales: VM, tipo: CLIENTE, rolEquipo: null }
                notificacionesSinLeer: 1
                clientes:
                  - { clienteId: 7f3a9c10-2b4d-4e8f-a1c3-5d7e9f0a2b4c, nombre: Casa Oliva, rol: ADMIN_CLIENTE }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  # ------------------------------------------------------------------ Clientes
  /me/notificaciones:
    get:
      tags: [Sesión]
      operationId: listarNotificaciones
      summary: Notificaciones de la campana (más recientes primero)
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: noLeidas, in: query, schema: { type: boolean, default: false } }
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - properties:
                      datos: { type: array, items: { $ref: '#/components/schemas/Notificacion' } }
              example:
                datos:
                  - { id: 0c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f, tipo: PIEZAS_LISTAS, titulo: Tienes contenido nuevo, cuerpo: 4 piezas listas para revisión. Revisa el contenido de octubre., enlace: /entregables, leida: false, creadoEn: '2026-10-06T13:00:00Z' }
                paginacion: { siguienteCursor: null, total: 1 }

  /me/notificaciones/leer:
    post:
      tags: [Sesión]
      operationId: marcarNotificacionesLeidas
      summary: Marcar como leídas (las indicadas o todas)
      x-roles: [EQUIPO, CLIENTE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: string, format: uuid } }
                todas: { type: boolean, default: false }
      responses:
        '204': { description: Marcadas }

  /servicios:
    get:
      tags: [Servicios]
      operationId: listarCatalogoServicios
      summary: Catálogo de servicios de la agencia (para mostrar también los no contratados)
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/ServicioCatalogo' } }
  /clientes:
    get:
      tags: [Clientes]
      operationId: listarClientes
      summary: Clientes visibles para el usuario (equipo ve todos; cliente ve los suyos)
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoCliente' } }
        - { name: q, in: query, description: Búsqueda por nombre, schema: { type: string } }
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - properties:
                      datos: { type: array, items: { $ref: '#/components/schemas/ClienteResumen' } }
    post:
      tags: [Clientes]
      operationId: crearCliente
      summary: Alta de cliente (CU-01). Dispara la creación de carpetas en Drive vía n8n.
      x-roles: [ACCOUNT_MANAGER, ADMIN]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClienteEntrada' }
      responses:
        '201':
          description: Creado. `driveCarpetaId` llega en null y se completa cuando n8n termina (evento `cliente.creado`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }

  /clientes/{clienteId}:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Clientes]
      operationId: obtenerCliente
      summary: Perfil del cliente (CLI-01)
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Clientes]
      operationId: actualizarCliente
      summary: Editar perfil (merge parcial)
      x-roles: [ACCOUNT_MANAGER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClienteEntrada' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '422': { $ref: '#/components/responses/Validacion' }

  /clientes/{clienteId}/inicio:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Clientes]
      operationId: obtenerInicioCliente
      summary: Todo lo que pinta la pantalla de Inicio del portal en una sola llamada
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: periodo, in: query, description: Por defecto el mes actual (America/Lima), schema: { $ref: '#/components/schemas/Periodo' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InicioCliente' }
              example:
                periodo: '2026-10'
                indicadores: { serviciosActivos: 3, porAprobar: 4, ticketsAbiertos: 2 }
                plan: { nombre: Plan Crecimiento, fechaFin: '2026-12-31' }
                avanceMes: { totales: 20, aprobadas: 12, publicadas: 3, porRevisar: 4, enProduccion: 4, porcentaje: 60 }
                pendientes:
                  - { id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d, tipo: CARRUSEL, titulo: 'Tu ritual, tu momento', canal: INSTAGRAM, periodo: '2026-10', fechaProgramada: '2026-10-08T14:00:00Z', estado: LISTO_REVISION, miniaturaUrl: 'https://archivos.inoo.pe/firmado/ritual.png', actualizadoEn: '2026-10-05T15:30:00Z' }
                servicios:
                  - { categoria: REDES_SOCIALES, nombre: Redes sociales, cantidadMensual: 12, unidad: piezas, estado: ACTIVO }
                  - { categoria: BLOG, nombre: Blog, cantidadMensual: 4, unidad: artículos, estado: ACTIVO }
                proximaPublicacion: { id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d, titulo: 'Tu ritual, tu momento', fechaProgramada: '2026-10-08T14:00:00Z' }
                ticketsAbiertos:
                  - { id: 6d7e8f9a-0b1c-4d2e-8f3a-4b5c6d7e8f9a, codigo: '#1042', asunto: Ajuste de pauta en Meta, estado: EN_PROCESO }

  /clientes/{clienteId}/actividad:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Clientes]
      operationId: listarActividadCliente
      summary: '"Historial de la cuenta" de la ficha: versiones creadas, aprobaciones, cambios de marca'
      x-roles: [EQUIPO]
      parameters:
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - properties:
                      datos: { type: array, items: { $ref: '#/components/schemas/ActividadCuenta' } }
  /clientes/{clienteId}/miembros:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Clientes]
      operationId: listarMiembros
      summary: Usuarios del cliente con acceso al portal (POR-01)
      x-roles: [EQUIPO, ADMIN_CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/Miembro' } }
    post:
      tags: [Clientes]
      operationId: invitarMiembro
      summary: Invitar a un usuario (crea la cuenta en el pool de clientes y envía el correo)
      x-roles: [ACCOUNT_MANAGER, ADMIN, ADMIN_CLIENTE]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, nombre, rol]
              properties:
                email: { type: string, format: email }
                nombre: { type: string }
                rol: { $ref: '#/components/schemas/RolCliente' }
      responses:
        '201':
          description: Invitado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Miembro' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /clientes/{clienteId}/miembros/{usuarioId}:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - { name: usuarioId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Clientes]
      operationId: cambiarRolMiembro
      summary: Cambiar el rol de un usuario del cliente
      x-roles: [ACCOUNT_MANAGER, ADMIN, ADMIN_CLIENTE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rol]
              properties: { rol: { $ref: '#/components/schemas/RolCliente' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Miembro' }
    delete:
      tags: [Clientes]
      operationId: quitarMiembro
      summary: Quitar acceso a un usuario del cliente
      x-roles: [ACCOUNT_MANAGER, ADMIN, ADMIN_CLIENTE]
      responses:
        '204': { description: Quitado }

  # ------------------------------------------------------------------ Referencias y briefs
  /clientes/{clienteId}/referencias:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Referencias y briefs]
      operationId: listarReferencias
      summary: Marcas que admira, competidores, piezas de ejemplo (CLI-02)
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: tipo, in: query, schema: { $ref: '#/components/schemas/TipoReferencia' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/Referencia' } }
    post:
      tags: [Referencias y briefs]
      operationId: crearReferencia
      summary: Agregar referencia. Si lleva archivo, primero se sube con /archivos.
      x-roles: [EQUIPO, ADMIN_CLIENTE, APROBADOR]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferenciaEntrada' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Referencia' }
        '422': { $ref: '#/components/responses/Validacion' }

  /clientes/{clienteId}/referencias/{referenciaId}:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - { name: referenciaId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Referencias y briefs]
      operationId: eliminarReferencia
      summary: Eliminar referencia
      x-roles: [EQUIPO, ADMIN_CLIENTE]
      responses:
        '204': { description: Eliminada }

  /clientes/{clienteId}/briefs:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Referencias y briefs]
      operationId: listarBriefs
      summary: Briefs mensuales del cliente
      x-roles: [EQUIPO]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/Brief' } }

  /clientes/{clienteId}/briefs/{periodo}:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - { name: periodo, in: path, required: true, schema: { $ref: '#/components/schemas/Periodo' } }
    get:
      tags: [Referencias y briefs]
      operationId: obtenerBrief
      summary: Brief del mes con sus archivos. Si no existe, devuelve uno vacío en BORRADOR (no 404).
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Brief' }
    put:
      tags: [Referencias y briefs]
      operationId: guardarBrief
      summary: Guardar el borrador ("El enfoque de este mes"). Solo mientras está en BORRADOR para el cliente.
      x-roles: [EQUIPO, ADMIN_CLIENTE, APROBADOR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                objetivoComunicacion: { type: string, maxLength: 500 }
                consideraciones: { type: string, maxLength: 5000 }
                contenidoMd: { type: string, description: Solo equipo }
                driveFileId: { type: string, description: Solo equipo }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Brief' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /clientes/{clienteId}/briefs/{periodo}/enviar:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - { name: periodo, in: path, required: true, schema: { $ref: '#/components/schemas/Periodo' } }
    post:
      tags: [Referencias y briefs]
      operationId: enviarBrief
      summary: '"Enviar brief y referencias". Firma la declaración de derechos y publica los archivos subidos (CU-05).'
      description: |
        Pasa el brief a ENVIADO y todos sus archivos en estado SUBIDO a DISPONIBLE, guardando quién declaró
        los derechos y cuándo. Avisa al account manager (evento `brief.enviado`).
      x-roles: [ADMIN_CLIENTE, APROBADOR]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [declaraDerechos]
              properties:
                declaraDerechos: { type: boolean, const: true }
      responses:
        '200':
          description: Enviado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Brief' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }

  /clientes/{clienteId}/briefs/{periodo}/confirmar:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - { name: periodo, in: path, required: true, schema: { $ref: '#/components/schemas/Periodo' } }
    post:
      tags: [Referencias y briefs]
      operationId: confirmarBrief
      summary: El AM revisa y confirma el brief; dispara al Jefe de Marketing (CU-02)
      x-roles: [ACCOUNT_MANAGER, ADMIN]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200':
          description: Confirmado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Brief' }
  /clientes/{clienteId}/servicios:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Servicios]
      operationId: listarServiciosCliente
      summary: Plan, resumen del mes y todos los servicios del catálogo (contratados y no contratados) (POR-02)
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: periodo, in: query, description: Por defecto el mes actual (America/Lima), schema: { $ref: '#/components/schemas/Periodo' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiciosCliente' }
              example:
                periodo: '2026-10'
                plan: { id: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e, nombre: Plan Crecimiento, fechaInicio: '2026-01-01', fechaFin: '2026-12-31', tieneContrato: true }
                resumenMes: { totales: 20, entregadas: 16, aprobadas: 12, publicadas: 3, porRevisar: 4, enProduccion: 4, porcentaje: 60 }
                servicios:
                  - categoria: BLOG
                    nombre: Blog
                    descripcion: Artículos optimizados y propuestas editoriales.
                    unidad: artículos
                    contratado: true
                    servicioContratadoId: 3c9d8e7f-6a5b-4c3d-9e2f-1a0b9c8d7e6f
                    estado: ACTIVO
                    cantidadMensual: 4
                    progreso: { totales: 4, entregadas: 3, aprobadas: 2, porRevisar: 1, enProduccion: 1, porcentaje: 75 }
                  - { categoria: AUDIOVISUAL, nombre: Audiovisual, descripcion: Producción y edición de video., unidad: videos, contratado: false, estado: NO_CONTRATADO, cantidadMensual: 0 }
    post:
      tags: [Servicios]
      operationId: contratarServicio
      summary: Registrar un servicio contratado con sus entregables incluidos
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicioContratadoEntrada' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServicioCliente' }

  /clientes/{clienteId}/plan/contrato:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Servicios]
      operationId: descargarContrato
      summary: URL firmada del contrato del plan vigente ("Ver contrato")
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UrlFirmada' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /clientes/{clienteId}/avance:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Servicios]
      operationId: obtenerAvanceCliente
      summary: Pantalla "Avance de proyectos". Resumen del mes, hitos y siguiente paso por servicio (INO-07)
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: periodo, in: query, schema: { $ref: '#/components/schemas/Periodo' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvanceCliente' }

  /servicios-contratados/{servicioContratadoId}/avance:
    parameters:
      - { name: servicioContratadoId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Servicios]
      operationId: obtenerAvanceServicio
      summary: Hitos del proyecto de InooWork enlazado, sin notas internas (INO-07; INO-02 para servicios CRM)
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvanceServicio' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  # ------------------------------------------------------------------ Piezas
  /clientes/{clienteId}/piezas:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Piezas]
      operationId: listarPiezas
      summary: Entregables del cliente. Para un CLIENTE, BORRADOR y EN_REVISION_INTERNA llegan como EN_PRODUCCION.
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - name: estado
          in: query
          description: Uno o varios, separados por coma
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/EstadoPieza' } }
        - name: tipo
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/TipoPieza' } }
        - { name: canal, in: query, schema: { type: string, examples: [INSTAGRAM] } }
        - { name: q, in: query, description: Busca en el título, schema: { type: string } }
        - { name: periodo, in: query, schema: { $ref: '#/components/schemas/Periodo' } }
        - { name: servicioContratadoId, in: query, schema: { type: string, format: uuid } }
        - { name: orden, in: query, schema: { type: string, enum: [fechaProgramada, -actualizadoEn], default: fechaProgramada } }
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - properties:
                      datos: { type: array, items: { $ref: '#/components/schemas/PiezaResumen' } }
                      conteos:
                        type: object
                        description: Piezas por estado con los mismos filtros salvo `estado` (para las pestañas y chips)
                        additionalProperties: { type: integer }
    post:
      tags: [Piezas]
      operationId: crearPieza
      summary: '"Nueva pieza" desde la bandeja de producción (hecha por una persona del equipo)'
      x-roles: [EQUIPO]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PiezaEntrada' }
      responses:
        '201':
          description: Creada en BORRADOR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pieza' }

  /piezas/{piezaId}:
    parameters: [ { $ref: '#/components/parameters/PiezaId' } ]
