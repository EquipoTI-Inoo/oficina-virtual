      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionEntrada' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionPieza' }

