openapi: 3.1.0
info:
  title: API Portal de Clientes y Oficina Virtual (Inoo)
  version: 1.1.0
  summary: Contrato compartido entre backend, portal Next.js (cliente + panel interno) y n8n.
  description: |
    Contrato v1 de la API que usan el portal de clientes, el panel interno y las integraciones
    (n8n, InooWork). Basado en el PRD del 3 oct 2026 y el backlog v1.0.

    **v1.1 (6 oct 2026)**: ajustado a las pantallas de Figma del portal (inicio, servicios, entregables,
    detalle de pieza, blog, calendario, brief, resultados, avance, soporte, notificaciones, panel general,
    bandeja de producción y ficha de cliente).

    **v1.2 (12 oct 2026)**: catálogo real de servicios (`CodigoServicio`) con variantes y detalle, plantillas
    de proyecto con etapas y % de avance acumulado, y etapas por proyecto que mueve el equipo. El cliente solo
    ve los servicios que tiene contratados. El Inicio del cliente resume su cuenta (lo que antes era la ficha
    del equipo): servicios con avance, responsable, carpeta de Drive, su marca (si aplica), actividad y, sin montos,
    un aviso si un pago vence pronto. Los pagos, usuarios, correos y ayuda están en "Mi cuenta". Cada servicio
    tiene su perfil de proyecto: métricas de su plantilla, etapas, reuniones, entregables por revisar y
    comentarios del cliente. Requerimientos: la agencia le pide al cliente (brief, accesos, catálogo) desde una
    plantilla con formulario y fecha límite en días hábiles; si se atrasa, se corre el cronograma del servicio y se
    le avisa. Reemplazan a los requerimientos del brief (cliente → agencia) del 10 oct. Los tickets del soporte
    continuo se generan dentro de ese servicio (`servicioContratadoId`); sin servicio son consultas generales.
    Cambio de responsable: el cliente deja los datos de su sucesor y el equipo lo aprueba antes de dar el acceso.
    Avisos: feriados, días no laborables, aniversario del cliente y avisos generales; los feriados y días no
    laborables no cuentan como días hábiles en plazos ni etapas.

    ## Convenciones
    - **JSON en camelCase**, fechas ISO 8601 en UTC (`2026-11-03T15:00:00Z`), periodos mensuales `AAAA-MM`.
    - **IDs** son UUID, salvo `numero` de ticket (se muestra como `TCK-000123`).
    - **Dinero** en USD como número con hasta 4 decimales (solo para mostrar; no se cobra nada con esta API).
    - **Listas paginadas por cursor**: `?limite=20&cursor=...` → `{ "datos": [...], "paginacion": { "siguienteCursor": "..." | null, "total": 4 } }`.
    - **Errores** en `application/problem+json` (RFC 9457) con un `codigo` estable para que el frontend traduzca.
    - **Idempotencia**: los POST que crean o deciden algo aceptan `Idempotency-Key`; reintentar con la misma clave devuelve la misma respuesta.
    - **Visibilidad**: `x-roles` indica quién puede llamar. Un usuario CLIENTE solo ve clientes de los que es miembro.
      Los campos marcados "solo equipo" no se envían a usuarios CLIENTE (el backend los omite, no los manda en null).
      Un CLIENTE sí ve en listas y calendario las piezas que se están produciendo, pero con `estado: EN_PRODUCCION`
      y sin contenido; solo ve el contenido de las versiones que el equipo le envió a revisión.

    ## Autenticación
    - Portal y panel: `Authorization: Bearer <JWT de Cognito>`. Dos user pools (equipo y clientes); el backend
      acepta ambos y resuelve el usuario con `GET /me`.
    - n8n y sincronización InooWork: `X-Api-Key`, con scopes.
    - Webhooks entrantes de InooWork: firma HMAC-SHA256 en `X-Inoo-Firma`.
servers:
  - url: https://clientes.inoo.pe/api/v1
    description: Producción (dominio propuesto en el PRD, pendiente de confirmar)
  - url: http://localhost:3000/api/v1
    description: Desarrollo local
security:
  - bearerAuth: []
tags:
  - name: Sesión
  - name: Clientes
  - name: Referencias y briefs
  - name: Requerimientos
  - name: Servicios
  - name: Piezas
  - name: Planificación
  - name: Archivos
  - name: Paid media
  - name: Reportes
  - name: Soporte
  - name: Correos
  - name: Panel interno
  - name: Jarvis del equipo
    description: 'Agentes de IA del equipo (30 oct): cada colaborador tiene su Jarvis (Hermes), que usa DeepSeek por la pasarela /ia-equipo del portal. El consumo se cobra al área de la persona, con tope diario y mensual por área. Solo equipo; el cliente no ve nada de esto.'
  - name: Calendario
  - name: Tableros
    description: Proyectos de InooWork (grupos, ítems y subítems) leídos y guardados por su API; InooWork es la fuente
  - name: Taller web
    description: 'Fase 19: flujo web con IA del equipo (benchmark, flujograma, prototipo en Stitch y demo). Solo equipo; al cliente le llegan el PDF y la demo como entregables, sin rastros de IA.'
  - name: Integraciones

paths:
  /sesion/ingresar:
    post:
      tags: [Sesión]
      operationId: ingresar
      summary: 'Ingreso con correo y contraseña. Con AUTH_MODO=cognito valida contra los user pools (clientes y equipo); en desarrollo, las credenciales de prueba'
      description: |
        Devuelve el ID token de Cognito (va en `Authorization: Bearer`) y el refresh token para renovarlo, o el
        desafío `NUEVA_CLAVE` si es el primer ingreso de una persona invitada (contraseña temporal): se completa
        con `POST /sesion/nueva-clave`. Nunca dice si el correo existe.

        Equipo con InooWork (2 nov, AUTH_EQUIPO=inoowork): con un usuario de InooWork, o el correo de alguien del
        equipo, el portal verifica la contraseña con `POST /api/login` de InooWork (sin guardarla) y devuelve una
        sesión firmada por el portal, de 12 horas y sin refresh token. 403 CUENTA_NO_ENLAZADA si ese empleado no está
        en el portal; 503 si InooWork no responde; 429 tras 5 intentos fallidos en 15 minutos.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, clave]
              properties:
                email: { type: string, description: 'Correo, o el usuario de InooWork (equipo)' }
                clave: { type: string }
      responses:
        '200':
          description: 'Sesión iniciada, o el desafío de contraseña nueva'
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/SesionIniciada' }
                  - { $ref: '#/components/schemas/DesafioNuevaClave' }
        '401': { description: 'CREDENCIALES_INVALIDAS', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '403': { description: 'CUENTA_NO_ENLAZADA: el usuario de InooWork no está en el portal', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '409': { description: 'RESTABLECER_CLAVE: Cognito pide restablecerla', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '429': { description: 'DEMASIADOS_INTENTOS', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '503': { description: 'INOOWORK_NO_RESPONDE', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }

  /sesion/nueva-clave:
    post:
      tags: [Sesión]
      operationId: crearClaveNueva
      summary: 'Primer ingreso de una persona invitada: cambia la contraseña temporal por la suya (solo Cognito)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, sesion, pool, clave]
              properties:
                email: { type: string, format: email }
                sesion: { type: string, description: 'La `sesion` del desafío' }
                pool: { $ref: '#/components/schemas/PoolCognito' }
                clave: { type: string, minLength: 8 }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionIniciada' }
        '409': { description: 'SOLO_COGNITO: con el ingreso de prueba no aplica', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '422': { $ref: '#/components/responses/Validacion' }

  /sesion/olvide-clave:
    post:
      tags: [Sesión]
      operationId: olvideClave
      summary: 'Manda al correo cómo restablecer la contraseña: un enlace (AUTH_MODO=portal) o un código (Cognito). Responde igual aunque el correo no exista'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: 'Ingreso propio: si el correo existe, le llega un enlace'
          content:
            application/json:
              schema:
                type: object
                required: [metodo]
                properties:
                  metodo: { type: string, enum: [ENLACE] }
        '204': { description: 'Cognito: si el correo existe, le llega el código' }
        '429': { description: 'DEMASIADOS_INTENTOS', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }

  /sesion/crear-clave:
    post:
      tags: [Sesión]
      operationId: crearClave
      summary: 'El cliente crea su contraseña con su enlace de un solo uso y queda con la sesión iniciada (AUTH_MODO=portal)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, clave]
              properties:
                token: { type: string }
                clave: { type: string, minLength: 8 }
      responses:
        '200':
          description: 'Contraseña creada; sesión iniciada'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionIniciada' }
        '409': { description: 'SOLO_COGNITO: este despliegue no usa el ingreso propio', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '422': { $ref: '#/components/responses/Validacion' }

  /sesion/desde-inoowork:
    post:
      tags: [Sesión]
      operationId: ingresarDesdeInooWork
      summary: 'Desde InooWork con la sesión iniciada: canjea el pase de un solo uso (60 s) que firma InooWork con la llave compartida'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pase]
              properties:
                pase: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: 'Sesión iniciada como esa persona del equipo'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionIniciada' }
        '401': { description: 'PASE_NO_VALIDO: vencido, ya usado o mal firmado', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '403': { description: 'CUENTA_DESACTIVADA o CUENTA_NO_ENLAZADA', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }

  /pruebas/usuarios:
    get:
      tags: [Sesión]
      operationId: listarUsuariosDePrueba
      summary: 'Cuenta pruebas@inoo.pe: los usuarios de prueba y para qué sirve cada uno'
      description: 'Entorno de pruebas (6 nov): los usuarios de prueba (también un Admin con super usuario) solo ven y tocan datos de prueba; las personas reales no ven nada de prueba (migración 0046).'
      x-roles: [CUENTA_PRUEBAS]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos:
                    type: array
                    items:
                      type: object
                      required: [id, nombre, tipo, descripcion]
                      properties:
                        id: { type: string, format: uuid }
                        nombre: { type: string }
                        tipo: { type: string, enum: [EQUIPO, CLIENTE] }
                        descripcion: { type: string }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /pruebas/entrar:
    post:
      tags: [Sesión]
      operationId: entrarComoUsuarioDePrueba
      summary: 'Cuenta pruebas@inoo.pe: entra como uno de los usuarios de prueba'
      x-roles: [CUENTA_PRUEBAS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuarioId]
              properties:
                usuarioId: { type: string, format: uuid }
      responses:
        '200':
          description: Sesión iniciada como ese usuario de prueba
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionIniciada' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /panel/cuenta-pruebas/enlace:
    post:
      tags: [Panel interno]
      operationId: enlaceCuentaPruebas
      summary: 'Super usuario real: enlace de un solo uso para poner la contraseña de pruebas@inoo.pe'
      x-roles: [EQUIPO]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ruta, expiraEn, email]
                properties:
                  ruta: { type: string }
                  expiraEn: { type: string, format: date-time }
                  email: { type: string }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /sesion/restablecer:
    post:
      tags: [Sesión]
      operationId: restablecerClave
      summary: 'Contraseña nueva con el código que llegó por correo (solo Cognito)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, codigo, clave]
              properties:
                email: { type: string, format: email }
                codigo: { type: string }
                clave: { type: string, minLength: 8 }
      responses:
        '204': { description: 'Contraseña cambiada: ya puede ingresar' }
        '409': { description: 'SOLO_COGNITO', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '422': { $ref: '#/components/responses/Validacion' }

  /sesion/renovar:
    post:
      tags: [Sesión]
      operationId: renovarSesion
      summary: 'ID token nuevo con el refresh token (el de Cognito vence a la hora). El portal lo pide solo cuando recibe un 401'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken, pool]
              properties:
                refreshToken: { type: string }
                pool: { $ref: '#/components/schemas/PoolCognito' }
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                type: object
                required: [token, expiraEn]
                properties:
                  token: { type: string }
                  refreshToken: { type: [string, 'null'] }
                  pool: { $ref: '#/components/schemas/PoolCognito' }
                  expiraEn: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '409': { description: 'SOLO_COGNITO', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }

  # ------------------------------------------------------------------ Sesión
  /me:
    get:
      tags: [Sesión]
      operationId: obtenerSesion
      summary: Usuario actual, su tipo y los clientes a los que tiene acceso
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
              example:
                usuario: { id: 5b0c1e2a-8f3d-4c6b-9a71-2d4e6f8a0b1c, nombre: Valeria Mendoza, email: valeria@casaoliva.pe, cargo: Administradora, iniciales: VM, tipo: CLIENTE, rolEquipo: null }
                notificacionesSinLeer: 1
                clientes:
                  - { clienteId: 7f3a9c10-2b4d-4e8f-a1c3-5d7e9f0a2b4c, nombre: Casa Oliva, rol: ADMIN_CLIENTE }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  # ------------------------------------------------------------------ Clientes
  /me/notificaciones:
    get:
      tags: [Sesión]
      operationId: listarNotificaciones
      summary: Notificaciones de la campana (más recientes primero)
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: noLeidas, in: query, schema: { type: boolean, default: false } }
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - properties:
                      datos: { type: array, items: { $ref: '#/components/schemas/Notificacion' } }
              example:
                datos:
                  - { id: 0c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f, tipo: PIEZAS_LISTAS, titulo: Tienes contenido nuevo, cuerpo: 4 piezas listas para revisión. Revisa el contenido de octubre., enlace: /entregables, leida: false, creadoEn: '2026-10-06T13:00:00Z' }
                paginacion: { siguienteCursor: null, total: 1 }

  /me/notificaciones/leer:
    post:
      tags: [Sesión]
      operationId: marcarNotificacionesLeidas
      summary: Marcar como leídas (las indicadas o todas)
      x-roles: [EQUIPO, CLIENTE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: string, format: uuid } }
                todas: { type: boolean, default: false }
      responses:
        '204': { description: Marcadas }

  /me/cuenta:
    get:
      tags: [Sesión]
      operationId: miCuentaEquipo
      summary: '«Mi cuenta» del equipo (reunión 6 nov): perfil con la foto de InooWork, accesos, proyectos a cargo y gasto de Jarvis del mes'
      description: |
        La foto sale de la ficha de InooWork (`avatar`); si InooWork no responde, llega en null y se muestran las iniciales.
        La contraseña del equipo se cambia en InooWork: `cambiarClaveUrl` lleva allá (null si InooWork no está conectado).
      x-roles: [EQUIPO]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MiCuentaEquipo' }
        '403': { $ref: '#/components/responses/SinPermiso' }
  /me/sesiones/cerrar:
    post:
      tags: [Sesión]
      operationId: cerrarMisSesiones
      summary: 'Cierra todas mis otras sesiones abiertas (otros equipos o navegadores). Esta sigue con un token nuevo'
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [token, expiraEn]
                properties:
                  token: { type: string }
                  expiraEn: { type: string, format: date-time }
        '409': { description: 'Viendo como cliente o con un ingreso que no lo permite' }

  /servicios:
    get:
      tags: [Servicios]
      operationId: listarCatalogoServicios
      summary: Catálogo de servicios que vende la agencia, con sus variantes
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/ServicioCatalogo' } }
  /clientes:
    get:
      tags: [Clientes]
      operationId: listarClientes
      summary: Clientes visibles para el usuario (equipo ve todos; cliente ve los suyos)
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoCliente' } }
        - { name: q, in: query, description: Búsqueda por nombre, schema: { type: string } }
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - properties:
                      datos: { type: array, items: { $ref: '#/components/schemas/ClienteResumen' } }
    post:
      tags: [Clientes]
      operationId: crearCliente
      summary: Alta de cliente (CU-01). Dispara la creación de carpetas en Drive vía n8n.
      description: |
        6 nov: los servicios marcados en el ingreso (Branding, Social Media, Desarrollo web, CRM) se contratan aquí mismo
        como proyectos, a cargo de `responsableProyectosId` (obligatorio si hay alguno). SEO no tiene servicio en el
        catálogo: vuelve en `sinProyecto`. Los leads de área también pueden crear clientes y quedan con acceso a la cuenta.
      x-roles: [ACCOUNT_MANAGER, ADMIN, LEAD]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClienteEntrada' }
      responses:
        '201':
          description: Creado. `driveCarpetaId` llega en null y se completa cuando n8n termina (evento `cliente.creado`).
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Cliente' }
                  - type: object
                    properties:
                      proyectosCreados: { type: integer, description: Proyectos creados desde el ingreso }
                      sinProyecto: { type: array, items: { type: string }, description: Servicios marcados que todavía no tienen proyecto en el catálogo }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }

  /clientes/{clienteId}:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Clientes]
      operationId: obtenerCliente
      summary: Perfil del cliente (CLI-01)
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Clientes]
      operationId: actualizarCliente
      summary: Editar perfil (merge parcial)
      x-roles: [ACCOUNT_MANAGER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClienteEntrada' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '422': { $ref: '#/components/responses/Validacion' }

  /clientes/{clienteId}/inicio:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Clientes]
      operationId: obtenerInicioCliente
      summary: 'Inicio del cliente ("Tu cuenta"): todo lo que pinta la pantalla en una sola llamada'
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: periodo, in: query, description: Por defecto el mes actual (America/Lima), schema: { $ref: '#/components/schemas/Periodo' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InicioCliente' }
