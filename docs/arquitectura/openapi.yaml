      summary: 'Comparte el bot con otra área o con Gerencia: PRESTAR (la usa sin editarla y paga su gasto; con chats, ve los del dueño) o COPIAR (un bot igual que es suyo; con chats, copia el historial)'
      x-roles: [EQUIPO]
      parameters: [ { name: botId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
