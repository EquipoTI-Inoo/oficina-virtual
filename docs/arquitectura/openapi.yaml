      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReporteResultados' }
              example:
                periodo: { desde: '2026-10-01', hasta: '2026-10-06' }
                comparativa: { desde: '2026-09-01', hasta: '2026-09-06' }
                esMuestra: true
                notas: [Solo canales orgánicos; Paid media no está contratado.]
                indicadores:
                  - { clave: ALCANCE, etiqueta: Alcance en redes, valor: 20000, detalle: 'Instagram 12 000 · Facebook 8 000' }
                  - { clave: VISITAS_SITIO, etiqueta: Visitas al sitio, valor: 2400, detalle: Suma de los tres canales }
                  - { clave: CONTACTOS, etiqueta: Contactos recibidos, valor: 120, detalle: 5 % de las visitas al sitio }
                  - { clave: CONVERSION, etiqueta: Conversión a compra, valor: 1, unidad: '%', detalle: '24 compras / 2 400 visitas' }
                canales:
                  - { canal: INSTAGRAM, metrica: VISITAS_SITIO, total: 1280, variacionPct: 18, puntos: [ { fecha: '2026-10-01', valor: 160 }, { fecha: '2026-10-02', valor: 180 } ] }
                recorrido:
                  - { orden: 1, nombre: Descubrimiento, descripcion: personas alcanzadas, valor: 20000, pctEtapaAnterior: null }
                  - { orden: 2, nombre: Interés, descripcion: visitas al sitio, valor: 2400, pctEtapaAnterior: 12 }
                lectura: Instagram aporta el 53,3 % de las visitas. La siguiente oportunidad es mejorar el llamado a la acción.
                informeDisponible: true

  /clientes/{clienteId}/reportes/informe:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Reportes]
      operationId: descargarInforme
      summary: '"Descargar informe". URL firmada del PDF del periodo.'
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: periodo, in: query, required: true, schema: { $ref: '#/components/schemas/Periodo' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UrlFirmada' }
        '404': { $ref: '#/components/responses/NoEncontrado' }


  /clientes/{clienteId}/tickets:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Soporte]
      operationId: listarTickets
      summary: Tickets del cliente (pestañas Todos / Abiertos / Resueltos)
      x-roles: [EQUIPO, CLIENTE]
      parameters:
        - { name: grupo, in: query, description: 'ABIERTOS = ABIERTO, EN_PROCESO, ESPERANDO_CLIENTE; RESUELTOS = RESUELTO, CERRADO', schema: { type: string, enum: [TODOS, ABIERTOS, RESUELTOS], default: TODOS } }
        - { name: q, in: query, description: 'Asunto o número (#1042 o 1042)', schema: { type: string } }
        - name: estado
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/EstadoTicket' } }
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - properties:
                      datos: { type: array, items: { $ref: '#/components/schemas/Ticket' } }
                      conteos:
                        type: object
                        required: [todos, abiertos, resueltos]
                        properties:
                          todos: { type: integer }
                          abiertos: { type: integer }
                          resueltos: { type: integer }
    post:
      tags: [Soporte]
      operationId: crearTicket
      summary: Abrir ticket (CU-07). Responde al instante; urgencia y área llegan después (evento ticket.clasificado).
      x-roles: [CLIENTE, EQUIPO]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketEntrada' }
            example:
              asunto: No veo el blog de noviembre
              categoria: MARKETING
              descripcion: En el portal solo aparecen 2 de los 8 blogs del mes.
              archivoIds: []
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
              example:
                id: 6d7e8f9a-0b1c-4d2e-8f3a-4b5c6d7e8f9a
                numero: 1043
                codigo: '#1043'
                asunto: No veo el blog de noviembre
                categoria: MARKETING
                estado: ABIERTO
                urgencia: null
                slaPrimeraRespuestaEn: '2026-11-05T22:00:00Z'
                creadoEn: '2026-11-04T22:00:00Z'

  /tickets/{ticketId}:
    parameters: [ { $ref: '#/components/parameters/TicketId' } ]
    get:
      tags: [Soporte]
      operationId: obtenerTicket
      summary: Detalle del ticket con mensajes
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketDetalle' }
    patch:
      tags: [Soporte]
      operationId: actualizarTicket
      summary: El cliente solo puede cerrar o reabrir (RESUELTO→ABIERTO dentro de 7 días); el equipo gestiona en InooWork.
      x-roles: [CLIENTE, EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [CERRADO, ABIERTO] }
                comentario: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /tickets/{ticketId}/mensajes:
    parameters: [ { $ref: '#/components/parameters/TicketId' } ]
    post:
      tags: [Soporte]
      operationId: responderTicket
      summary: Agregar un mensaje al ticket
      x-roles: [CLIENTE, EQUIPO]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto: { type: string, minLength: 1, maxLength: 10000 }
                archivoIds: { type: array, items: { type: string, format: uuid } }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MensajeTicket' }

  # ------------------------------------------------------------------ Correos
  /clientes/{clienteId}/correos-automaticos:
    parameters: [ { $ref: '#/components/parameters/ClienteId' } ]
    get:
      tags: [Correos]
      operationId: listarCorreosAutomaticos
      summary: Qué correos salen, cuándo, y los últimos enviados (INO-04)
      x-roles: [EQUIPO, CLIENTE]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [reglas, recientes]
                properties:
                  reglas: { type: array, items: { $ref: '#/components/schemas/ReglaCorreo' } }
                  recientes: { type: array, items: { $ref: '#/components/schemas/CorreoEnviado' } }

  # ------------------------------------------------------------------ Panel interno
  /panel/clientes:
    get:
      tags: [Panel interno]
      operationId: panelClientes
      summary: Pantalla "Panel general". Indicadores de la agencia, alertas y fila por cliente.
      x-roles: [EQUIPO]
      parameters:
        - { name: periodo, in: query, schema: { $ref: '#/components/schemas/Periodo' } }
        - { name: q, in: query, description: Nombre de marca o contacto, schema: { type: string } }
        - { name: estadoOperativo, in: query, schema: { $ref: '#/components/schemas/EstadoOperativo' } }
        - { name: accountManagerId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [resumen, datos]
                properties:
                  resumen: { $ref: '#/components/schemas/ResumenAgencia' }
                  datos: { type: array, items: { $ref: '#/components/schemas/FilaPanelCliente' } }

  /panel/clientes/exportar:
    get:
      tags: [Panel interno]
      operationId: exportarPanelClientes
      summary: '"Exportar resumen" en CSV con los mismos filtros'
      x-roles: [EQUIPO]
      parameters:
        - { name: periodo, in: query, schema: { $ref: '#/components/schemas/Periodo' } }
        - { name: q, in: query, schema: { type: string } }
        - { name: estadoOperativo, in: query, schema: { $ref: '#/components/schemas/EstadoOperativo' } }
      responses:
        '200':
          description: CSV (UTF-8, separador coma). El frontend lo descarga con fetch + Blob.
          content:
            text/csv:
              schema: { type: string }

  /panel/piezas:
    get:
      tags: [Panel interno]
      operationId: panelBandejaProduccion
      summary: Pantalla "Bandeja de producción". Piezas agrupadas en columnas por estado, de uno o todos los clientes.
      description: |
        Columnas: BORRADOR (BORRADOR + EN_REVISION_INTERNA), EN_REVISION (LISTO_REVISION, esperando al cliente),
        APROBADO, CAMBIOS_SOLICITADOS y PUBLICADO. Cada columna trae hasta `porColumna` piezas y su `total`;
        "Ver las otras N" pide la misma columna con `columna` y `cursor`.
      x-roles: [EQUIPO]
      parameters:
        - { name: clienteId, in: query, schema: { type: string, format: uuid } }
        - { name: periodo, in: query, schema: { $ref: '#/components/schemas/Periodo' } }
        - { name: servicioContratadoId, in: query, schema: { type: string, format: uuid } }
        - { name: origen, in: query, schema: { type: string, enum: [AGENTE, PERSONA] } }
        - { name: columna, in: query, schema: { $ref: '#/components/schemas/ColumnaBandeja' } }
        - { name: porColumna, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BandejaProduccion' }

  /panel/costos-ia:
    get:
      tags: [Panel interno]
      operationId: panelCostosIa
      summary: Costo de IA por cliente y por modelo en el periodo (ADM-01)
      x-roles: [ADMIN]
      parameters:
        - { name: periodo, in: query, required: true, schema: { $ref: '#/components/schemas/Periodo' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReporteCostos' }

  /panel/ejecuciones:
    get:
      tags: [Panel interno]
      operationId: panelEjecuciones
      summary: Ejecuciones de agentes con errores y costo
      x-roles: [ADMIN]
      parameters:
        - { name: clienteId, in: query, schema: { type: string, format: uuid } }
        - { name: agente, in: query, schema: { type: string } }
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoEjecucion' } }
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - properties:
                      datos: { type: array, items: { $ref: '#/components/schemas/Ejecucion' } }

  # ------------------------------------------------------------------ Integraciones (n8n / InooWork)
  /integraciones/ejecuciones:
    post:
      tags: [Integraciones]
      operationId: registrarEjecucion
      summary: n8n abre o cierra una ejecución de agente y reporta consumo por modelo. Idempotente por n8nExecutionId+agente.
      security: [ { apiKey: [] } ]
      x-scopes: [ejecuciones:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EjecucionEntrada' }
            example:
              clienteId: 7f3a9c10-2b4d-4e8f-a1c3-5d7e9f0a2b4c
              agente: contenido-blog
              n8nWorkflowId: wf_12
              n8nExecutionId: '88231'
              piezaId: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
              estado: OK
              consumos:
                - { proveedor: google, modelo: gemini-3.8-flash, tokensEntrada: 52000, tokensSalida: 4100 }
                - { proveedor: openai, modelo: gpt-6.1-sol, tokensEntrada: 15000, tokensSalida: 7600 }
      responses:
        '200':
          description: Registrada. Si el gasto del mes cruza el umbral, `alerta` viene informada (y sale el evento presupuesto.alerta).
          content:
            application/json:
              schema:
                type: object
                required: [ejecucionId, gastoMesUsd, limiteUsd, pctLimite, bloquear]
                properties:
                  ejecucionId: { type: string, format: uuid }
                  gastoMesUsd: { type: number }
                  limiteUsd: { type: number }
                  pctLimite: { type: number }
                  alerta: { type: [string, 'null'], enum: [UMBRAL, LIMITE, null] }
                  bloquear: { type: boolean, description: true si se superó el 100 %; n8n no debe lanzar nuevas ejecuciones no críticas }

  /integraciones/piezas:
    post:
      tags: [Integraciones]
      operationId: crearPiezaDesdeAgente
      summary: Un agente crea una pieza con su primera versión (estado BORRADOR)
      security: [ { apiKey: [] } ]
      x-scopes: [piezas:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PiezaEntradaAgente'
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pieza' }

  /integraciones/piezas/{piezaId}/versiones:
    parameters: [ { $ref: '#/components/parameters/PiezaId' } ]
    post:
      tags: [Integraciones]
      operationId: crearVersionDesdeAgente
      summary: Nueva versión tras CAMBIOS_SOLICITADOS; la pieza vuelve a BORRADOR y luego a EN_REVISION_INTERNA
      security: [ { apiKey: [] } ]
      x-scopes: [piezas:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionEntrada' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionPieza' }

  /integraciones/calendarios:
    post:
      tags: [Integraciones]
      operationId: guardarPropuestaCalendario
      summary: El Jefe de Marketing guarda la propuesta del mes (crea piezas en BORRADOR con fechas y canal)
      security: [ { apiKey: [] } ]
      x-scopes: [piezas:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropuestaCalendario' }
      responses:
        '201':
          description: Creado o nueva versión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calendario' }

  /integraciones/inoowork/sincronizacion:
    post:
      tags: [Integraciones]
      operationId: sincronizarInooWork
      summary: n8n empuja el estado leído de InooWork (proyectos/ítems y tickets). Reemplaza hitos del servicio.
      description: |
        InooWork hoy no emite webhooks y solo expone `GET /api/projects` (todos) y `PUT` del proyecto completo.
        Por defecto n8n consulta cada 5 minutos, calcula diferencias y llama a este endpoint. Si InooWork suma
        webhooks, apuntarán a `/webhooks/inoowork` con el mismo cuerpo.
      security: [ { apiKey: [] } ]
      x-scopes: [inoowork:sync]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SincronizacionInooWork' }
      responses:
        '200':
          description: Aplicada
          content:
            application/json:
              schema:
                type: object
                properties:
                  hitosActualizados: { type: integer }
                  ticketsActualizados: { type: integer }

  /webhooks/inoowork:
    post:
      tags: [Integraciones]
      operationId: webhookInooWork
      summary: Entrada futura de webhooks de InooWork (mismo cuerpo que la sincronización), firmada con HMAC
      security: [ { firmaInooWork: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SincronizacionInooWork' }
      responses:
        '204': { description: Aceptado }
        '401': { $ref: '#/components/responses/NoAutenticado' }

webhooks:
  eventoPlataforma:
    post:
      operationId: eventoPlataforma
      summary: Eventos que la API envía a n8n (outbox). Firma HMAC-SHA256 de `<X-Inoo-Timestamp>.<cuerpo>` en `X-Inoo-Firma`.
      description: |
        Entrega al menos una vez, en orden por `id`; el consumidor debe deduplicar por `id`.
        Reintentos con backoff exponencial hasta 24 h.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventoSaliente' }
            example:
              id: 10452
              tipo: pieza.estado_cambiado
              ocurridoEn: '2026-11-04T15:02:11Z'
              clienteId: 7f3a9c10-2b4d-4e8f-a1c3-5d7e9f0a2b4c
              datos: { piezaId: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d, estado: CAMBIOS_SOLICITADOS, usuarioId: 5b0c1e2a-8f3d-4c6b-9a71-2d4e6f8a0b1c, canal: PORTAL, comentario: Cambiar el CTA }
      responses:
        '2XX': { description: Recibido }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ID token o access token de Cognito (pool de equipo o de clientes)
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
    firmaInooWork:
      type: apiKey
      in: header
      name: X-Inoo-Firma
      description: "sha256=<hex HMAC-SHA256 de `<X-Inoo-Timestamp>.<cuerpo>` con el secreto compartido>. Firmar la marca de tiempo junto al cuerpo impide reenviar un cuerpo viejo con una marca nueva; rechazo si tiene más de 5 min"

  parameters:
    ClienteId: { name: clienteId, in: path, required: true, schema: { type: string, format: uuid } }
    PiezaId: { name: piezaId, in: path, required: true, schema: { type: string, format: uuid } }
    ArchivoId: { name: archivoId, in: path, required: true, schema: { type: string, format: uuid } }
    TicketId: { name: ticketId, in: path, required: true, schema: { type: string, format: uuid } }
    Limite: { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Cursor: { name: cursor, in: query, description: Valor opaco de `paginacion.siguienteCursor`, schema: { type: string } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: UUID generado por el cliente por cada intención (no por cada reintento). Vigencia 24 h.
      schema: { type: string, maxLength: 64 }

  responses:
    NoAutenticado:
      description: Token ausente, vencido o inválido
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    SinPermiso:
      description: Autenticado pero sin permiso para esta acción
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example: { type: 'https://clientes.inoo.pe/errores/sin-permiso', title: Sin permiso, status: 403, codigo: SIN_PERMISO }
    NoEncontrado:
      description: No existe o no es visible para este usuario (no se distingue, para no filtrar datos de otros clientes)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Conflicto:
      description: Estado o versión desactualizados
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: 'https://clientes.inoo.pe/errores/version-desactualizada'
            title: La pieza cambió mientras la revisabas
            status: 409
            codigo: VERSION_DESACTUALIZADA
            detail: Estás aprobando la versión 2 pero la vigente es la 3.
    Validacion:
      description: Datos inválidos
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: 'https://clientes.inoo.pe/errores/validacion'
            title: Hay campos con errores
            status: 422
            codigo: VALIDACION
            errores: [ { campo: declaraDerechos, codigo: REQUERIDO, mensaje: Debes declarar que tienes los derechos de uso } ]

  schemas:
    # ---------- comunes
    Periodo: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', examples: ['2026-11'] }
    Pagina:
      type: object
      required: [datos, paginacion]
      properties:
        datos: { type: array, items: {} }
        paginacion:
          type: object
          required: [siguienteCursor]
          properties:
            siguienteCursor: { type: [string, 'null'] }
            total: { type: integer, description: Total con los filtros aplicados ("4 entregables") }
    Problema:
      type: object
      required: [type, title, status, codigo]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        codigo:
          type: string
          description: Código estable para el frontend
          enum: [NO_AUTENTICADO, SIN_PERMISO, NO_ENCONTRADO, VALIDACION, TRANSICION_INVALIDA, VERSION_DESACTUALIZADA,
                 COMENTARIO_REQUERIDO, DERECHOS_NO_DECLARADOS, ARCHIVO_NO_SUBIDO, ARCHIVO_DEMASIADO_GRANDE,
                 IDEMPOTENCIA_CONFLICTO, LIMITE_PETICIONES, ERROR_INTERNO]
        errores:
          type: array
          items:
            type: object
            required: [campo, codigo]
            properties:
              campo: { type: string }
              codigo: { type: string }
              mensaje: { type: string }
        traceId: { type: string }
    UrlFirmada:
      type: object
      required: [url, expiraEn]
      properties:
        url: { type: string, format: uri }
        expiraEn: { type: string, format: date-time }
        nombreArchivo: { type: string }

    # ---------- enums (mismos valores que la base)
    TipoUsuario: { type: string, enum: [EQUIPO, CLIENTE, SERVICIO] }
    RolEquipo: { type: string, enum: [ACCOUNT_MANAGER, DISENO, AUDIOVISUAL, PAID_MEDIA, DESARROLLO_WEB, ADMIN] }
    RolCliente:
      type: string
      enum: [ADMIN_CLIENTE, APROBADOR, LECTOR]
      description: ADMIN_CLIENTE gestiona usuarios; APROBADOR aprueba, sube y abre tickets; LECTOR solo mira y abre tickets.
    EstadoCliente: { type: string, enum: [ACTIVO, PAUSADO, BAJA] }
    TipoReferencia: { type: string, enum: [MARCA_ADMIRADA, COMPETIDOR, PIEZA_EJEMPLO, MANUAL_MARCA, LOGO, OTRO] }
    CategoriaServicio: { type: string, enum: [BLOG, REDES_SOCIALES, ESTATICOS, AUDIOVISUAL, PAID_MEDIA, WEB, CRM] }
    EstadoServicio: { type: string, enum: [ACTIVO, PAUSADO, FINALIZADO, NO_CONTRATADO] }
    EstadoOperativo:
      type: string
      enum: [AL_DIA, EN_CURSO, ATENCION]
      description: 'Calculado. ATENCION si hay piezas atrasadas, tickets fuera de SLA o gasto de IA ≥ umbral; AL_DIA si no hay nada pendiente; EN_CURSO en otro caso.'
    ColumnaBandeja: { type: string, enum: [BORRADOR, EN_REVISION, APROBADO, CAMBIOS_SOLICITADOS, PUBLICADO] }
    TipoPieza: { type: string, enum: [BLOG, COPY, ESTATICO, CARRUSEL, PORTADA, GUION, SHOTLIST, STORYBOARD, PROTOTIPO_WEB, ANUNCIO, REPORTE] }
    EstadoPieza:
      type: string
      enum: [BORRADOR, EN_REVISION_INTERNA, LISTO_REVISION, APROBADO_CLIENTE, CAMBIOS_SOLICITADOS, PUBLICADO, EN_PRODUCCION]
      description: |
        `EN_PRODUCCION` solo aparece en respuestas a usuarios CLIENTE: reemplaza a BORRADOR y EN_REVISION_INTERNA.
        Etiquetas para la UI: EN_PRODUCCION «En producción», LISTO_REVISION «Listo para revisión»,
        APROBADO_CLIENTE «Aprobada», CAMBIOS_SOLICITADOS «Cambios solicitados», PUBLICADO «Publicado».
    AccionPieza:
      type: string
      enum: [APROBAR, SOLICITAR_CAMBIOS, COMENTAR, DESCARGAR, ENVIAR_REVISION_INTERNA, LIBERAR_A_CLIENTE, RETIRAR, MARCAR_PUBLICADO, SUBIR_VERSION]
    EstadoCalendario: { type: string, enum: [PROPUESTO, CAMBIOS_SOLICITADOS, APROBADO_PLAN] }
    EstadoIdea: { type: string, enum: [PROPUESTA, ELEGIDA, DESCARTADA] }
    CanalDecision: { type: string, enum: [PORTAL, PANEL, TELEGRAM, SLACK, SISTEMA] }
    CategoriaTicket: { type: string, enum: [MARKETING, DISENO, WEB, FACTURACION, OTRO] }
    UrgenciaTicket: { type: string, enum: [BAJA, MEDIA, ALTA, CRITICA] }
    EstadoTicket: { type: string, enum: [ABIERTO, EN_PROCESO, ESPERANDO_CLIENTE, RESUELTO, CERRADO] }
    EstadoHito: { type: string, enum: [SIN_INICIAR, EN_PROGRESO, EN_REVISION, COMPLETADO, BLOQUEADO] }
    EstadoEjecucion: { type: string, enum: [EN_CURSO, OK, ERROR, CANCELADA] }

    # ---------- sesión y clientes
    Usuario:
      type: object
      required: [id, nombre, email, tipo]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        email: { type: string, format: email }
        cargo: { type: [string, 'null'], examples: [Administradora] }
        iniciales: { type: string, examples: [VM] }
        tipo: { $ref: '#/components/schemas/TipoUsuario' }
        rolEquipo: { oneOf: [ { $ref: '#/components/schemas/RolEquipo' }, { type: 'null' } ] }
    PersonaMini:
      type: object
      required: [id, nombre]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        cargo: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
    Sesion:
      type: object
      required: [usuario, clientes, notificacionesSinLeer]
      properties:
        usuario: { $ref: '#/components/schemas/Usuario' }
        notificacionesSinLeer: { type: integer, description: Punto de la campana }
        clientes:
          type: array
          description: Para EQUIPO viene vacío (ve todos vía /clientes)
          items:
            type: object
            required: [clienteId, nombre, rol]
            properties:
              clienteId: { type: string, format: uuid }
              nombre: { type: string }
              rol: { $ref: '#/components/schemas/RolCliente' }
    Notificacion:
      type: object
      required: [id, tipo, titulo, leida, creadoEn]
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, enum: [PIEZAS_LISTAS, PIEZA_APROBADA, CAMBIOS_REGISTRADOS, TICKET_CREADO, TICKET_RESPONDIDO, TICKET_RESUELTO, BRIEF_RECIBIDO, ALERTA_GASTO_IA] }
        clienteId: { type: [string, 'null'], format: uuid }
        titulo: { type: string }
        cuerpo: { type: [string, 'null'] }
        enlace: { type: [string, 'null'], description: Ruta interna del portal }
        leida: { type: boolean }
        creadoEn: { type: string, format: date-time }
    Marca:
      type: object
      properties:
        descripcion: { type: string }
        mensajeCentral: { type: string, examples: [Cuida tu piel. Vuelve a ti.] }
        campanaActual: { type: string, examples: ['Campaña de octubre: «Tu ritual, tu momento».'] }
        valores: { type: array, items: { type: string } }
        paleta: { type: array, items: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' } }
        tipografias: { type: array, items: { type: string } }
        logoArchivoId: { type: [string, 'null'], format: uuid }
    Tono:
      type: object
      properties:
        etiquetas: { type: array, items: { type: string }, examples: [[Cercano, Consciente, Sereno]] }
        descripcion: { type: string }
        ejemplo: { type: string, examples: ['«Entre tantos pendientes, regálate una pausa.»'] }
    Publico:
      type: object
      properties:
        descripcion: { type: string }
        intereses: { type: array, items: { type: string } }
        segmentos: { type: [string, 'null'] }
    ClienteEntrada:
      type: object
      properties:
        nombre: { type: string, minLength: 2 }
        marca: { $ref: '#/components/schemas/Marca' }
        tono: { $ref: '#/components/schemas/Tono' }
        publico: { $ref: '#/components/schemas/Publico' }
        contactoPrincipalId: { type: string, format: uuid }
        pilaresContenido: { type: array, items: { type: string } }
        canales: { type: array, items: { type: string, enum: [INSTAGRAM, FACEBOOK, LINKEDIN, TIKTOK, YOUTUBE, BLOG, WEB] } }
        wordpressUrl: { type: [string, 'null'], format: uri }
        accountManagerId: { type: string, format: uuid }
        limiteGastoIaUsd: { type: number, minimum: 0, description: Solo ADMIN }
        estado: { $ref: '#/components/schemas/EstadoCliente' }
    ClienteResumen:
      type: object
      required: [id, nombre, estado]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        slug: { type: string }
        estado: { $ref: '#/components/schemas/EstadoCliente' }
        logoUrl: { type: [string, 'null'], format: uri }
    Cliente:
      description: Ficha de cliente (panel) y perfil (portal)
      allOf:
        - $ref: '#/components/schemas/ClienteResumen'
        - type: object
          properties:
            marca: { $ref: '#/components/schemas/Marca' }
            tono: { $ref: '#/components/schemas/Tono' }
            publico: { $ref: '#/components/schemas/Publico' }
            pilaresContenido: { type: array, items: { type: string } }
            canales: { type: array, items: { type: string } }
            wordpressUrl: { type: [string, 'null'] }
            plan: { oneOf: [ { $ref: '#/components/schemas/PlanCliente' }, { type: 'null' } ] }
            contactoPrincipal: { oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ] }
            accountManager:
              description: '"Tu equipo de contacto" en el portal y "Responsable de cuenta" en la ficha'
              oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ]
            conteos:
              type: object
              properties:
                serviciosActivos: { type: integer }
                aprobacionesPendientes: { type: integer }
            driveUrl: { type: [string, 'null'], format: uri, description: Solo equipo }
            driveCarpetaId: { type: [string, 'null'], description: Solo equipo }
            limiteGastoIaUsd: { type: number, description: Solo equipo }
            creadoEn: { type: string, format: date-time }
    InicioCliente:
      type: object
      required: [periodo, indicadores, avanceMes, pendientes, servicios, ticketsAbiertos]
      properties:
        periodo: { $ref: '#/components/schemas/Periodo' }
        indicadores:
          type: object
          required: [serviciosActivos, porAprobar, ticketsAbiertos]
          properties:
            serviciosActivos: { type: integer }
            porAprobar: { type: integer, description: También es el contador del menú "Entregables por revisar" }
            ticketsAbiertos: { type: integer }
            ideasPorElegir: { type: integer }
        plan: { oneOf: [ { $ref: '#/components/schemas/PlanCliente' }, { type: 'null' } ] }
        avanceMes: { $ref: '#/components/schemas/ProgresoPiezas' }
        pendientes: { type: array, description: 'Piezas en LISTO_REVISION, ordenadas por fecha', items: { $ref: '#/components/schemas/PiezaResumen' } }
        servicios:
          type: array
          description: Solo los contratados
          items:
            type: object
            required: [categoria, nombre, cantidadMensual, unidad, estado]
            properties:
              categoria: { $ref: '#/components/schemas/CategoriaServicio' }
              nombre: { type: string }
              cantidadMensual: { type: integer }
              unidad: { type: string }
              estado: { $ref: '#/components/schemas/EstadoServicio' }
        proximaPublicacion:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            titulo: { type: string }
            fechaProgramada: { type: string, format: date-time }
        ticketsAbiertos:
          type: array
          items:
            type: object
            required: [id, codigo, asunto, estado]
            properties:
              id: { type: string, format: uuid }
              codigo: { type: string }
              asunto: { type: string }
              estado: { $ref: '#/components/schemas/EstadoTicket' }
    Miembro:
      type: object
      required: [usuarioId, nombre, email, rol]
      properties:
        usuarioId: { type: string, format: uuid }
        nombre: { type: string }
        email: { type: string, format: email }
        rol: { $ref: '#/components/schemas/RolCliente' }
        invitacionPendiente: { type: boolean }

    # ---------- referencias y briefs
    ReferenciaEntrada:
      type: object
      required: [titulo]
      properties:
        tipo: { $ref: '#/components/schemas/TipoReferencia' }
        titulo: { type: string, description: '"Nombre o contexto"' }
        url: { type: string, format: uri }
        archivoId: { type: string, format: uuid }
        notas: { type: string, description: 'Qué tomar como inspiración ("Solo como inspiración. No replicar contenido.")' }
        paleta: { type: array, items: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' } }
    Referencia:
      allOf:
        - $ref: '#/components/schemas/ReferenciaEntrada'
        - type: object
          required: [id, creadoEn]
          properties:
            id: { type: string, format: uuid }
            archivo: { oneOf: [ { $ref: '#/components/schemas/ArchivoMini' }, { type: 'null' } ] }
            creadoEn: { type: string, format: date-time }
    Brief:
      type: object
      required: [periodo, estado, archivos]
      properties:
        id: { type: [string, 'null'], format: uuid, description: null si todavía no se guardó }
        periodo: { $ref: '#/components/schemas/Periodo' }
        estado: { type: string, enum: [BORRADOR, ENVIADO, CONFIRMADO] }
        objetivoComunicacion: { type: [string, 'null'] }
        consideraciones: { type: [string, 'null'], description: '"¿Qué debemos tener en cuenta?"' }
        contenidoMd: { type: [string, 'null'], description: Solo equipo }
        driveFileId: { type: [string, 'null'], description: Solo equipo }
        archivos: { type: array, description: Archivos subidos a este brief (SUBIDO o DISPONIBLE), items: { $ref: '#/components/schemas/Archivo' } }
        enviadoPor: { oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ] }
        enviadoEn: { type: [string, 'null'], format: date-time }
        confirmadoEn: { type: [string, 'null'], format: date-time }
        actualizadoEn: { type: [string, 'null'], format: date-time }
    ServicioContratadoEntrada:
      type: object
      required: [servicioCodigo, fechaInicio]
      properties:
        servicioCodigo: { type: string }
        planId: { type: string, format: uuid }
        alcance: { type: string }
        fechaInicio: { type: string, format: date }
        fechaFin: { type: [string, 'null'], format: date }
        inooworkProyectoId: { type: string }
        entregables:
          type: array
          items:
            type: object
            required: [tipoPieza, cantidadMensual]
            properties:
              tipoPieza: { $ref: '#/components/schemas/TipoPieza' }
              cantidadMensual: { type: integer, minimum: 1 }
    ServicioCatalogo:
      type: object
      required: [codigo, nombre, categoria, unidad]
      properties:
        codigo: { type: string }
        nombre: { type: string }
        categoria: { $ref: '#/components/schemas/CategoriaServicio' }
        descripcion: { type: [string, 'null'] }
        unidad: { type: string, examples: [artículos, piezas, diseños] }
    PlanCliente:
      type: object
      required: [nombre]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, examples: [Plan Crecimiento] }
        fechaInicio: { type: string, format: date }
        fechaFin: { type: [string, 'null'], format: date }
        tieneContrato: { type: boolean, description: Si hay PDF para "Ver contrato" }
    ProgresoPiezas:
      type: object
      description: 'Entregada = disponible para revisión o aprobada. porcentaje = aprobadas / totales (las aprobadas incluyen las publicadas).'
      required: [totales, aprobadas, porRevisar, enProduccion, porcentaje]
      properties:
        totales: { type: integer, description: Cuota contratada del mes }
        entregadas: { type: integer }
        aprobadas: { type: integer }
        publicadas: { type: integer }
        porRevisar: { type: integer }
        enProduccion: { type: integer }
        porcentaje: { type: integer, minimum: 0, maximum: 100 }
    ServicioCliente:
      type: object
      description: Un servicio del catálogo visto desde un cliente; `contratado` false para los no contratados.
      required: [categoria, nombre, unidad, contratado, estado, cantidadMensual]
      properties:
        categoria: { $ref: '#/components/schemas/CategoriaServicio' }
        nombre: { type: string }
        descripcion: { type: [string, 'null'] }
        unidad: { type: string }
        contratado: { type: boolean }
        servicioContratadoId: { type: [string, 'null'], format: uuid }
        estado: { $ref: '#/components/schemas/EstadoServicio' }
        alcance: { type: [string, 'null'] }
        fechaInicio: { type: [string, 'null'], format: date }
        fechaFin: { type: [string, 'null'], format: date }
        cantidadMensual: { type: integer, description: Suma de los entregables incluidos }
        progreso: { oneOf: [ { $ref: '#/components/schemas/ProgresoPiezas' }, { type: 'null' } ] }
        entregables:
          type: array
          description: Detalle por tipo de pieza
          items:
            type: object
            required: [tipoPieza, cantidadMensual]
            properties:
              tipoPieza: { $ref: '#/components/schemas/TipoPieza' }
              cantidadMensual: { type: integer }
    ServiciosCliente:
      type: object
      required: [periodo, servicios, resumenMes]
      properties:
        periodo: { $ref: '#/components/schemas/Periodo' }
        plan: { oneOf: [ { $ref: '#/components/schemas/PlanCliente' }, { type: 'null' } ] }
        resumenMes: { $ref: '#/components/schemas/ProgresoPiezas' }
        servicios: { type: array, description: 'Todo el catálogo, contratados primero', items: { $ref: '#/components/schemas/ServicioCliente' } }
    Hito:
      type: object
      required: [id, titulo, estado]
      properties:
        id: { type: string, format: uuid }
        grupo: { type: [string, 'null'] }
        titulo: { type: string, examples: [Planificación, Producción, Revisión, Publicación] }
        estado: { $ref: '#/components/schemas/EstadoHito' }
        fechaInicio: { type: [string, 'null'], format: date }
        fechaFin: { type: [string, 'null'], format: date }
        esperaCliente: { type: boolean, description: 'true → "Tu siguiente paso"' }
        nota: { type: [string, 'null'], examples: [Por pieza aprobada] }
        responsableNombre: { type: [string, 'null'] }
    AvanceServicio:
      type: object
      required: [servicioContratadoId, hitos, sincronizadoEn]
      properties:
        servicioContratadoId: { type: string, format: uuid }
        categoria: { $ref: '#/components/schemas/CategoriaServicio' }
        nombre: { type: string }
        estado: { type: string, enum: [SIN_INICIAR, EN_CURSO, COMPLETADO, PAUSADO] }
        progreso: { $ref: '#/components/schemas/ProgresoPiezas' }
        hitos: { type: array, items: { $ref: '#/components/schemas/Hito' } }
        siguientePaso:
          type: [object, 'null']
          properties:
            texto: { type: string, examples: ['Revisar «5 hábitos para una piel saludable» y confirmar la idea pendiente.'] }
            responsable: { $ref: '#/components/schemas/PersonaMini' }
        sincronizadoEn: { type: string, format: date-time }
    AvanceCliente:
      type: object
      required: [periodo, resumenMes, servicios, noContratados]
      properties:
        periodo: { $ref: '#/components/schemas/Periodo' }
        resumenMes: { $ref: '#/components/schemas/ProgresoPiezas' }
        piezasPorRevisar:
          type: array
          description: '"Tu revisión mantiene el ritmo"'
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              titulo: { type: string }
              fechaProgramada: { type: string, format: date-time }
        servicios: { type: array, items: { $ref: '#/components/schemas/AvanceServicio' } }
        noContratados: { type: array, items: { $ref: '#/components/schemas/ServicioCatalogo' } }
    PiezaResumen:
      type: object
      required: [id, tipo, titulo, periodo, estado]
      properties:
        id: { type: string, format: uuid }
        clienteId: { type: string, format: uuid }
        clienteNombre: { type: string, description: Solo en listados de varios clientes (bandeja) }
        tipo: { $ref: '#/components/schemas/TipoPieza' }
        titulo: { type: string }
        resumen: { type: [string, 'null'] }
        canal: { type: [string, 'null'] }
        periodo: { $ref: '#/components/schemas/Periodo' }
        fechaProgramada: { type: [string, 'null'], format: date-time }
        estado: { $ref: '#/components/schemas/EstadoPieza' }
        numeroVersion: { type: [integer, 'null'], description: 'Versión vigente; para el cliente, la enviada a revisión' }
        miniaturaUrl: { type: [string, 'null'], format: uri, description: URL firmada corta (15 min) }
        servicioContratadoId: { type: [string, 'null'], format: uuid }
        ideaSeleccionada: { type: boolean, description: La pieza nació de una idea elegida por el cliente }
        origen:
          type: object
          description: 'Solo equipo. "Hecha por agente de IA · Agente Editorial" o "Hecha por una persona · Diego Castro"'
          properties:
            tipo: { type: string, enum: [AGENTE, PERSONA] }
            nombre: { type: string }
        notaEstado: { type: [string, 'null'], description: 'Solo equipo. "Lista para programar", "Esperando al cliente"' }
        atrasada: { type: boolean }
        actualizadoEn: { type: string, format: date-time }
    PiezaEntrada:
      type: object
      required: [tipo, titulo, periodo]
      properties:
        tipo: { $ref: '#/components/schemas/TipoPieza' }
        titulo: { type: string }
        resumen: { type: string }
        canal: { type: string }
        periodo: { $ref: '#/components/schemas/Periodo' }
        fechaProgramada: { type: string, format: date-time }
        servicioContratadoId: { type: string, format: uuid }
        responsableId: { type: string, format: uuid }
        version: { $ref: '#/components/schemas/VersionEntrada' }
    Pieza:
      allOf:
        - $ref: '#/components/schemas/PiezaResumen'
        - type: object
          required: [clienteId, acciones]
          properties:
            clienteId: { type: string, format: uuid }
            calendarioId: { type: [string, 'null'], format: uuid }
            versionActual: { type: integer, description: Solo equipo }
            versionCliente: { type: [integer, 'null'], description: Versión enviada a revisión del cliente }
            version: { $ref: '#/components/schemas/VersionPieza' }
            etiquetas: { type: array, items: { type: string } }
            aptaPaidMedia: { type: boolean }
            responsable: { type: [object, 'null'], description: Solo equipo, properties: { id: { type: string }, nombre: { type: string } } }
            publicadoUrl: { type: [string, 'null'], format: uri }
            publicadoEn: { type: [string, 'null'], format: date-time }
            acciones:
              type: array
              description: Lo que ESTE usuario puede hacer ahora. El frontend pinta botones según esta lista, no según el estado.
              items: { $ref: '#/components/schemas/AccionPieza' }
    Decision:
      type: object
      required: [version]
      properties:
        version: { type: integer, description: '`versionCliente` que el usuario vio; si cambió → 409 VERSION_DESACTUALIZADA' }
        comentario: { type: string, maxLength: 5000 }
    ArchivoMini:
      type: object
      required: [id, nombre, mime]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        mime: { type: string }
        bytes: { type: [integer, 'null'] }
        miniaturaUrl: { type: [string, 'null'], format: uri }
    Fuente:
      type: object
      required: [url]
      properties:
        titulo: { type: string }
        url: { type: string, format: uri }
    VersionPieza:
      type: object
      required: [numero, autorTipo, contenido, creadoEn]
      properties:
        numero: { type: integer }
        actual: { type: boolean }
        autorTipo: { type: string, enum: [AGENTE, PERSONA] }
        agente: { type: [string, 'null'], description: Solo equipo }
        autor: { oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ], description: Solo equipo }
        contenido: { $ref: '#/components/schemas/ContenidoPieza' }
        fuentes: { type: array, items: { $ref: '#/components/schemas/Fuente' } }
        archivo: { oneOf: [ { $ref: '#/components/schemas/ArchivoMini' }, { type: 'null' } ] }
        portada: { oneOf: [ { $ref: '#/components/schemas/ArchivoMini' }, { type: 'null' } ] }
        vistaPreviaUrl: { type: [string, 'null'], format: uri }
        notaCambios: { type: [string, 'null'] }
        enviadaEn: { type: [string, 'null'], format: date-time, description: Cuándo se envió al cliente }
        enviadaPor: { oneOf: [ { $ref: '#/components/schemas/PersonaMini' }, { type: 'null' } ], description: 'Persona del equipo que la envió ("Diego Castro, Inoo")' }
        decision:
          description: 'Decisión del cliente sobre ESTA versión; una aprobación no se hereda a la siguiente'
          type: [object, 'null']
          properties:
            estado: { type: string, enum: [APROBADO_CLIENTE, CAMBIOS_SOLICITADOS] }
            usuarioNombre: { type: string }
            fecha: { type: string, format: date-time }
            comentario: { type: [string, 'null'] }
        creadoEn: { type: string, format: date-time }
    VersionEntrada:
      type: object
      required: [contenido]
      properties:
        contenido: { $ref: '#/components/schemas/ContenidoPieza' }
        fuentes: { type: array, items: { $ref: '#/components/schemas/Fuente' } }
        archivoId: { type: string, format: uuid }
        portadaArchivoId: { type: string, format: uuid }
        vistaPreviaUrl: { type: string, format: uri }
        notaCambios: { type: string }
        agente: { type: string, description: Obligatorio vía API key }
        ejecucionId: { type: string, format: uuid }
        enviarARevisionInterna: { type: boolean, default: true }
    ContenidoPieza:
      description: Estructura según el tipo de pieza (discriminador `tipo`).
      oneOf:
        - $ref: '#/components/schemas/ContenidoBlog'
        - $ref: '#/components/schemas/ContenidoCopy'
        - $ref: '#/components/schemas/ContenidoVisual'
        - $ref: '#/components/schemas/ContenidoGuion'
        - $ref: '#/components/schemas/ContenidoPrototipo'
        - $ref: '#/components/schemas/ContenidoGenerico'
      discriminator:
        propertyName: tipo
        mapping:
          BLOG: '#/components/schemas/ContenidoBlog'
          COPY: '#/components/schemas/ContenidoCopy'
          ANUNCIO: '#/components/schemas/ContenidoCopy'
          ESTATICO: '#/components/schemas/ContenidoVisual'
          CARRUSEL: '#/components/schemas/ContenidoVisual'
          PORTADA: '#/components/schemas/ContenidoVisual'
          GUION: '#/components/schemas/ContenidoGuion'
          SHOTLIST: '#/components/schemas/ContenidoGuion'
          STORYBOARD: '#/components/schemas/ContenidoGuion'
          PROTOTIPO_WEB: '#/components/schemas/ContenidoPrototipo'
          REPORTE: '#/components/schemas/ContenidoGenerico'
    ContenidoBlog:
      type: object
      required: [tipo, tituloSeo, cuerpoMd]
      properties:
        tipo: { type: string, enum: [BLOG] }
        tituloSeo: { type: string }
        metaDescripcion: { type: string, maxLength: 160 }
        slug: { type: string }
        cuerpoMd: { type: string, description: 'Markdown con H1/H2 (1200–1800 palabras, US-05)' }
        palabras: { type: integer }
    ContenidoCopy:
      type: object
      required: [tipo, red, copy]
      description: Salida JSON del subagente de copies (US-06)
      properties:
        tipo: { type: string, enum: [COPY, ANUNCIO] }
        red: { type: string, enum: [INSTAGRAM, FACEBOOK, LINKEDIN, TIKTOK] }
        copy: { type: string }
        hashtags: { type: array, items: { type: string } }
        cta: { type: string }
        sugerenciaVisual: { type: string }
        enfoque: { type: string, description: 'Solo variantes de anuncio: URGENCIA, BENEFICIO, PRUEBA_SOCIAL...' }
    ContenidoVisual:
      type: object
      required: [tipo, imagenes]
      properties:
        tipo: { type: string, enum: [ESTATICO, CARRUSEL, PORTADA] }
        formato: { type: string, examples: ['1080x1350', '1920x1080'] }
        imagenes:
          type: array
          items:
            type: object
            required: [archivoId, orden]
            properties:
              archivoId: { type: string, format: uuid }
              orden: { type: integer }
              etiqueta: { type: string, examples: [Portada], description: 'Se muestra como "Portada · 1 de 3"' }
              textoEnImagen: { type: string }
              url: { type: string, format: uri, description: 'Firmada; solo en respuestas' }
        copyAsociado: { type: string }
    ContenidoGuion:
      type: object
      required: [tipo, escenas]
      description: Paquete audiovisual (US-08), sin generación de video
      properties:
        tipo: { type: string, enum: [GUION, SHOTLIST, STORYBOARD] }
        objetivo: { type: string }
        gancho: { type: string, description: Primeros 3 segundos }
        cta: { type: string }
        duracionSeg: { type: integer }
        escenas:
          type: array
          items:
            type: object
            required: [orden]
            properties:
              orden: { type: integer }
              tiempo: { type: string, examples: ['00:00-00:03'] }
              tipoPlano: { type: string }
              angulo: { type: string }
              audio: { type: string, description: Audio / voz en off }
              indicacionVisual: { type: string }
              locacion: { type: string }
              duracionSeg: { type: integer }
    ContenidoPrototipo:
      type: object
      required: [tipo, vistaPreviaUrl]
      properties:
        tipo: { type: string, enum: [PROTOTIPO_WEB] }
        vistaPreviaUrl: { type: string, format: uri }
        repositorio: { type: string, description: Solo equipo }
        pullRequestUrl: { type: string, format: uri, description: Solo equipo }
        secciones: { type: array, items: { type: string } }
    ContenidoGenerico:
      type: object
      required: [tipo]
      properties:
        tipo: { type: string, enum: [REPORTE] }
        resumenMd: { type: string }
    EventoPieza:
      type: object
      required: [deEstado, aEstado, canal, creadoEn]
      properties:
        deEstado: { oneOf: [ { $ref: '#/components/schemas/EstadoPieza' }, { type: 'null' } ] }
        aEstado: { $ref: '#/components/schemas/EstadoPieza' }
        version: { type: [integer, 'null'] }
        usuario: { type: [object, 'null'], properties: { id: { type: string }, nombre: { type: string } } }
        canal: { $ref: '#/components/schemas/CanalDecision' }
        comentario: { type: [string, 'null'] }
        creadoEn: { type: string, format: date-time }
    AnclaComentario:
      type: [object, 'null']
      description: Para comentar un párrafo o un punto de una imagen
      properties:
        parrafo: { type: integer }
        imagenOrden: { type: integer }
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
    Comentario:
      type: object
      required: [id, autor, texto, interno, creadoEn]
      properties:
        id: { type: string, format: uuid }
        version: { type: [integer, 'null'] }
        autor:
          type: object
          required: [id, nombre, tipo]
          properties:
            id: { type: string }
            nombre: { type: string }
            tipo: { $ref: '#/components/schemas/TipoUsuario' }
        texto: { type: string }
        interno: { type: boolean }
        ancla: { $ref: '#/components/schemas/AnclaComentario' }
        creadoEn: { type: string, format: date-time }

    # ---------- planificación
    Calendario:
      type: object
      required: [id, periodo, estado, version, entradas]
      properties:
        id: { type: string, format: uuid }
        periodo: { $ref: '#/components/schemas/Periodo' }
        estado: { $ref: '#/components/schemas/EstadoCalendario' }
        version: { type: integer }
        resumen: { type: [string, 'null'] }
        aprobadoPor: { type: [object, 'null'], properties: { id: { type: string }, nombre: { type: string } } }
        aprobadoEn: { type: [string, 'null'], format: date-time }
        entradas: { type: array, items: { $ref: '#/components/schemas/PiezaResumen' } }
    PropuestaCalendario:
      type: object
      required: [clienteId, periodo, entradas]
      properties:
        clienteId: { type: string, format: uuid }
        periodo: { $ref: '#/components/schemas/Periodo' }
        briefId: { type: string, format: uuid }
        resumen: { type: string }
        ejecucionId: { type: string, format: uuid }
        entradas:
          type: array
          minItems: 1
          items:
            type: object
            required: [tipo, titulo, fechaProgramada]
            properties:
              tipo: { $ref: '#/components/schemas/TipoPieza' }
              titulo: { type: string }
              canal: { type: string }
              fechaProgramada: { type: string, format: date-time }
              objetivo: { type: string }
              pilar: { type: string }
              servicioContratadoId: { type: string, format: uuid }
    IdeaBlog:
      type: object
      required: [id, periodo, titulo, estado]
      properties:
        id: { type: string, format: uuid }
        periodo: { $ref: '#/components/schemas/Periodo' }
        titulo: { type: string }
        palabraClave: { type: [string, 'null'] }
        angulo: { type: [string, 'null'] }
        resumen: { type: [string, 'null'] }
        fuentes: { type: array, items: { $ref: '#/components/schemas/Fuente' } }
        estado: { $ref: '#/components/schemas/EstadoIdea' }
        piezaId: { type: [string, 'null'], format: uuid }
        decididoEn: { type: [string, 'null'], format: date-time }

    # ---------- archivos
    SubidaEntrada:
      type: object
      required: [nombre, mime, bytes, uso]
      properties:
        nombre: { type: string, maxLength: 255 }
        mime: { type: string, enum: [image/jpeg, image/png, video/mp4, application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document] }
        bytes: { type: integer, minimum: 1, maximum: 104857600 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        uso: { type: string, enum: [BRIEF, ADJUNTO_TICKET, BIBLIOTECA] }
        briefPeriodo: { $ref: '#/components/schemas/Periodo' }
        categoria: { type: string, enum: [FOTO, VIDEO, DOCUMENTO, LOGO, OTRO] }
        etiquetas: { type: array, items: { type: string } }
    SubidaIniciada:
      type: object
      required: [archivo, subida]
      properties:
        archivo: { $ref: '#/components/schemas/Archivo' }
        subida:
          type: object
          required: [metodo, url, headers, expiraEn]
          properties:
            metodo: { type: string, enum: [PUT] }
            url: { type: string, format: uri }
            headers: { type: object, additionalProperties: { type: string }, examples: [ { Content-Type: image/jpeg } ] }
            expiraEn: { type: string, format: date-time }
    Archivo:
      allOf:
        - $ref: '#/components/schemas/ArchivoMini'
        - type: object
          required: [estado, origen, creadoEn]
          properties:
            origen: { type: string, enum: [CLIENTE, EQUIPO, AGENTE] }
            categoria: { type: [string, 'null'] }
            etiquetas: { type: array, items: { type: string } }
            uso: { type: string, enum: [BRIEF, ADJUNTO_TICKET, BIBLIOTECA, ENTREGABLE, CONTRATO, INFORME] }
            estado: { type: string, enum: [PENDIENTE_SUBIDA, SUBIDO, DISPONIBLE, ELIMINADO], description: SUBIDO = en S3 pero el brief aún no se envió }
            declaraDerechos: { type: boolean }
            subidoPor: { type: [object, 'null'], properties: { id: { type: string }, nombre: { type: string } } }
            creadoEn: { type: string, format: date-time }

    # ---------- paid media
    ItemBiblioteca:
      type: object
      required: [origen, id, titulo]
      properties:
        origen: { type: string, enum: [PIEZA, ARCHIVO_CLIENTE] }
        id: { type: string, format: uuid }
        titulo: { type: string }
        tipo: { oneOf: [ { $ref: '#/components/schemas/TipoPieza' }, { type: 'null' } ] }
        etiquetas: { type: array, items: { type: string } }
        miniaturaUrl: { type: [string, 'null'], format: uri }
        aprobadoEn: { type: [string, 'null'], format: date-time }

    # ---------- reportes
    PuntoMetrica:
      type: object
      required: [fecha, valor]
      properties:
        fecha: { type: string, format: date }
        valor: { type: number }
    RangoFechas:
      type: object
      required: [desde, hasta]
      properties:
        desde: { type: string, format: date }
        hasta: { type: string, format: date }
    ReporteResultados:
      type: object
      required: [periodo, indicadores, canales, recorrido, esMuestra]
      properties:
        periodo: { $ref: '#/components/schemas/RangoFechas' }
        comparativa: { oneOf: [ { $ref: '#/components/schemas/RangoFechas' }, { type: 'null' } ] }
        esMuestra: { type: boolean }
        notas: { type: array, items: { type: string } }
        indicadores:
          type: array
          items:
            type: object
            required: [clave, etiqueta, valor]
            properties:
              clave: { type: string, enum: [ALCANCE, VISITAS_SITIO, CONTACTOS, CONVERSION, COMPRAS] }
              etiqueta: { type: string }
              valor: { type: number }
              unidad: { type: [string, 'null'] }
              detalle: { type: [string, 'null'] }
              variacionPct: { type: [number, 'null'] }
        canales:
          type: array
          description: Rendimiento por canal. Todas las series comparten escala en la UI.
          items:
            type: object
            required: [canal, metrica, total, puntos]
            properties:
              canal: { type: string, examples: [INSTAGRAM, FACEBOOK, BLOG] }
              metrica: { type: string, enum: [VISITAS_SITIO, ALCANCE, INTERACCIONES] }
              total: { type: number }
              variacionPct: { type: [number, 'null'], description: Frente al periodo de comparativa }
              puntos: { type: array, items: { $ref: '#/components/schemas/PuntoMetrica' } }
        recorrido:
          type: array
          description: Embudo del customer journey para el mismo periodo
          items:
            type: object
            required: [orden, nombre, valor]
            properties:
              orden: { type: integer }
              nombre: { type: string }
              descripcion: { type: [string, 'null'] }
              valor: { type: [number, 'null'] }
              pctEtapaAnterior: { type: [number, 'null'] }
              fuente: { type: string, enum: [MANUAL, META, GA4, CRM] }
        lectura: { type: [string, 'null'], description: '"Lo que nos dicen los datos"; solo si el equipo la publicó' }
        informeDisponible: { type: boolean }

    TicketEntrada:
      type: object
      required: [asunto, categoria, descripcion]
      properties:
        asunto: { type: string, minLength: 3, maxLength: 200 }
        categoria: { $ref: '#/components/schemas/CategoriaTicket' }
        descripcion: { type: string, minLength: 1, maxLength: 10000 }
        piezaId: { type: string, format: uuid }
        archivoIds: { type: array, items: { type: string, format: uuid } }
    Ticket:
      type: object
      required: [id, numero, codigo, asunto, categoria, estado, slaPrimeraRespuestaEn, creadoEn]
      properties:
        id: { type: string, format: uuid }
        numero: { type: integer }
        codigo: { type: string, examples: ['#1042'] }
        asunto: { type: string }
        categoria: { $ref: '#/components/schemas/CategoriaTicket' }
        estado: { $ref: '#/components/schemas/EstadoTicket' }
        resumenEstado: { type: [string, 'null'], examples: [Diego Castro está revisando tu solicitud.] }
        urgencia: { oneOf: [ { $ref: '#/components/schemas/UrgenciaTicket' }, { type: 'null' } ] }
        areaAsignada: { type: [string, 'null'] }
        asignadoNombre: { type: [string, 'null'] }
        piezaId: { type: [string, 'null'], format: uuid }
        slaPrimeraRespuestaEn: { type: string, format: date-time }
        primeraRespuestaEn: { type: [string, 'null'], format: date-time }
        resueltoEn: { type: [string, 'null'], format: date-time }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
    TicketDetalle:
      allOf:
        - $ref: '#/components/schemas/Ticket'
        - type: object
          required: [descripcion, mensajes]
          properties:
            descripcion: { type: string }
            mensajes: { type: array, items: { $ref: '#/components/schemas/MensajeTicket' } }
    MensajeTicket:
      type: object
      required: [id, autorNombre, texto, creadoEn]
      properties:
        id: { type: string, format: uuid }
        autorNombre: { type: string }
        autorTipo: { $ref: '#/components/schemas/TipoUsuario' }
        texto: { type: string }
        interno: { type: boolean, description: Solo equipo; al cliente nunca le llegan mensajes internos }
        adjuntos: { type: array, items: { $ref: '#/components/schemas/ArchivoMini' } }
        creadoEn: { type: string, format: date-time }

    # ---------- correos
    ReglaCorreo:
      type: object
      required: [evento, descripcion, activa]
      properties:
        evento: { type: string, examples: [pieza.lista_revision, ticket.resuelto] }
        descripcion: { type: string, examples: ['Te avisamos cuando una pieza está lista para tu revisión'] }
        destinatarios: { type: string, enum: [MIEMBROS_CLIENTE, ACCOUNT_MANAGER, AMBOS] }
        activa: { type: boolean }
    CorreoEnviado:
      type: object
      required: [id, para, asunto, estado, creadoEn]
      properties:
        id: { type: string, format: uuid }
        para: { type: string, format: email }
        asunto: { type: string }
        evento: { type: [string, 'null'] }
        estado: { type: string, enum: [PENDIENTE, ENVIADO, FALLIDO] }
        enviadoEn: { type: [string, 'null'], format: date-time }
        creadoEn: { type: string, format: date-time }

    # ---------- panel interno
    ResumenAgencia:
      type: object
      required: [clientesActivos, piezasAtrasadas, aprobacionesPendientes, gastoIaUsd, limiteIaUsd]
      properties:
        clientesActivos: { type: integer }
        piezasAtrasadas: { type: integer }
        atrasadasPorCliente: { type: array, items: { type: object, properties: { clienteNombre: { type: string }, atrasadas: { type: integer } } } }
        aprobacionesPendientes: { type: integer }
        gastoIaUsd: { type: number }
        limiteIaUsd: { type: number }
        pctLimite: { type: number }
        clientesSobreUmbral:
          type: array
          description: 'Banner "2 clientes llegaron al 80 % de su límite de IA"'
          items:
            type: object
            properties:
              clienteId: { type: string, format: uuid }
              clienteNombre: { type: string }
              gastoUsd: { type: number }
              limiteUsd: { type: number }
              pctLimite: { type: number }
    FilaPanelCliente:
      type: object
      required: [cliente, estadoOperativo, atrasadas, porAprobar, gastoIa]
      properties:
        cliente: { $ref: '#/components/schemas/ClienteResumen' }
        contactoPrincipalNombre: { type: [string, 'null'] }
        accountManagerNombre: { type: [string, 'null'] }
        estadoOperativo: { $ref: '#/components/schemas/EstadoOperativo' }
        atrasadas: { type: integer, description: Piezas con fechaProgramada vencida y no PUBLICADO }
        porAprobar: { type: integer }
        piezas:
          type: object
          description: Conteo por estado en el periodo
          additionalProperties: { type: integer }
        ticketsAbiertos: { type: integer }
        ticketsFueraSla: { type: integer }
        gastoIa:
          type: object
          required: [gastoUsd, limiteUsd, pctLimite, alerta]
          properties:
            gastoUsd: { type: number }
            limiteUsd: { type: number }
            pctLimite: { type: number }
            alerta: { type: boolean, description: 'pctLimite ≥ umbral ("Alerta · Umbral ≥ 80 %")' }
    BandejaProduccion:
      type: object
      required: [columnas, resumen]
      properties:
        resumen:
          type: object
          properties:
            total: { type: integer }
            atrasadas: { type: integer }
            aprobadas: { type: integer }
            publicadas: { type: integer }
            porRevisar: { type: integer }
            enProduccion: { type: integer }
        alertaGastoIa:
          type: [object, 'null']
          description: Solo cuando se filtra un cliente que superó el umbral
          properties:
            clienteNombre: { type: string }
            gastoUsd: { type: number }
            limiteUsd: { type: number }
            pctLimite: { type: number }
        columnas:
          type: array
          items:
            type: object
            required: [columna, total, piezas]
            properties:
              columna: { $ref: '#/components/schemas/ColumnaBandeja' }
              total: { type: integer }
              piezas: { type: array, items: { $ref: '#/components/schemas/PiezaResumen' } }
              siguienteCursor: { type: [string, 'null'] }
    ActividadCuenta:
      type: object
      required: [fecha, descripcion]
      properties:
        fecha: { type: string, format: date-time }
        usuarioNombre: { type: [string, 'null'] }
        descripcion: { type: string, examples: ['Aprobó la versión 1 de «Tu ritual, tu momento». No aplica a la versión actual.'] }
        piezaId: { type: [string, 'null'], format: uuid }
        etiqueta: { type: [string, 'null'], enum: [POR_REVISAR, APROBADA, CAMBIOS_SOLICITADOS, VERSION_ANTERIOR, null] }
    ReporteCostos:
      type: object
      required: [periodo, totalUsd, clientes]
      properties:
        periodo: { $ref: '#/components/schemas/Periodo' }
        totalUsd: { type: number }
        clientes:
          type: array
          items:
            type: object
            required: [clienteId, nombre, gastoUsd, limiteUsd, pctLimite, porModelo]
            properties:
              clienteId: { type: string, format: uuid }
              nombre: { type: string }
              gastoUsd: { type: number }
              limiteUsd: { type: number }
              pctLimite: { type: number }
              porModelo:
                type: array
                items:
                  type: object
                  properties:
                    modelo: { type: string }
                    tokensEntrada: { type: integer }
                    tokensSalida: { type: integer }
                    imagenes: { type: integer }
                    costoUsd: { type: number }
    Ejecucion:
      type: object
      required: [id, clienteId, agente, estado, iniciadoEn]
      properties:
        id: { type: string, format: uuid }
        clienteId: { type: string, format: uuid }
        clienteNombre: { type: string }
        agente: { type: string }
        estado: { $ref: '#/components/schemas/EstadoEjecucion' }
        piezaId: { type: [string, 'null'], format: uuid }
        costoUsd: { type: number }
        error: { type: [string, 'null'] }
        n8nExecutionUrl: { type: [string, 'null'], format: uri }
        iniciadoEn: { type: string, format: date-time }
        finalizadoEn: { type: [string, 'null'], format: date-time }

    # ---------- integraciones
    EjecucionEntrada:
      type: object
      required: [clienteId, agente, n8nExecutionId, estado]
      properties:
        clienteId: { type: string, format: uuid }
        agente: { type: string, enum: [marketing-jefe, contenido-blog, contenido-copies, estaticos, audiovisual-asistido, programacion, desarrollo-web, paid-media, soporte-triaje] }
        n8nWorkflowId: { type: string }
        n8nExecutionId: { type: string }
        piezaId: { type: string, format: uuid }
        estado: { $ref: '#/components/schemas/EstadoEjecucion' }
        error: { type: string }
        consumos:
          type: array
          description: El costo lo calcula la API con la tabla de tarifas vigente; n8n no envía montos.
          items:
            type: object
            required: [proveedor, modelo]
            properties:
              proveedor: { type: string, enum: [google, openai, anthropic, replicate] }
              modelo: { type: string }
              tokensEntrada: { type: integer, minimum: 0 }
              tokensSalida: { type: integer, minimum: 0 }
              imagenes: { type: integer, minimum: 0 }
    PiezaEntradaAgente:
      type: object
      required: [clienteId, tipo, titulo, periodo, version]
      properties:
        clienteId: { type: string, format: uuid }
        tipo: { $ref: '#/components/schemas/TipoPieza' }
        titulo: { type: string }
        periodo: { $ref: '#/components/schemas/Periodo' }
        canal: { type: string }
        fechaProgramada: { type: string, format: date-time }
        calendarioId: { type: string, format: uuid }
        servicioContratadoId: { type: string, format: uuid }
        piezaExistenteId: { type: string, format: uuid, description: 'Si el calendario ya creó la pieza, se completa en vez de duplicarla' }
        version: { $ref: '#/components/schemas/VersionEntrada' }
    SincronizacionInooWork:
      type: object
      properties:
        proyectos:
          type: array
          items:
            type: object
            required: [inooworkProyectoId, items]
            properties:
              inooworkProyectoId: { type: string, examples: [PROJ-ABC123] }
              items:
                type: array
                items:
                  type: object
                  required: [id, name, status]
                  description: Ítem tal como lo devuelve InooWork (groups[].items[]); `notes` se descarta
                  properties:
                    id: { type: string }
                    grupo: { type: string }
                    name: { type: string }
                    status: { type: string, enum: [Sin Iniciar, En Progreso, En Revisión, Completado, Bloqueado] }
                    assigneeName: { type: string }
                    dueDate: { type: [string, 'null'], format: date }
        tickets:
          type: array
          items:
            type: object
            required: [ticketId, estado]
            properties:
              ticketId: { type: string, format: uuid }
              inooworkRef: { type: string }
              estado: { $ref: '#/components/schemas/EstadoTicket' }
              areaAsignada: { type: string }
              urgencia: { $ref: '#/components/schemas/UrgenciaTicket' }
              urgenciaJustificacion: { type: string, description: "Por qué el agente de triaje eligió esa urgencia (solo equipo)" }
              asignadoNombre: { type: string }
              mensajes:
                type: array
                items:
                  type: object
                  required: [autorNombre, texto, creadoEn]
                  properties:
                    externoId: { type: string, description: Para deduplicar }
                    autorNombre: { type: string }
                    texto: { type: string }
                    interno: { type: boolean }
                    creadoEn: { type: string, format: date-time }
    EventoSaliente:
      type: object
      required: [id, tipo, ocurridoEn, datos]
      properties:
        id: { type: integer }
        tipo:
          type: string
          enum:
            - cliente.creado             # n8n crea carpetas en Drive y devuelve IDs (PATCH cliente)
            - brief.enviado              # el cliente envió brief, archivos y derechos; aviso al AM
            - brief.confirmado           # dispara al Jefe de Marketing
            - calendario.aprobado        # reparte tareas a subagentes y crea ítems en InooWork
            - calendario.cambios_solicitados
            - idea_blog.elegida
            - pieza.estado_cambiado      # incluye LISTO_REVISION (correo al cliente), CAMBIOS_SOLICITADOS (tarea InooWork), APROBADO_CLIENTE (programar)
            - comentario.creado
            - archivo.subido             # indexar en base de conocimiento del cliente
            - ticket.creado              # triaje con Gemini Flash-Lite y alta en InooWork
            - ticket.mensaje_cliente
            - ticket.estado_cambiado     # correo al cliente
            - presupuesto.alerta         # gasto IA ≥ umbral o ≥ límite
        ocurridoEn: { type: string, format: date-time }
        clienteId: { type: [string, 'null'], format: uuid }
        datos: { type: object }
