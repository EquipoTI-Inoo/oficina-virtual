              resumen: { type: [string, 'null'] }
        hallazgos: { type: array, maxItems: 6, items: { $ref: '#/components/schemas/PuntoTaller' } }
        recomendaciones: { type: array, maxItems: 6, items: { $ref: '#/components/schemas/PuntoTaller' } }
        flujograma: { type: array, maxItems: 40, items: { $ref: '#/components/schemas/PaginaFlujograma' } }
        promptPrototipo: { type: [string, 'null'], maxLength: 30000 }
        plantilla: { oneOf: [ { $ref: '#/components/schemas/PlantillaWeb' }, { type: 'null' } ] }
        bocetosAprobados: { type: array, items: { type: string }, description: 'Ids de las capturas que van al PDF; las demás quedan sin aprobar' }
