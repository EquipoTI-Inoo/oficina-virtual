        nombre: { type: string }
        dispositivo: { $ref: '#/components/schemas/DispositivoWeb' }
        imagenUrl: { type: string }
        htmlUrl: { type: [string, 'null'], description: El HTML que se fotografió }
        aprobado: { type: boolean, description: Solo las aprobadas van al PDF }
        simulada: { type: boolean }
        creadaEn: { type: string, format: date-time }
