          psql -h localhost -U inoo -d oficina_virtual -v ON_ERROR_STOP=1 -f database/migraciones/0028_correos_directos.sql
          psql -h localhost -U inoo -d oficina_virtual -v ON_ERROR_STOP=1 -f database/migraciones/0029_horario_correos.sql
      - name: Semillas
        run: psql -h localhost -U inoo -d oficina_virtual -v ON_ERROR_STOP=1 -f database/semillas/0001_casa_oliva.sql
      - name: Comprobaciones
        run: psql -h localhost -U inoo -d oficina_virtual -v ON_ERROR_STOP=1 -f database/pruebas/comprobaciones.sql

  contrato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx --yes @redocly/cli@latest lint docs/arquitectura/openapi.yaml
