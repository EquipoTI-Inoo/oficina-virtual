name: Actualizar capturas visuales

# 13 nov 2026: las capturas de referencia de e2e/visual.spec.ts son de Linux («-linux.png») y quedaron viejas con el
# cambio a la marca Inoo. Este flujo se corre a mano (Actions → «Actualizar capturas visuales» → Run workflow):
# las vuelve a sacar en Linux y las sube a la rama. Antes de correrlo, alguien debe haber revisado que el diseño
# actual es el aprobado.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capturas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/visual.spec.ts --project=escritorio --update-snapshots
      - name: Subir las capturas nuevas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual.spec.ts-snapshots
          if git diff --cached --quiet; then echo "Sin cambios en las capturas"; exit 0; fi
          git commit -m "Capturas visuales actualizadas (marca Inoo)"
          git push
